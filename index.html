<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Distributed Systems Ebook</title>
  <style>
    :root{--ink:#263238;--navy:#18324a;--burgundy:#7a263a;--gold:#c59b45;--cream:#fffaf0;--line:#dbcba8}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Georgia,"Times New Roman",serif;background:radial-gradient(circle at top,#fbf7ed,#e7dcc4 72%);color:var(--ink)}
    header{position:sticky;top:0;z-index:20;background:linear-gradient(110deg,var(--navy),#244d6c);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 22px;border-bottom:5px solid var(--gold);box-shadow:0 4px 18px #1d293755}
    h1{font-size:clamp(20px,3vw,31px);margin:0}
    .subtitle{font-size:13px;color:#f1ddb0}
    .header-actions{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
    .btn{border:1px solid #e8d39a;border-radius:999px;padding:10px 16px;font:750 14px system-ui;text-decoration:none;background:linear-gradient(#fffaf0,#eadcb9);color:var(--navy);cursor:pointer;transition:transform .2s,box-shadow .2s,background .2s}
    .btn:hover,.btn:focus-visible{transform:translateY(-2px);box-shadow:0 6px 14px #101c2855}
    .btn.active{background:linear-gradient(#9b3d54,var(--burgundy));border-color:#f0c976;color:#fff}
    .wrap{padding:14px 18px 24px;display:flex;flex-direction:column;align-items:center}
    .toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;justify-content:center;margin-bottom:12px;background:#fffaf0e8;border:1px solid var(--line);padding:9px 14px;border-radius:16px;font-family:system-ui}
    .toolbar button,.toolbar input{padding:9px 12px;border:1px solid #bda978;border-radius:9px;background:#fffdf7;color:var(--navy);font-weight:700}
    .toolbar button{cursor:pointer}
    .toolbar button:disabled{cursor:not-allowed;opacity:.55}
    .book-shell{width:min(1240px,97vw);height:calc(100vh - 170px);min-height:300px;display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:8px}
    .flip-book{display:none;filter:drop-shadow(0 14px 20px #362a2260)}
    .page{background:var(--cream);box-shadow:inset 0 0 0 1px #cbb98e;overflow:hidden;position:relative}
    .page canvas{width:100%;height:100%;object-fit:contain;background:#fff}
    .link-layer{position:absolute;inset:0;pointer-events:none}
    .pdf-link{position:absolute;pointer-events:auto;cursor:pointer;background:transparent;border:0;padding:0}
    .pdf-link:hover{background:#c59b4530;outline:2px solid #c59b45}
    .loading{padding:34px;background:#fffaf0;border:1px solid var(--line);border-radius:18px;text-align:center}
    .error{color:#8a1c2e}
    .watermark{position:absolute;bottom:12px;left:0;right:0;text-align:center;color:#7a263a42;font:800 14px system-ui;pointer-events:none}
    @media(max-width:700px){header{position:relative;flex-direction:column;align-items:flex-start;padding:10px}.header-actions{width:100%;justify-content:flex-start}.book-shell{height:calc(100vh - 285px)}.wrap{padding:8px}.toolbar{font-size:12px}.hint{display:none}.btn{padding:9px 12px;font-size:12px}}
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>
</head>
<body>
  <header>
    <div>
      <h1 id="pageTitle">Distributed Systems Ebook</h1>
      <div id="subtitle" class="subtitle">Clickable contents, embedded links, and interactive activities</div>
    </div>
    <nav class="header-actions" aria-label="Book selection and activities">
      <a id="ebookBtn" class="btn" href="./index.html">📘 Main Ebook</a>
      <a id="labBtn" class="btn" href="./index.html?book=lab">🧪 Lab Manual</a>
      <a class="btn" href="studio.html">Interactive Activities</a>
    </nav>
  </header>

  <main class="wrap">
    <div class="toolbar">
      <button id="prev" type="button">Previous</button>
      <span id="status" aria-live="polite">Preparing book...</span>
      <span class="hint">Table of contents and document links are clickable</span>
      <button id="next" type="button">Next</button>
      <label>Page <input id="pageNo" type="number" min="1" value="1" style="width:70px"></label>
    </div>

    <div class="book-shell">
      <div id="loading" class="loading">
        <h2>Loading the ebook</h2>
        <p>Pages and clickable links are being prepared.</p>
      </div>
      <div id="book" class="flip-book"></div>
    </div>
  </main>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const query=new URLSearchParams(window.location.search);
    const isLab=query.get('book')==='lab';
    const pdfFile=isLab?'LabManual-DistributedSystems.pdf':'Distributed_ebook_2025a.pdf';
    const currentTitle=isLab?'Distributed Systems Lab Manual':'Distributed Systems Ebook';
    const watermarkText=isLab?'DISTRIBUTED SYSTEMS LAB MANUAL':'DISTRIBUTED SYSTEMS EBOOK';

    const pageTitle=document.getElementById('pageTitle');
    const subtitle=document.getElementById('subtitle');
    const ebookBtn=document.getElementById('ebookBtn');
    const labBtn=document.getElementById('labBtn');
    const root=document.getElementById('book');
    const loading=document.getElementById('loading');
    const status=document.getElementById('status');
    const pageNo=document.getElementById('pageNo');
    const prev=document.getElementById('prev');
    const next=document.getElementById('next');

    document.title=currentTitle;
    pageTitle.textContent=currentTitle;
    subtitle.textContent=isLab?'Practical exercises, assignments, and laboratory material':'Clickable contents, embedded links, and interactive activities';
    (isLab?labBtn:ebookBtn).classList.add('active');

    let book,total=0,pdfDoc=null;

    async function targetPage(dest){
      try{
        const destination=typeof dest==='string'?await pdfDoc.getDestination(dest):dest;
        if(!destination)return null;
        const ref=destination[0];
        if(typeof ref==='object')return (await pdfDoc.getPageIndex(ref))+1;
        if(Number.isInteger(ref))return ref+1;
      }catch(error){}
      return null;
    }

    async function addLinks(pdfPage,pageDiv,viewport){
      const annotations=await pdfPage.getAnnotations({intent:'display'});
      const layer=document.createElement('div');
      layer.className='link-layer';

      for(const annotation of annotations){
        if(annotation.subtype!=='Link'||!annotation.rect)continue;

        const rect=viewport.convertToViewportRectangle(annotation.rect);
        const x=Math.min(rect[0],rect[2]);
        const y=Math.min(rect[1],rect[3]);
        const width=Math.abs(rect[2]-rect[0]);
        const height=Math.abs(rect[3]-rect[1]);
        const element=document.createElement('button');

        element.className='pdf-link';
        element.style.left=(x/viewport.width*100)+'%';
        element.style.top=(y/viewport.height*100)+'%';
        element.style.width=(width/viewport.width*100)+'%';
        element.style.height=(height/viewport.height*100)+'%';
        element.title=annotation.url?'Open external link':'Go to section';
        element.setAttribute('aria-label',element.title);
        element.addEventListener('pointerdown',event=>event.stopPropagation());
        element.addEventListener('click',async event=>{
          event.preventDefault();
          event.stopPropagation();
          if(annotation.url){
            window.open(annotation.url,'_blank','noopener');
          }else{
            const page=await targetPage(annotation.dest);
            if(page&&book){
              book.flip(page-1);
              status.textContent='Page '+page+' of '+total;
            }
          }
        });
        layer.appendChild(element);
      }
      pageDiv.appendChild(layer);
    }

    async function init(){
      try{
        pdfDoc=await pdfjsLib.getDocument(pdfFile).promise;
        total=pdfDoc.numPages;
        pageNo.max=total;

        for(let number=1;number<=total;number++){
          status.textContent='Preparing page '+number+' of '+total;
          const pdfPage=await pdfDoc.getPage(number);
          const viewport=pdfPage.getViewport({scale:1.3});
          const canvas=document.createElement('canvas');
          canvas.width=viewport.width;
          canvas.height=viewport.height;

          await pdfPage.render({canvasContext:canvas.getContext('2d'),viewport}).promise;

          const pageDiv=document.createElement('div');
          pageDiv.className='page';
          if(number===1)pageDiv.dataset.density='hard';
          pageDiv.appendChild(canvas);
          await addLinks(pdfPage,pageDiv,viewport);

          const watermark=document.createElement('div');
          watermark.className='watermark';
          watermark.textContent=watermarkText;
          pageDiv.appendChild(watermark);
          root.appendChild(pageDiv);
        }

        loading.style.display='none';
        root.style.display='block';

        book=new St.PageFlip(root,{
          width:550,
          height:730,
          size:'stretch',
          minWidth:220,
          maxWidth:650,
          minHeight:280,
          maxHeight:760,
          showCover:true,
          mobileScrollSupport:false,
          usePortrait:true,
          drawShadow:true,
          flippingTime:700
        });

        book.loadFromHTML(document.querySelectorAll('.page'));
        book.on('flip',event=>{
          status.textContent='Page '+(event.data+1)+' of '+total;
          pageNo.value=event.data+1;
        });
        status.textContent='Page 1 of '+total;
      }catch(error){
        loading.innerHTML='<h2 class="error">The '+(isLab?'lab manual':'ebook')+' could not be loaded</h2><p>Confirm that <strong>'+pdfFile+'</strong> is in the same folder as index.html.</p><small>'+error.message+'</small>';
        status.textContent='File not found';
      }
    }

    function goPage(){
      if(book)book.flip(Math.max(1,Math.min(total,Number(pageNo.value)||1))-1);
    }

    prev.onclick=()=>book&&book.flipPrev();
    next.onclick=()=>book&&book.flipNext();
    pageNo.onchange=goPage;
    init();
  </script>
</body>
</html>
