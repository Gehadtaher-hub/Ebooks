<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Distributed Systems Ebook</title>
<style>
:root{--ink:#263238;--navy:#18324a;--burgundy:#7a263a;--gold:#c59b45;--paper:#f7f0df;--cream:#fffaf0;--line:#dbcba8}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Georgia,"Times New Roman",serif;background:radial-gradient(circle at top,#fbf7ed,#e7dcc4 72%);color:var(--ink)}
header{position:sticky;top:0;z-index:20;background:linear-gradient(110deg,var(--navy),#244d6c);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 22px;border-bottom:5px solid var(--gold);box-shadow:0 4px 18px #1d293755}
h1{font-size:clamp(20px,3vw,31px);letter-spacing:.4px;margin:0}.subtitle{font-size:13px;color:#f1ddb0;margin-top:3px}.actions{display:flex;gap:9px;flex-wrap:wrap}.btn{border:1px solid #e8d39a;border-radius:999px;padding:10px 16px;font-family:system-ui,sans-serif;font-weight:750;cursor:pointer;text-decoration:none;background:linear-gradient(#fffaf0,#eadcb9);color:var(--navy);box-shadow:0 2px 7px #0003}.btn:hover{transform:translateY(-1px);background:#fff}.wrap{padding:14px 18px 24px;display:flex;flex-direction:column;align-items:center}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;justify-content:center;margin-bottom:12px;background:#fffaf0e8;border:1px solid var(--line);padding:9px 14px;border-radius:16px;box-shadow:0 4px 14px #5a463422;font-family:system-ui,sans-serif}.toolbar button,.toolbar input{padding:9px 12px;border:1px solid #bda978;border-radius:9px;background:#fffdf7;color:var(--navy);font-weight:700}.toolbar button:hover{background:#f1e2bd}.book-shell{width:min(1240px,97vw);height:calc(100vh - 170px);min-height:300px;display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:8px 4px 14px}.flip-book{display:none;filter:drop-shadow(0 14px 20px #362a2260)}.page{background:var(--cream);box-shadow:inset 0 0 0 1px #cbb98e;overflow:hidden;border-radius:2px}.page canvas{width:100%;height:100%;object-fit:contain;background:#fff}.loading{padding:34px;background:#fffaf0;border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 30px #4f3c292d;text-align:center;max-width:580px}.loading:before{content:"◆";display:block;color:var(--gold);font-size:34px}.error{color:#8a1c2e}.watermark{position:absolute;bottom:12px;left:0;right:0;text-align:center;color:#7a263a42;font-family:system-ui,sans-serif;font-weight:800;pointer-events:none}.hint{font-size:12px;color:#6d624f;font-family:system-ui,sans-serif}
@media(max-width:700px){header{align-items:flex-start;flex-direction:column;padding:10px 12px}.subtitle{display:none}.book-shell{height:calc(100vh - 225px);min-height:260px}.wrap{padding:8px}.toolbar{border-radius:12px;padding:7px}.btn{padding:9px 12px}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script><script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script></head>
<body oncontextmenu="return false"><header><div><h1>Distributed Systems Ebook</h1><div class="subtitle">An interactive academic reading experience</div></div><div class="actions"><a class="btn" href="studio.html">Interactive Activities</a></div></header><main class="wrap"><div class="toolbar"><button onclick="book.flipPrev()">Previous</button><span id="status">Preparing book...</span><span style="font-size:13px;color:#52657a">Use Previous, Next, page number, or drag a page corner</span><button onclick="book.flipNext()">Next</button><label>Page <input id="pageNo" type="number" min="1" value="1" style="width:70px" onchange="goPage()"></label></div><div class="book-shell"><div id="loading" class="loading"><h2>Loading the eBook</h2><p>The first opening may take a moment while pages are prepared.</p></div><div id="book" class="flip-book"></div></div></main>
<script>pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';let book,total=0;async function init(){try{const pdf=await pdfjsLib.getDocument('Distributed_ebook_2025a.pdf').promise;total=pdf.numPages;const root=document.getElementById('book');for(let n=1;n<=total;n++){document.getElementById('status').textContent='Preparing page '+n+' of '+total;const pg=await pdf.getPage(n),base=pg.getViewport({scale:1.35}),canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');canvas.width=base.width;canvas.height=base.height;await pg.render({canvasContext:ctx,viewport:base}).promise;const div=document.createElement('div');div.className='page';if(n===1)div.dataset.density='hard';div.appendChild(canvas);const wm=document.createElement('div');wm.className='watermark';wm.textContent='Distributed Systems Ebook';div.appendChild(wm);root.appendChild(div)}document.getElementById('loading').style.display='none';root.style.display='block';book=new St.PageFlip(root,{width:550,height:730,size:'stretch',minWidth:220,maxWidth:650,minHeight:280,maxHeight:760,showCover:true,mobileScrollSupport:false,usePortrait:true,drawShadow:true,flippingTime:700});book.loadFromHTML(document.querySelectorAll('.page'));book.on('flip',e=>{document.getElementById('status').textContent='Page '+(e.data+1)+' of '+total;document.getElementById('pageNo').value=e.data+1;document.querySelector('.book-shell').scrollTop=0});document.getElementById('status').textContent='Page 1 of '+total}catch(e){document.getElementById('loading').innerHTML='<h2 class="error">The eBook could not be loaded</h2><p>Confirm that Distributed_ebook_2025a.pdf is in the same portal folder and that the portal permits access to the two required JavaScript libraries.</p>'}}function goPage(){if(book){let n=Math.max(1,Math.min(total,+document.getElementById('pageNo').value||1));book.flip(n-1)}}init();</script></body></html>
