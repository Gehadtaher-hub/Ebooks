<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Distributed Systems Ebook</title><style>
:root{--ink:#263238;--navy:#18324a;--burgundy:#7a263a;--gold:#c59b45;--cream:#fffaf0;--line:#dbcba8}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Georgia,"Times New Roman",serif;background:radial-gradient(circle at top,#fbf7ed,#e7dcc4 72%);color:var(--ink)}header{position:sticky;top:0;z-index:20;background:linear-gradient(110deg,var(--navy),#244d6c);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 22px;border-bottom:5px solid var(--gold);box-shadow:0 4px 18px #1d293755}h1{font-size:clamp(20px,3vw,31px);margin:0}.subtitle{font-size:13px;color:#f1ddb0}.btn{border:1px solid #e8d39a;border-radius:999px;padding:10px 16px;font:750 14px system-ui;text-decoration:none;background:linear-gradient(#fffaf0,#eadcb9);color:var(--navy)}.wrap{padding:14px 18px 24px;display:flex;flex-direction:column;align-items:center}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;justify-content:center;margin-bottom:12px;background:#fffaf0e8;border:1px solid var(--line);padding:9px 14px;border-radius:16px;font-family:system-ui}.toolbar button,.toolbar input{padding:9px 12px;border:1px solid #bda978;border-radius:9px;background:#fffdf7;color:var(--navy);font-weight:700}.book-shell{width:min(1240px,97vw);height:calc(100vh - 170px);min-height:300px;display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:8px}.flip-book{display:none;filter:drop-shadow(0 14px 20px #362a2260)}.page{background:var(--cream);box-shadow:inset 0 0 0 1px #cbb98e;overflow:hidden;position:relative}.page canvas{width:100%;height:100%;object-fit:contain;background:#fff}.link-layer{position:absolute;inset:0;pointer-events:none}.pdf-link{position:absolute;pointer-events:auto;cursor:pointer;background:transparent;border:0;padding:0}.pdf-link:hover{background:#c59b4530;outline:2px solid #c59b45}.loading{padding:34px;background:#fffaf0;border:1px solid var(--line);border-radius:18px;text-align:center}.error{color:#8a1c2e}.watermark{position:absolute;bottom:12px;left:0;right:0;text-align:center;color:#7a263a42;font:800 14px system-ui;pointer-events:none}@media(max-width:700px){header{flex-direction:column;align-items:flex-start;padding:10px}.book-shell{height:calc(100vh - 225px)}.wrap{padding:8px}.toolbar{font-size:12px}}</style><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script><script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script></head><body><header><div><h1>Distributed Systems Ebook</h1><div class="subtitle">Clickable contents, embedded links, and interactive activities</div></div><a class="btn" href="studio.html">Interactive Activities</a></header><main class="wrap"><div class="toolbar"><button id="prev">Previous</button><span id="status">Preparing book...</span><span>Table of contents and YouTube links are clickable</span><button id="next">Next</button><label>Page <input id="pageNo" type="number" min="1" value="1" style="width:70px"></label></div><div class="book-shell"><div id="loading" class="loading"><h2>Loading the eBook</h2><p>Pages and clickable links are being prepared.</p></div><div id="book" class="flip-book"></div></div></main><script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';let book,total=0,pdfDoc=null;
async function targetPage(dest){try{const d=typeof dest==='string'?await pdfDoc.getDestination(dest):dest;if(!d)return null;const ref=d[0];if(typeof ref==='object')return (await pdfDoc.getPageIndex(ref))+1;if(Number.isInteger(ref))return ref+1}catch(e){}return null}
async function addLinks(pg,div,viewport){const anns=await pg.getAnnotations({intent:'display'});const layer=document.createElement('div');layer.className='link-layer';for(const a of anns){if(a.subtype!=='Link'||!a.rect)continue;const rect=viewport.convertToViewportRectangle(a.rect),x=Math.min(rect[0],rect[2]),y=Math.min(rect[1],rect[3]),w=Math.abs(rect[2]-rect[0]),h=Math.abs(rect[3]-rect[1]);const el=document.createElement('button');el.className='pdf-link';el.style.left=(x/viewport.width*100)+'%';el.style.top=(y/viewport.height*100)+'%';el.style.width=(w/viewport.width*100)+'%';el.style.height=(h/viewport.height*100)+'%';el.title=a.url?'Open external link':'Go to section';el.setAttribute('aria-label',el.title);el.addEventListener('pointerdown',e=>e.stopPropagation());el.addEventListener('click',async e=>{e.preventDefault();e.stopPropagation();if(a.url){window.open(a.url,'_blank','noopener')}else{const p=await targetPage(a.dest);if(p&&book){book.flip(p-1);status.textContent='Page '+p+' of '+total}}});layer.appendChild(el)}div.appendChild(layer)}
async function init(){try{pdfDoc=await pdfjsLib.getDocument('Distributed_ebook_2025a.pdf').promise;total=pdfDoc.numPages;const root=document.getElementById('book');for(let n=1;n<=total;n++){status.textContent='Preparing page '+n+' of '+total;const pg=await pdfDoc.getPage(n),vp=pg.getViewport({scale:1.3}),c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;const d=document.createElement('div');d.className='page';if(n===1)d.dataset.density='hard';d.appendChild(c);await addLinks(pg,d,vp);const wm=document.createElement('div');wm.className='watermark';wm.textContent='Distributed Systems Ebook';d.appendChild(wm);root.appendChild(d)}loading.style.display='none';root.style.display='block';book=new St.PageFlip(root,{width:550,height:730,size:'stretch',minWidth:220,maxWidth:650,minHeight:280,maxHeight:760,showCover:true,mobileScrollSupport:false,usePortrait:true,drawShadow:true,flippingTime:700});book.loadFromHTML(document.querySelectorAll('.page'));book.on('flip',e=>{status.textContent='Page '+(e.data+1)+' of '+total;pageNo.value=e.data+1});status.textContent='Page 1 of '+total}catch(e){loading.innerHTML='<h2 class="error">The eBook could not be loaded</h2><p>Confirm that Distributed_ebook_2025a.pdf is in the same folder.</p><small>'+e.message+'</small>'}}
function goPage(){if(book)book.flip(Math.max(1,Math.min(total,+pageNo.value||1))-1)}prev.onclick=()=>book&&book.flipPrev();next.onclick=()=>book&&book.flipNext();pageNo.onchange=goPage;init();</script></body></html>
