<style>:root{--bg:#eee5d3;--card:#fffaf0;--ink:#263238;--muted:#706654;--navy:#18324a;--blue:#7a263a;--line:#d8c8a4;--good:#2c6e49;--bad:#a23a3a;--warn:#9b6714;--gold:#c59b45}body.dark{--bg:#0d1722;--card:#172433;--ink:#edf5ff;--muted:#b5c1cf;--line:#35485c;--blue:#42a7df;--gold:#63d2ff}body.high{--bg:#000;--card:#000;--ink:#fff;--muted:#fff;--line:#fff;--blue:#ff0;--good:#0f0;--bad:#ff6b6b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#fbf7ed,var(--bg) 75%);color:var(--ink);font-family:Georgia,"Times New Roman",serif;font-size:var(--fs,16px)}header{position:sticky;top:0;z-index:9;background:linear-gradient(110deg,var(--navy),#244d6c);color:#fff;padding:12px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:5px solid var(--gold);box-shadow:0 3px 15px #0004}header h1{font-size:clamp(18px,4vw,27px);margin:0}.layout{display:grid;grid-template-columns:290px 1fr;min-height:100vh}aside{background:var(--card);border-right:1px solid var(--line);padding:14px;position:sticky;top:62px;height:calc(100vh - 62px);overflow:auto}main{max-width:1120px;width:100%;padding:22px;margin:auto}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:clamp(18px,4vw,30px);box-shadow:0 10px 28px #5b45251f;margin-bottom:18px}.nav,.btn{border:1px solid transparent;border-radius:10px;padding:11px 13px;font:750 14px system-ui;cursor:pointer}.nav{display:block;width:100%;margin:6px 0;text-align:left;background:color-mix(in srgb,var(--blue) 10%,var(--card));color:var(--ink)}.nav:hover{border-color:var(--gold)}.nav.active,.primary{background:var(--blue);color:#fff}.secondary{background:var(--card);color:var(--navy);border:1px solid var(--gold)}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:13px}.metric,.question,.badge,.term,.lab,.case,.builder,.sim{border:1px solid var(--line);border-radius:14px;padding:15px width:760px){header{position:relative;align-items:flex-start;flex-direction:column}.layout{display:block}aside{position:static;height:auto;display:flex;overflow-x:auto;padding:7px}.nav{min-width:155px;text-align:center}aside h3{display:none}main{padding:11px}}@media print{header,aside,.no-print{display:none!important}.layout{display:block}main{padding:0}.card{box-shadow:none}}</style></head><body>

<script>const bank=[{"topic":"Foundations","q":"A distributed system is best described as:","o":["Independent computers presented as one coherent system","One computer with many cores","A single database file","A network cable"],"a":0,"e":"Distribution coordinates autonomous computers through a network.","difficulty":"easy","id":"DS1"},{"topic":"Foundations","q":"Horizontal scaling means:","o":["Adding more machines","Adding RAM to one machine","Reducing users","Removing replicas"],"a":0,"e":"Horizontal scaling adds nodes rather than enlarging one node.","difficulty":"medium","id":"DS2"},{"topic":"Foundations","q":"Transparency attempts to:","o":["Hide selected distribution details","Eliminate security","Prevent replication","Guarantee zero latency"],"a":0,"e":"Transparency simplifies the user or application view.","difficulty":"hard","id":"DS3"},{"topic":"Foundations","q":"A partial failure occurs when:","o":["One component fails while others continue","Every component stops","No messages are sent","All replicas agree"],"a":0,"e":"Independent components can fail separately.","difficulty":"scenario","id":"DS4"},{"topic":"Foundations","q":"Elasticity is the ability to:","o":["Adjust resources to demand","Use one fixed server","Disable monitoring","Avoid networking"],"a":0,"e":"Elastic systems add or release capacity as demand changes.","difficulty":"easy","id":"DS5"},{"topic":"Foundations","q":"Message passing is fundamental because nodes usually:","o":["Do not share physical memory","Share every register","Use one process","Have zero delay"],"a":0,"e":"Networked machines coordinate by exchanging messages.","difficulty":"medium","id":"DS6"},{"topic":"Foundations","q":"A key distributed-systems challenge is:","o":["No global clock","Unlimited bandwidth","Perfect failure detection","Shared physical memory"],"a":0,"e":"Distributed nodes do not share one perfectly synchronized clock.","difficulty":"hard","id":"DS7"},{"topic":"Communication","q":"RPC primarily makes remote communication resemble:","o":["A local procedure call","A disk seek","A cache eviction","A clock tick"],"a":0,"e":"RPC wraps request and response messaging in a procedure-call abstraction.","difficulty":"easy","id":"DS8"},{"topic":"Communication","q":"Marshaling means:","o":["Encoding parameters for transmission","Choosing a leader","Invalidating a cache","Adding a replica"],"a":0,"e":"Arguments must be serialized before crossing a network.","difficulty":"medium","id":"DS9"},{"topic":"Communication","q":"A client stub normally:","o":["Builds and sends the request","Runs the server database","Changes remote memory directly","Elects a coordinator"],"a":0,"e":"The client stub converts a local call into a message.","difficulty":"hard","id":"DS10"},{"topic":"Communication","q":"Raw pointers are unsuitable for RPC because:","o":["Address spaces differ","Networks have no bytes","Servers have no memory","Pointers are always encrypted"],"a":0,"e":"An address in one process has no direct meaning in another.","difficulty":"scenario","id":"DS11"},{"topic":"Communication","q":"Idempotency is valuable because it makes:","o":["Retries safer","Clocks exact","Networks synchronous","Caches unnecessary"],"a":0,"e":"Repeating an idempotent operation does not multiply its intended effect.","difficulty":"easy","id":"DS12"},{"topic":"Communication","q":"A timeout prevents a client from:","o":["Waiting forever","Sending parameters","Using authentication","Receiving a response"],"a":0,"e":"Timeouts bound waiting when responses may be lost.","difficulty":"medium","id":"DS13"},{"topic":"Communication","q":"Asynchronous messaging lets a sender:","o":["Continue without waiting for immediate completion","Share memory","Guarantee delivery","Avoid serialization"],"a":0,"e":"The sender can proceed while processing occurs later.","difficulty":"hard","id":"DS14"},{"topic":"Architecture and Naming","q":"A master-worker architecture risks:","o":["A master bottleneck","No coordination","Unlimited capacity","No failures"],"a":0,"e":"The master can become overloaded or unavailable.","difficulty":"easy","id":"DS15"},{"topic":"Architecture and Naming","q":"P2P churn refers to:","o":["Peers joining and leaving","Clock adjustment","Cache replacement","RPC retries"],"a":0,"e":"Peer membership changes over time.","difficulty":"medium","id":"DS16"},{"topic":"Architecture and Naming","q":"Layering primarily organizes:","o":["Logical responsibilities","Physical clocks","Election IDs","Disk sectors"],"a":0,"e":"Layers separate concerns through interfaces.","difficulty":"hard","id":"DS17"},{"topic":"Architecture and Naming","q":"A stable name is useful because:","o":["An entity can move without changing identity","It removes resolution","It must be an IP address","It prevents delegation"],"a":0,"e":"Names can be rebound to new locations.","difficulty":"scenario","id":"DS18"},{"topic":"Architecture and Naming","q":"Name resolution maps a name to:","o":["Access information or an address","A Lamport clock","A cache policy","A voting result"],"a":0,"e":"Resolution turns names into usable location or identity data.","difficulty":"easy","id":"DS19"},{"topic":"Architecture and Naming","q":"Hierarchical naming scales through:","o":["Delegation","One global table","No servers","Random flooding only"],"a":0,"e":"Subtrees can be managed by different authorities.","difficulty":"medium","id":"DS20"},{"topic":"Architecture and Naming","q":"A directory service supports lookup by:","o":["Names or attributes","CPU registers","Disk heads","Time quanta"],"a":0,"e":"Directories associate descriptions with resources.","difficulty":"hard","id":"DS21"},{"topic":"Time and Ordering","q":"Lamport clocks guarantee:","o":["Causal events receive ordered timestamps","Exact wall-clock time","Concurrency detection in every case","Zero message delay"],"a":0,"e":"If A happened before B, Lamport(A) is less than Lamport(B).","difficulty":"easy","id":"DS22"},{"topic":"Time and Ordering","q":"Vector clocks can identify:","o":["Concurrency","Physical distance","Disk failure","Cache size"],"a":0,"e":"Incomparable vectors indicate concurrent events.","difficulty":"medium","id":"DS23"},{"topic":"Time and Ordering","q":"Clock skew is:","o":["Difference between readings at one instant","Difference in clock rates","A failed RPC","A replica conflict"],"a":0,"e":"Skew measures current disagreement.","difficulty":"hard","id":"DS24"},{"topic":"Time and Ordering","q":"Clock drift is:","o":["Difference in clock rates","Difference in names","Election failure","Cache expiry"],"a":0,"e":"Oscillators run at slightly different rates.","difficulty":"scenario","id":"DS25"},{"topic":"Time and Ordering","q":"Cristian's algorithm uses:","o":["A time server and round-trip estimate","A token ring","A quorum write","A hash ring"],"a":0,"e":"The client estimates one-way delay from round-trip time.","difficulty":"easy","id":"DS26"},{"topic":"Time and Ordering","q":"Berkeley's algorithm typically has a coordinator:","o":["Poll clocks and distribute adjustments","Use UTC without measurement","Delete slow nodes","Run two-phase commit"],"a":0,"e":"The coordinator computes an average and sends corrections.","difficulty":"medium","id":"DS27"},{"topic":"Time and Ordering","q":"The happened-before relation captures:","o":["Potential causality","Exact geographic time","Storage capacity","User identity"],"a":0,"e":"Program order and message exchange establish causal order.","difficulty":"hard","id":"DS28"},{"topic":"Coordination","q":"The Bully algorithm normally elects the active process with:","o":["Highest identifier","Lowest identifier","Oldest cache","Shortest message"],"a":0,"e":"Higher-ID processes dominate the election.","difficulty":"easy","id":"DS29"},{"topic":"Coordination","q":"Ring election forwards election information through:","o":["A logical ring","Shared memory","A database lock","A DNS tree"],"a":0,"e":"Participants pass identifiers around the ring.","difficulty":"medium","id":"DS30"},{"topic":"Coordination","q":"Distributed mutual exclusion ensures:","o":["One process enters a critical section","All processes enter together","No process waits","Messages are never lost"],"a":0,"e":"Conflicting access must be serialized.","difficulty":"hard","id":"DS31"},{"topic":"Coordination","q":"Ricart-Agrawala relies on:","o":["Timestamped request and reply messages","A central token only","Shared memory","Physical clock equality"],"a":0,"e":"Peers defer replies according to logical ordering.","difficulty":"scenario","id":"DS32"},{"topic":"Coordination","q":"A token-ring algorithm permits entry when a process:","o":["Holds the token","Has the lowest ID","Receives a heartbeat","Writes to a cache"],"a":0,"e":"The unique token grants permission.","difficulty":"easy","id":"DS33"},{"topic":"Coordination","q":"Consensus requires nonfaulty participants to:","o":["Agree on one value","Use one physical clock","Avoid messages","Store no state"],"a":0,"e":"Agreement is a central consensus property.","difficulty":"medium","id":"DS34"},{"topic":"Coordination","q":"Leader election is needed to:","o":["Choose a coordinator","Serialize every object","Resolve all names","Eliminate failures"],"a":0,"e":"A selected process can coordinate shared work.","difficulty":"hard","id":"DS35"},{"topic":"Replication and Consistency","q":"Replication can improve:","o":["Availability and read performance","Perfect consistency without protocols","Network bandwidth","Clock accuracy"],"a":0,"e":"Copies can serve reads and tolerate failures.","difficulty":"easy","id":"DS36"},{"topic":"Replication and Consistency","q":"Eventual consistency means replicas:","o":["Converge if updates stop","Are always identical","Use one server","Never conflict"],"a":0,"e":"Given time without new writes, replicas approach the same value.","difficulty":"medium","id":"DS37"},{"topic":"Replication and Consistency","q":"For strong quorum overlap, a common condition is:","o":["R + W > N","R + W < N","R = 0","W = 0"],"a":0,"e":"Overlapping read and write sets help expose recent writes.","difficulty":"hard","id":"DS38"},{"topic":"Replication and Consistency","q":"A write quorum should commonly satisfy:","o":["W > N/2 for overlapping writes","W = 0","W < 1","W equals cache size"],"a":0,"e":"Majority writes overlap each other.","difficulty":"scenario","id":"DS39"},{"topic":"Replication and Consistency","q":"Linearizability makes operations appear:","o":["Atomic and consistent with real-time order","Randomly ordered","Only eventually visible","Clock-free"],"a":0,"e":"Each operation appears to occur at one instant.","difficulty":"easy","id":"DS40"},{"topic":"Replication and Consistency","q":"A stale read returns:","o":["An older replica value","The newest committed value","No data","A logical timestamp only"],"a":0,"e":"Replica lag may expose previous data.","difficulty":"medium","id":"DS41"},{"topic":"Replication and Consistency","q":"A primary-backup design sends writes first to:","o":["The primary","Every client","A DNS server","The cache only"],"a":0,"e":"The primary orders updates before replication.","difficulty":"hard","id":"DS42"},{"topic":"Caching and Hashing","q":"A cache hit means:","o":["Requested data was found in cache","The source failed","A write was rejected","A leader changed"],"a":0,"e":"A hit avoids fetching from the backing service.","difficulty":"easy","id":"DS43"},{"topic":"Caching and Hashing","q":"TTL controls:","o":["How long cached data remains usable","Election priority","Vector length","Quorum size"],"a":0,"e":"Time-to-live limits cached-item lifetime.","difficulty":"medium","id":"DS44"},{"topic":"Caching and Hashing","q":"LRU evicts the item:","o":["Least recently used","Largest","Newest","Most frequently used"],"a":0,"e":"Recency approximates future reuse.","difficulty":"hard","id":"DS45"},{"topic":"Caching and Hashing","q":"Consistent hashing reduces key movement when:","o":["Nodes join or leave","Clocks drift","RPC times out","Quorums overlap"],"a":0,"e":"Only part of the ring is remapped.","difficulty":"scenario","id":"DS46"},{"topic":"Caching and Hashing","q":"Virtual nodes improve a hash ring by:","o":["Balancing load","Removing hashes","Guaranteeing consistency","Avoiding replicas"],"a":0,"e":"Multiple positions per server smooth distribution.","difficulty":"easy","id":"DS47"},{"topic":"Caching and Hashing","q":"Cache invalidation means:","o":["Marking stale cached data unusable","Electing a cache leader","Adding a node","Serializing data"],"a":0,"e":"Invalidation prevents known-old values from being served.","difficulty":"medium","id":"DS48"},{"topic":"Caching and Hashing","q":"A cache-aside application:","o":["Loads missing data and populates the cache","Writes only to cache","Never checks cache","Requires shared memory"],"a":0,"e":"The application explicitly manages misses and fills.","difficulty":"hard","id":"DS49"},{"topic":"Fault Tolerance and Transactions","q":"A heartbeat is used to:","o":["Monitor responsiveness","Resolve names","Order all events","Allocate cache lines"],"a":0,"e":"Missing heartbeats can trigger failure suspicion.","difficulty":"easy","id":"DS50"},{"topic":"Fault Tolerance and Transactions","q":"Failover means:","o":["Switching to a healthy redundant component","Deleting replicas","Retrying forever","Changing a name"],"a":0,"e":"Redundancy takes over after failure.","difficulty":"medium","id":"DS51"},{"topic":"Fault Tolerance and Transactions","q":"A checkpoint stores:","o":["Recoverable execution state","Only passwords","A hash-ring token","A DNS label"],"a":0,"e":"Recovery can resume from saved state.","difficulty":"hard","id":"DS52"},{"topic":"Fault Tolerance and Transactions","q":"Two-phase commit first asks participants to:","o":["Prepare or vote","Delete data","Choose a leader","Adjust clocks"],"a":0,"e":"The coordinator gathers votes before deciding commit or abort.","difficulty":"scenario","id":"DS53"},{"topic":"Fault Tolerance and Transactions","q":"A drawback of two-phase commit is:","o":["Blocking after coordinator failure","No messages","No atomicity goal","No participants"],"a":0,"e":"Prepared participants may wait for the decision.","difficulty":"easy","id":"DS54"},{"topic":"Fault Tolerance and Transactions","q":"A circuit breaker helps by:","o":["Stopping repeated calls to a failing service","Synchronizing clocks","Resolving names","Creating replicas"],"a":0,"e":"It limits cascading failures and allows recovery time.","difficulty":"medium","id":"DS55"},{"topic":"Fault Tolerance and Transactions","q":"Graceful degradation provides:","o":["Reduced service rather than total failure","Perfect service always","No monitoring","One node only"],"a":0,"e":"Essential functionality can remain available.","difficulty":"hard","id":"DS56"}];</script>
<script>
const app=document.getElementById('app'),who=document.getElementById('who');let profile=load('ds4_profile',{}),practice=load('ds4_practice',{}),history=load('ds4_history',[]),notes=load('ds4_labs',{}),run=null,tick=null,flashIndex=0;
function load(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}}function save(){localStorage.setItem('ds4_profile',JSON.stringify(profile));localStorage.setItem('ds4_practice',JSON.stringify(practice));localStorage.setItem('ds4_history',JSON.stringify(history));localStorage.setItem('ds4_labs',JSON.stringify(notes));who.textContent=profile.name||'Guest'}function esc(s){return String(s||'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}function shuffle(a){a=[...a];for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function go(n,b){clearInterval(tick);document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));if(b)b.classList.add('active');({home,study,challenge,simulators,labs,cases,exam:examSetup,instructor,builder,mastery,glossary,achievements,results,profile:profilePage}[n])()}
function home(){app.innerHTML=`<section class="card"><span class="tag">Advanced edition • ${bank.length}-question bank</span><h2>Welcome, ${esc(profile.name||'student')}</h2><p>This upgraded Studio adds interactive algorithms, guided laboratories, case studies, structured exams, instructor tools, architecture design, flashcards, and expanded analytics.</p><div class="grid"><div class="metric"><strong>${Object.keys(practice).length}</strong><br>questions practiced</div><div class="metric"><strong>${history.length}</strong><br>assessments</div><div class="metric"><strong>10</strong><br>simulators</div><div class="metric"><strong>8</strong><br>guided labs</div></div><h3>Quick start</h3><div class="row"><button class="btn primary" onclick="simulators()">Open Simulators</button><button class="btn secondary" onclick="labs()">Start a Lab</button><button class="btn secondary" onclick="examSetup()">Take an Exam</button><button class="btn secondary" onclick="builder()">Build Architecture</button></div></section>`}
function study(topic='Foundations'){let qs=bank.filter(q=>q.topic===topic);app.innerHTML=`<section class="card"><span class="tag">Study & Practice</span><h2>${topic}</h2><select onchange="study(this.value)">${[...new Set(bank.map(q=>q.topic))].map(t=>`<option ${t===topic?'selected':''}>${t}</option>`).join('')}</select>${qs.map(q=>`<div class="question"><b>${q.q}</b><div class="tiny">${q.difficulty} • ${q.id}</div>${q.o.map((o,j)=>`<label class="option"><input type="radio" name="${q.id}" onchange="practiceAnswer('${q.id}',${j})"> ${o}</label>`).join('')}<div id="f${q.id}"></div></div>`).join('')}</section>`}function practiceAnswer(id,s){let q=bank.find(x=>x.id===id);practice[id]={s,correct:s===q.a};save();document.getElementById('f'+id).innerHTML=(s===q.a?'<span class="good">Correct. </span>':'<span class="bad">Incorrect. </span>')+q.e}
function challenge(){startRun('Scenario Challenge',shuffle(bank.filter(q=>q.difficulty==='scenario')).slice(0,10),600,true,60)}
function simulators(){app.innerHTML=`<section class="card"><span class="tag">Algorithm Laboratory</span><h2>Distributed Systems Simulators</h2><div class="grid">
${simCard('Lamport Clock','Processes','lcP','3','Events per process','lcE','3','runLamport()','lcO')}
${simCard('Vector Clock','Processes','vcP','3','Selected event sequence','vcE','0:local,0:send:1,1:local,1:send:2','runVector()','vcO')}
${simCard("Cristian's Clock",'Server time','ctS','1000','Client send, receive','ctC','900,940','runCristian()','ctO')}
${simCard('Berkeley Clock','Clock values','bkC','10,14,12,8','Ignore outlier above','bkT','100','runBerkeley()','bkO')}
${simCard('Bully Election','Active process IDs','buP','1,2,4,5','Initiator','buI','2','runBully()','buO')}
${simCard('Ring Election','Ring IDs','rgP','3,7,2,9,5','Initiator','rgI','2','runRing()','rgO')}
${simCard('Quorum Calculator','Replicas N','qN','5','Read R, Write W','qRW','3,3','runQuorum()','qO')}
${simCard('Consistent Hash Ring','Servers','hsS','A,B,C','Keys','hsK','11,27,49,73,88','runHash()','hsO')}
${simCard('Cache Policies','References','caR','A,B,C,A,D,B,E,A','Capacity','caC','3','runCache()','caO')}
${simCard('Mutual Exclusion Cost','Processes','mxP','5','Algorithm','mxA','Ricart-Agrawala','runMutex()','mxO',true)}
</div></section>`}function simCard(t,l1,id1,v1,l2,id2,v2,fn,out,select=false){return`<div class="sim"><h3>${t}</h3><label>${l1}<input id="${id1}" value="${v1}"></label><label>${l2}${select?`<select id="${id2}"><option>Ricart-Agrawala</option><option>Centralized</option><option>Token Ring</option></select>`:`<input id="${id2}" value="${v2}">`}</label><button class="btn primary" onclick="${fn}">Run</button><div id="${out}" class="tiny"></div></div>`}function nums(s){return s.split(',').map(x=>+x.trim())}function runLamport(){let p=+lcP.value,e=+lcE.value,rows=[];for(let i=0;i<p;i++){let c=0,a=[];for(let j=0;j<e;j++)a.push(++c);rows.push(`P${i}: ${a.join(' → ')}`)}lcO.innerHTML=rows.join('<br>')+'<p>Local events increment the logical clock. Message receive uses max(local, received) + 1.</p>'}function runVector(){let p=+vcP.value,v=Array.from({length:p},()=>Array(p).fill(0)),log=[];vcE.value.split(',').forEach(x=>{let a=x.split(':'),i=+a[0];if(a[1]==='local')v[i][i]++;else if(a[1]==='send'){let j=+a[2];v[i][i]++;v[j]=v[j].map((n,k)=>Math.max(n,v[i][k]));v[j][j]++}log.push(`${x} ⇒ ${v.map(z=>'['+z+']').join(' ')}`)});vcO.innerHTML=log.join('<br>')}function runCristian(){let [send,receive]=nums(ctC.value),server=+ctS.value,rtt=receive-send,estimate=server+rtt/2;ctO.innerHTML=`RTT = ${rtt}; estimated server time at receipt = <b>${estimate}</b>; client adjustment = <b>${estimate-receive}</b>`}function runBerkeley(){let a=nums(bkC.value),t=+bkT.value,f=a.filter(x=>Math.abs(x-a.reduce((s,n)=>s+n,0)/a.length)<=t),avg=f.reduce((s,n)=>s+n,0)/f.length;bkO.innerHTML=`Average = <b>${avg.toFixed(2)}</b><br>Adjustments: ${a.map(x=>(avg-x).toFixed(2)).join(', ')}`}function runBully(){let a=nums(buP.value),i=+buI.value,h=a.filter(x=>x>i).sort((a,b)=>a-b),winner=Math.max(...a);buO.innerHTML=`${i} contacts higher IDs: ${h.join(', ')||'none'}<br>Coordinator: <b>${winner}</b>`}function runRing(){let a=nums(rgP.value),i=a.indexOf(+rgI.value);if(i<0)i=0;let path=[...a.slice(i),...a.slice(0,i)],winner=Math.max(...a);rgO.innerHTML=`Election path: ${path.join(' → ')} → ${path[0]}<br>Coordinator: <b>${winner}</b>`}function runQuorum(){let n=+qN.value,[r,w]=nums(qRW.value),rw=r+w>n,ww=2*w>n;qO.innerHTML=`Read/write overlap: <b class="${rw?'good':'bad'}">${rw?'Yes':'No'}</b><br>Write/write overlap: <b class="${ww?'good':'bad'}">${ww?'Yes':'No'}</b>`}function hashVal(x){let h=0;for(let c of x)h=(h*31+c.charCodeAt(0))%100;return h}function runHash(){let s=hsS.value.split(',').map(x=>x.trim()).filter(Boolean).map(x=>({n:x,h:hashVal(x)})).sort((a,b)=>a.h-b.h),keys=nums(hsK.value);hsO.innerHTML=`Ring: ${s.map(x=>x.n+'@'+x.h).join(' → ')}<br>${keys.map(k=>{let n=s.find(x=>x.h>=k)||s[0];return`Key ${k} → ${n.n}`}).join('<br>')}`}function runCache(){let refs=caR.value.split(',').map(x=>x.trim()),cap=+caC.value,run=alg=>{let c=[],hit=0,last={};refs.forEach((x,i)=>{if(c.includes(x))hit++;else if(c.length<cap)c.push(x);else{let v=alg==='FIFO'?c[0]:c.reduce((a,b)=>(last[a]??-1)<(last[b]??-1)?a:b);c.splice(c.indexOf(v),1);c.push(x)}last[x]=i});return hit};caO.innerHTML=`FIFO hits: <b>${run('FIFO')}</b>; LRU hits: <b>${run('LRU')}</b>`}function runMutex(){let n=+mxP.value,a=mxA.value,cost=a==='Centralized'?3:a==='Token Ring'?1:2*(n-1);mxO.innerHTML=`Estimated messages per critical-section entry: <b>${cost}</b>`}
const labsData=[['RPC and Idempotency','Design a retry-safe remote operation.'],['Lamport Clocks','Assign timestamps to local and message events.'],['Vector Clocks','Identify causal and concurrent events.'],['Clock Synchronization','Compare Cristian and Berkeley adjustments.'],['Leader Election','Trace Bully and ring election messages.'],['Mutual Exclusion','Compare centralized, token, and permission algorithms.'],['Replication and Quorums','Choose N, R, and W for a service.'],['Caching and Hashing','Evaluate cache policy and consistent-hash movement.']];function labs(){app.innerHTML=`<section class="card"><span class="tag">Guided laboratories</span><h2>Practical Lab Workspace</h2>${labsData.map((x,i)=>`<div class="lab"><h3>Lab ${i+1}: ${x[0]}</h3><p>${x[1]}</p><ol><li>State the objective and assumptions.</li><li>Run the related simulator or trace the algorithm.</li><li>Record the input, output, and interpretation.</li><li>Explain one limitation or failure case.</li></ol><textarea id="lab${i}" placeholder="Observations, calculations, and reflection...">${esc(notes[i]||'')}</textarea><button class="btn secondary" onclick="saveLab(${i})">Save Lab Notes</button></div>`).join('')}<button class="btn primary" onclick="exportLabs()">Export Lab Report</button></section>`}function saveLab(i){notes[i]=document.getElementById('lab'+i).value;save();alert('Lab notes saved.')}function exportLabs(){labsData.forEach((_,i)=>{let e=document.getElementById('lab'+i);if(e)notes[i]=e.value});save();download('distributed_systems_lab_report.txt',labsData.map((x,i)=>`LAB ${i+1}: ${x[0]}
${notes[i]||''}`).join('

'),'text/plain')}
const caseData=[['Global Video Platform','Design regional delivery, cache invalidation, and failover.'],['University Learning System','Support examinations, file delivery, and peak registration demand.'],['Banking Transactions','Balance consistency, availability, and transaction recovery.'],['Ride Sharing','Coordinate location updates, matching, and regional outages.'],['UAV Sensor Network','Handle intermittent links, trust, and replicated mission state.']];function cases(){app.innerHTML=`<section class="card"><span class="tag">Applied analysis</span><h2>Distributed-System Case Studies</h2>${caseData.map((x,i)=>`<div class="case"><h3>${x[0]}</h3><p>${x[1]}</p><details><summary>Analysis prompts</summary><ul><li>Choose an architecture and communication model.</li><li>Identify consistency and availability requirements.</li><li>Choose replication, caching, and failure-recovery strategies.</li><li>Identify monitoring and security controls.</li></ul></details></div>`).join('')}</section>`}
function examSetup(){app.innerHTML=`<section class="card"><span class="tag">Structured assessments</span><h2>Practice Exam Center</h2><div class="grid"><label>Exam type<select id="etype"><option>Quiz</option><option>Midterm</option><option selected>Final</option><option>Scenario</option><option>Calculation</option><option>Practical</option></select></label><label>Questions<select id="ecount"><option>10</option><option selected>20</option><option>30</option><option>40</option><option>50</option></select></label><label>Minutes<input id="emins" type="number" value="30"></label><label>Pass mark<input id="epass" type="number" value="60"></label></div><button class="btn primary" onclick="makeExam()">Start Exam</button></section>`}function makeExam(){let p=[...bank],t=etype.value;if(t==='Scenario')p=p.filter(q=>q.difficulty==='scenario');if(t==='Calculation')p=p.filter(q=>['Time and Ordering','Replication and Consistency','Caching and Hashing'].includes(q.topic));if(t==='Practical')p=p.filter(q=>['Communication','Coordination','Fault Tolerance and Transactions'].includes(q.topic));startRun(t+' Exam',shuffle(p).slice(0,Math.min(+ecount.value,p.length)),+emins.value*60,false,+epass.value)}
function instructor(){app.innerHTML=`<section class="card"><span class="tag">Instructor Mode</span><h2>Assessment Generator</h2><div class="grid"><label>Title<input id="ititle" value="Distributed Systems Assessment"></label><label>Topic<select id="itopic"><option>All</option>${[...new Set(bank.map(q=>q.topic))].map(t=>`<option>${t}</option>`).join('')}</select></label><label>Questions<input id="icount" type="number" value="20" min="1" max="${bank.length}"></label><label>Minutes<input id="imins" type="number" value="30"></label><label>Pass mark<input id="ipass" type="number" value="60"></label></div><div class="row"><button class="btn primary" onclick="launchInstructor()">Launch</button><button class="btn secondary" onclick="exportConfig()">Export Configuration</button><button class="btn secondary" onclick="answerKey()">Generate Answer Key</button></div><div id="iout"></div></section>`}function instructorPool(){let p=itopic.value==='All'?bank:bank.filter(q=>q.topic===itopic.value);return shuffle(p).slice(0,Math.min(+icount.value,p.length))}function launchInstructor(){startRun(ititle.value,instructorPool(),+imins.value*60,false,+ipass.value)}function exportConfig(){download('ds_exam_config.json',JSON.stringify({title:ititle.value,topic:itopic.value,count:+icount.value,minutes:+imins.value,pass:+ipass.value},null,2),'application/json')}function answerKey(){let p=instructorPool();iout.innerHTML=`<ol>${p.map(q=>`<li>${q.q}<br><b>${q.o[q.a]}</b></li>`).join('')}</ol>`}
const comps=['Client','Load Balancer','API Gateway','Service','Cache','Message Broker','Primary DB','Replica DB','Monitoring'];function builder(){app.innerHTML=`<section class="card"><span class="tag">Architecture Builder</span><h2>Design a Distributed Architecture</h2><p>Select components, then evaluate the design against basic resilience rules.</p><div>${comps.map((c,i)=>`<label class="component"><input type="checkbox" name="comp" value="${c}"> ${c}</label>`).join('')}</div><textarea id="designNotes" placeholder="Describe communication, consistency, replication, and recovery decisions."></textarea><button class="btn primary" onclick="evaluateDesign()">Evaluate Design</button><div id="buildOut"></div></section>`}function evaluateDesign(){let a=[...document.querySelectorAll('[name=comp]:checked')].map(x=>x.value),tips=[];if(!a.includes('Client'))tips.push('Add a client or external caller.');if(a.includes('Load Balancer')&&!a.includes('Service'))tips.push('A load balancer needs backend services.');if(a.includes('Primary DB')&&!a.includes('Replica DB'))tips.push('The database is a single point of failure.');if(a.includes('Cache'))tips.push('Define TTL or invalidation for the cache.');if(!a.includes('Monitoring'))tips.push('Add monitoring and failure detection.');buildOut.innerHTML=tips.length?`<ul class="warn">${tips.map(x=>`<li>${x}</li>`).join('')}</ul>`:'<p class="good">The design includes core resilience components. Review consistency and recovery details in the notes.</p>'}
function startRun(title,items,seconds,feedback,pass){run={title,items,seconds,feedback,pass,answers:{},flags:{},idx:0,start:Date.now()};renderRun();tick=setInterval(()=>{run.seconds--;let t=document.getElementById('timer');if(t)t.textContent=fmt(run.seconds);if(run.seconds<=0)submitRun()},1000)}function fmt(s){return Math.max(0,Math.floor(s/60))+':'+String(Math.max(0,s%60)).padStart(2,'0')}function renderRun(){let q=run.items[run.idx],s=run.answers[run.idx];app.innerHTML=`<section class="card"><div class="row" style="justify-content:space-between"><span class="tag">${run.title}</span><span class="timer" id="timer">${fmt(run.seconds)}</span></div><div class="navigator">${run.items.map((_,i)=>`<button class="${i===run.idx?'cur ':''}${run.answers[i]!==undefined?'ans ':''}${run.flags[i]?'flag':''}" onclick="jump(${i})">${i+1}</button>`).join('')}</div><div class="progress"><div style="width:${Object.keys(run.answers).length/run.items.length*100}%"></div></div><div class="question"><div class="tiny">${q.topic} • ${q.difficulty}</div><h2>${run.idx+1}. ${q.q}</h2>${q.o.map((o,j)=>`<label class="option"><input type="radio" name="r" ${s===j?'checked':''} onchange="runAnswer(${j})"> ${o}</label>`).join('')}${run.feedback&&s!==undefined?`<p>${s===q.a?'<span class="good">Correct. </span>':'<span class="bad">Incorrect. </span>'}${q.e}</p>`:''}</div><div class="row"><button class="btn secondary" onclick="jump(${Math.max(0,run.idx-1)})">Previous</button><button class="btn secondary" onclick="flag()">${run.flags[run.idx]?'Unflag':'Flag'}</button><button class="btn primary" onclick="jump(${Math.min(run.items.length-1,run.idx+1)})">Next</button><button class="btn secondary" onclick="submitRun()">Submit</button></div></section>`}function jump(i){run.idx=i;renderRun()}function flag(){run.flags[run.idx]=!run.flags[run.idx];renderRun()}function runAnswer(j){run.answers[run.idx]=j;renderRun()}function submitRun(){clearInterval(tick);let score=run.items.filter((q,i)=>run.answers[i]===q.a).length,pct=Math.round(score/run.items.length*100),by={};run.items.forEach((q,i)=>{by[q.topic]??=[0,0];by[q.topic][1]++;if(run.answers[i]===q.a)by[q.topic][0]++});let r={date:new Date().toISOString(),title:run.title,score,total:run.items.length,pct,pass:run.pass,time:Math.round((Date.now()-run.start)/1000),by};history.unshift(r);save();report(r)}
function mastery(){let topics=[...new Set(bank.map(q=>q.topic))];app.innerHTML=`<section class="card"><h2>Mastery Analytics</h2><table><tr><th>Topic</th><th>Attempted</th><th>Accuracy</th><th>Status</th></tr>${topics.map(t=>{let q=bank.filter(x=>x.topic===t),a=q.filter(x=>practice[x.id]),c=a.filter(x=>practice[x.id].correct).length,p=a.length?Math.round(c/a.length*100):0;return`<tr><td>${t}</td><td>${a.length}</td><td>${p}%</td><td>${p>=85?'Mastered':p>=70?'Proficient':p>=50?'Developing':'Needs review'}</td></tr>`}).join('')}</table></section>`}
const glossaryData=[['CAP theorem','During a network partition, a system must trade off consistency and availability.'],['Consensus','Agreement among distributed participants on one value.'],['Eventual consistency','Replicas converge if updates stop.'],['Idempotency','Repeated execution has the same intended effect as one execution.'],['Lamport clock','Scalar logical clock preserving happened-before order.'],['Linearizability','Operations appear atomic and respect real-time ordering.'],['Quorum','Subset of replicas required for an operation.'],['Vector clock','Logical clock that can distinguish causality and concurrency.'],['Consistent hashing','Hash-ring technique limiting remapping after membership changes.'],['Two-phase commit','Atomic commit protocol with prepare and decision phases.'],['Circuit breaker','Pattern that stops calls to a repeatedly failing service.'],['Gossip protocol','Peer-to-peer information dissemination through periodic exchanges.']];function glossary(){app.innerHTML=`<section class="card"><h2>Glossary & Flashcards</h2><input id="gsearch" placeholder="Search terms" oninput="drawTerms(this.value)"><div id="terms" class="grid"></div><h3>Flashcard Mode</h3><div id="flash" class="term flash" onclick="flipFlash()"></div><div class="row"><button class="btn secondary" onclick="nextFlash()">Next card</button><button class="btn secondary" onclick="flipFlash()">Flip</button></div></section>`;drawTerms('');showFlash(false)}function drawTerms(s){terms.innerHTML=glossaryData.filter(x=>(x[0]+' '+x[1]).toLowerCase().includes(s.toLowerCase())).map(x=>`<div class="term"><b>${x[0]}</b><p>${x[1]}</p></div>`).join('')}function showFlash(back){flash.dataset.back=back?'1':'0';flash.innerHTML=back?glossaryData[flashIndex][1]:`<b>${glossaryData[flashIndex][0]}</b>`}function flipFlash(){showFlash(flash.dataset.back!=='1')}function nextFlash(){flashIndex=(flashIndex+1)%glossaryData.length;showFlash(false)}
function achievements(){let best=Math.max(0,...history.map(x=>x.pct)),labsSaved=Object.keys(notes).length;app.innerHTML=`<section class="card"><h2>Achievements</h2><div class="grid">${[['First Assessment',history.length>0],['Exam Passed',history.some(x=>x.pct>=60)],['High Distinction',best>=85],['Laboratory Researcher',labsSaved>=4],['Complete Lab Portfolio',labsSaved>=8]].map(x=>`<div class="badge"><div class="big">${x[1]?'★':'☆'}</div><b>${x[0]}</b><p>${x[1]?'Earned':'Locked'}</p></div>`).join('')}</div>${history.some(x=>x.pct>=60)?'<button class="btn primary" onclick="certificate()">Generate Certificate</button>':''}</section>`}function certificate(){let best=Math.max(...history.map(x=>x.pct),0);app.innerHTML=`<section class="certificate"><h2>Certificate of Achievement</h2><p>This certifies that</p><h1>${esc(profile.name||'Student')}</h1><p>completed advanced Distributed Systems interactive activities.</p><h2>Best score: ${best}%</h2><p>${new Date().toLocaleDateString()}</p><button class="btn primary no-print" onclick="print()">Print</button></section>`}
function report(r){app.innerHTML=`<section class="card"><h2>${r.title} report</h2><div class="big">${r.score}/${r.total} (${r.pct}%)</div><p class="${r.pct>=r.pass?'good':'bad'}">${r.pct>=r.pass?'Passed':'Not passed'} • Time ${fmt(r.time)}</p><h3>Topic breakdown</h3><table>${Object.entries(r.by||{}).map(([t,v])=>`<tr><td>${t}</td><td>${v[0]}/${v[1]}</td></tr>`).join('')}</table><button class="btn primary no-print" onclick="print()">Print / Save PDF</button></section>`}function results(){app.innerHTML=`<section class="card"><h2>Assessment Reports</h2>${history.length?history.map((r,i)=>`<div class="question">${new Date(r.date).toLocaleString()} • ${r.title} • ${r.pct}% <button class="btn secondary" onclick="report(history[${i}])">View</button></div>`).join(''):'<p>No reports yet.</p>'}</section>`}
function profilePage(){app.innerHTML=`<section class="card"><h2>Profile & Backup</h2><div class="grid"><label>Name<input id="pn" value="${esc(profile.name||'')}"></label><label>Student ID<input id="pi" value="${esc(profile.id||'')}"></label><label>Group<input id="pg" value="${esc(profile.group||'')}"></label></div><div class="row"><button class="btn primary" onclick="saveProfile()">Save</button><button class="btn secondary" onclick="backup()">Export Progress</button><label class="btn secondary">Import Progress<input type="file" accept="application/json" class="hidden" onchange="restore(this.files[0])"></label></div></section>`}function saveProfile(){profile={name:pn.value,id:pi.value,group:pg.value};save();home()}function backup(){download('distributed_systems_progress.json',JSON.stringify({profile,practice,history,notes},null,2),'application/json')}function restore(f){let r=new FileReader;r.onload=()=>{try{let d=JSON.parse(r.result);profile=d.profile||{};practice=d.practice||{};history=d.history||[];notes=d.notes||{};save();home()}catch(e){alert('Invalid backup file')}};r.readAsText(f)}function download(n,d,t){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([d],{type:t}));a.download=n;a.click()}
function accessibility(){app.innerHTML=`<section class="card"><h2>Accessibility & Usability</h2><div class="row"><button class="btn secondary" onclick="document.body.classList.toggle('dark')">Dark mode</button><button class="btn secondary" onclick="document.body.classList.toggle('high')">High contrast</button><button class="btn secondary" onclick="document.documentElement.style.setProperty('--fs','18px')">Larger text</button><button class="btn secondary" onclick="document.documentElement.style.removeProperty('--fs')">Default text</button></div><p>Keyboard shortcuts: Alt+H dashboard, Alt+S simulators, Alt+E exams.</p></section>`}document.addEventListener('keydown',e=>{if(!e.altKey)return;if(e.key.toLowerCase()==='h')home();if(e.key.toLowerCase()==='s')simulators();if(e.key.toLowerCase()==='e')examSetup()});save();home();
</script></body></html>
