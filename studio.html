<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#18324a"><title>Distributed Systems Learning Studio</title><style>
:root{--ink:#263238;--navy:#18324a;--wine:#7a263a;--gold:#c59b45;--cream:#fffaf0;--line:#dbcba8;--good:#2c6e49;--bad:#a23a3a;--muted:#706654}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#fbf7ed,#e7dcc4 72%);color:var(--ink);font-family:Georgia,serif}header{background:linear-gradient(110deg,var(--navy),#244d6c);color:#fff;border-bottom:5px solid var(--gold);padding:12px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{margin:0}.row{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--gold);border-radius:999px;padding:10px 14px;background:linear-gradient(#fffaf0,#eadcb9);color:var(--navy);font:bold 14px system-ui;text-decoration:none;cursor:pointer}.primary,.nav.active{background:var(--wine);color:#fff}.layout{display:grid;grid-template-columns:245px 1fr;min-height:calc(100vh - 82px)}aside{background:var(--cream);padding:12px;border-right:1px solid var(--line)}.nav{display:block;width:100%;margin:6px 0;border:1px solid var(--gold);border-radius:9px;padding:10px;background:var(--cream);font:bold 14px system-ui;cursor:pointer}main{max-width:1080px;width:100%;padding:18px;margin:auto}.card,.box,.question{background:var(--cream);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 5px 16px #5b45251f}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.big{font-size:30px;color:var(--wine);font-weight:bold}.action{min-height:125px;display:flex;flex-direction:column;justify-content:space-between}.action h3{color:var(--navy);margin:0 0 6px}.action p{color:var(--muted);margin:0 0 10px}label{display:block;font-weight:bold;margin:9px 0}select,input{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff}.option{display:block;border:1px solid var(--line);border-radius:9px;margin:7px 0;padding:11px;background:#fffdf7}.option input{width:auto}.selected{border-color:var(--wine);background:#f5ead5}.good{color:var(--good)}.bad{color:var(--bad)}.source{padding:9px;border-left:4px solid var(--gold);background:#fffdf7;color:var(--muted);font:13px system-ui}.timer{font-size:24px;font-weight:bold;color:var(--wine)}.flash{text-align:center;min-height:260px;display:grid;place-items:center}.flash h2{color:var(--navy)}.result{height:10px;background:#ded3ba;border-radius:8px;overflow:hidden}.result span{display:block;height:100%;background:var(--good)}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#f2e5c5;font:bold 11px system-ui;margin:3px}@media(max-width:720px){.layout{display:block}aside{display:flex;overflow:auto}.nav{min-width:130px}main{padding:10px}}</style></head><body>
<header><div><h1>Distributed Systems Learning Studio</h1><small>Book-aligned practice, games, review, and timed assessment</small></div><div class="row"><a class="btn" href="index.html">📘 Ebook</a><a class="btn" href="lectures.html">🎓 Lectures</a></div></header><div class="layout"><aside id="nav"></aside><main id="app"><section class="card"><h2>Loading book question bank…</h2></section></main></div><script>
'use strict';let bank=[],session=null,timer=null;const $=id=>document.getElementById(id),app=$('app'),nav=$('nav');const state=JSON.parse(localStorage.getItem('dsStudio')||'{"mistakes":[],"bookmarks":[],"reports":[],"streak":0,"answered":0}');const save=()=>localStorage.setItem('dsStudio',JSON.stringify(state));function shuffle(a){a=[...a];for(let i=a.length-1;i;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function unique(a){return [...new Set(a)]}const pages={Dashboard:home,Practice:()=>setup('practice'),'Timed Exam':()=>setup('exam'),'Quick Challenge':quick,'Flashcards':flashSetup,'Review Mistakes':mistakes,'Bookmarks':bookmarks,'Chapter Progress':progress,Reports:reports};for(const [name,fn] of Object.entries(pages)){const b=document.createElement('button');b.className='nav';b.textContent=name;b.onclick=()=>{clearInterval(timer);[...nav.children].forEach(x=>x.classList.remove('active'));b.classList.add('active');fn()};nav.appendChild(b)}nav.firstChild.classList.add('active');
function home(){app.innerHTML=`<section class="card"><h2>Interactive Book Studio</h2><p>Choose a focused learning activity. Progress is stored in this browser.</p><div class="grid"><div class="box"><div class="big">${bank.length}</div>book questions</div><div class="box"><div class="big">${unique(bank.map(q=>q.chapter)).length}</div>chapters</div><div class="box"><div class="big">${state.streak}</div>current streak</div><div class="box"><div class="big">${state.mistakes.length}</div>mistakes to review</div></div></section><section class="grid"><div class="box action"><div><h3>Practice</h3><p>Choose chapter, topic, difficulty, and question count.</p></div><button class="btn primary" onclick="setup('practice')">Start Practice</button></div><div class="box action"><div><h3>Quick Challenge</h3><p>Answer five random questions immediately.</p></div><button class="btn primary" onclick="quick()">Start Challenge</button></div><div class="box action"><div><h3>Flashcards</h3><p>Recall the answer before revealing it.</p></div><button class="btn primary" onclick="flashSetup()">Open Flashcards</button></div><div class="box action"><div><h3>Review Mistakes</h3><p>Retry questions answered incorrectly.</p></div><button class="btn primary" onclick="mistakes()">Review</button></div></section>`}
function filterUi(kind){const chapters=[...new Map(bank.map(q=>[q.chapter,q.chapterTitle])).entries()];app.innerHTML=`<section class="card"><h2>${kind==='exam'?'Timed Exam':'Practice Setup'}</h2><label>Chapter<select id="chapter"><option value="">All Chapters</option>${chapters.map(([n,t])=>`<option value="${n}">Chapter ${n} · ${t}</option>`).join('')}</select></label><label>Topic<select id="topic"><option value="">All Topics</option>${unique(bank.map(q=>q.topic)).sort().map(t=>`<option>${t}</option>`).join('')}</select></label><label>Difficulty<select id="difficulty"><option value="">All Difficulties</option><option>Easy</option><option>Medium</option><option>Hard</option></select></label><label>Questions<select id="count"><option>5</option><option selected>10</option><option>20</option><option>30</option><option>50</option></select></label>${kind==='exam'?'<label>Minutes<input id="minutes" type="number" min="1" value="30"></label>':''}<button id="start" class="btn primary">Start</button></section>`;$('chapter').onchange=()=>{$('topic').innerHTML='<option value="">All Topics</option>'+unique(bank.filter(q=>!$('chapter').value||q.chapter==$('chapter').value).map(q=>q.topic)).sort().map(t=>`<option>${t}</option>`).join('')};$('start').onclick=()=>{let pool=bank.filter(q=>(!$('chapter').value||q.chapter==$('chapter').value)&&(!$('topic').value||q.topic===$('topic').value)&&(!$('difficulty').value||q.difficulty===$('difficulty').value));startSession(kind,shuffle(pool).slice(0,Math.min(+$('count').value,pool.length)),kind==='exam'?(+$('minutes').value||30)*60:0)}}function setup(kind){filterUi(kind)}function startSession(kind,items,seconds=0){if(!items.length)return alert('No questions available.');session={kind,items,i:0,answers:[],checked:[],seconds};app.innerHTML='<section class="card"><div id="area"></div></section>';render();if(kind==='exam')timer=setInterval(()=>{session.seconds--;const c=$('clock');if(c)c.textContent=fmt(session.seconds);if(session.seconds<=0)finish()},1000)}function fmt(s){return Math.floor(Math.max(0,s)/60)+':'+String(Math.max(0,s)%60).padStart(2,'0')}
function render(){const s=session,q=s.items[s.i],checked=s.checked[s.i]!==undefined;let feedback='';if(s.kind!=='exam'&&checked)feedback=`<div class="${s.checked[s.i]?'good':'bad'}"><h3>${s.checked[s.i]?'✓ Correct':'✕ Incorrect'}</h3><p>${q.explanation}</p></div><div class="source">${q.source} · Chapter ${q.chapter} · ${q.chapterTitle} · ${q.topic} · Page ${q.page}</div>`;$('area').innerHTML=`<div class="box">${s.kind==='exam'?`<span id="clock" class="timer">${fmt(s.seconds)}</span> · `:''}Question ${s.i+1}/${s.items.length} · ${q.id} <button id="mark" class="btn">${state.bookmarks.includes(q.id)?'★ Bookmarked':'☆ Bookmark'}</button></div><div class="question"><span class="pill">Chapter ${q.chapter}</span><span class="pill">${q.topic}</span><span class="pill">${q.difficulty}</span><h2>${q.question}</h2>${q.options.map((o,i)=>`<label class="option ${s.answers[s.i]===i?'selected':''}"><input type="radio" name="answer" value="${i}" ${s.answers[s.i]===i?'checked':''}> ${o}</label>`).join('')}${feedback}</div><div class="row"><button id="prev" class="btn">← Previous</button>${s.kind!=='exam'?'<button id="check" class="btn primary">Check Answer</button>':''}<button id="next" class="btn">Next →</button><button id="finish" class="btn">Finish</button></div>`;$('area').querySelectorAll('input').forEach(r=>r.onchange=()=>{s.answers[s.i]=+r.value;render()});$('mark').onclick=()=>{state.bookmarks=state.bookmarks.includes(q.id)?state.bookmarks.filter(x=>x!==q.id):[...state.bookmarks,q.id];save();render()};$('prev').onclick=()=>{s.i=Math.max(0,s.i-1);render()};$('next').onclick=()=>{s.i=Math.min(s.items.length-1,s.i+1);render()};if(s.kind!=='exam')$('check').onclick=()=>{if(s.answers[s.i]===undefined)return alert('Select an answer.');const ok=s.answers[s.i]===q.answer;s.checked[s.i]=ok;state.answered++;state.streak=ok?state.streak+1:0;if(!ok&&!state.mistakes.includes(q.id))state.mistakes.push(q.id);if(ok)state.mistakes=state.mistakes.filter(x=>x!==q.id);save();render()};$('finish').onclick=finish}
function finish(){clearInterval(timer);const s=session,score=s.items.reduce((n,q,i)=>n+(s.answers[i]===q.answer),0),pct=Math.round(score/s.items.length*100);state.reports.unshift({date:new Date().toISOString(),kind:s.kind,score,total:s.items.length,pct});save();$('area').innerHTML=`<div class="box"><div class="big">${score}/${s.items.length} · ${pct}%</div><div class="result"><span style="width:${pct}%"></span></div><p>${s.answers.filter(x=>x!==undefined).length} answered.</p><div class="row"><button class="btn primary" onclick="home()">Dashboard</button><button class="btn" onclick="mistakes()">Review Mistakes</button></div></div>`}
function quick(){startSession('challenge',shuffle(bank).slice(0,5))}let flash=null;function flashSetup(){flash={items:shuffle(bank).slice(0,20),i:0,revealed:false};flashRender()}function flashRender(){const q=flash.items[flash.i];app.innerHTML=`<section class="card flash"><div><span class="pill">${q.topic}</span><h2>${q.question}</h2>${flash.revealed?`<div class="box good"><b>${q.options[q.answer]}</b><p>${q.explanation}</p><div class="source">Chapter ${q.chapter} · Page ${q.page}</div></div>`:'<p>Think of the answer, then reveal it.</p>'}<div class="row"><button class="btn" onclick="flash.i=Math.max(0,flash.i-1);flash.revealed=false;flashRender()">Previous</button><button class="btn primary" onclick="flash.revealed=!flash.revealed;flashRender()">${flash.revealed?'Hide':'Reveal Answer'}</button><button class="btn" onclick="flash.i=Math.min(flash.items.length-1,flash.i+1);flash.revealed=false;flashRender()">Next</button></div><p>${flash.i+1}/${flash.items.length}</p></div></section>`}
function mistakes(){const items=bank.filter(q=>state.mistakes.includes(q.id));if(!items.length){app.innerHTML='<section class="card"><h2>No mistakes to review</h2><p>Incorrect Practice and Challenge answers will appear here.</p><button class="btn primary" onclick="quick()">Start Quick Challenge</button></section>';return}startSession('review',shuffle(items))}function bookmarks(){const items=bank.filter(q=>state.bookmarks.includes(q.id));if(!items.length){app.innerHTML='<section class="card"><h2>No bookmarks yet</h2><p>Use ☆ Bookmark while answering questions.</p></section>';return}startSession('review',items)}function progress(){const rows=unique(bank.map(q=>q.chapter)).map(ch=>{const total=bank.filter(q=>q.chapter===ch).length,mist=bank.filter(q=>q.chapter===ch&&state.mistakes.includes(q.id)).length;return `<div class="box"><h3>Chapter ${ch} · ${bank.find(q=>q.chapter===ch).chapterTitle}</h3><p>${total} questions · ${mist} mistakes awaiting review</p></div>`}).join('');app.innerHTML='<section class="card"><h2>Chapter Progress</h2>'+rows+'</section>'}function reports(){app.innerHTML='<section class="card"><h2>Reports</h2>'+(state.reports.length?state.reports.map(r=>`<div class="box">${new Date(r.date).toLocaleString()} · ${r.kind} · ${r.score}/${r.total} · ${r.pct}%</div>`).join(''):'<p>No completed sessions yet.</p>')+'<button class="btn" onclick="state.reports=[];save();reports()">Clear Reports</button></section>'}
fetch('./question_bank.json?v=20260924',{cache:'no-store'}).then(async r=>{if(!r.ok)throw Error(`HTTP ${r.status}`);const text=await r.text();try{return JSON.parse(text)}catch(e){throw Error(`Invalid JSON: ${e.message}`)}}).then(d=>{if(!Array.isArray(d)||!d.length)throw Error('Question bank must be a non-empty JSON array.');bank=d;home()}).catch(e=>app.innerHTML=`<section class="card"><h2 class="bad">Question bank could not be loaded</h2><div class="source">${e.message}</div><p>Confirm the file is named question_bank.json, begins with [, and ends with ].</p></section>`);
</script></body></html>
