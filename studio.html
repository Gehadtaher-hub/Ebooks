<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#18324a"><title>Distributed Systems Advanced Studio</title>
<style>
:root{--bg:#eee5d3;--card:#fffaf0;--ink:#263238;--muted:#706654;--navy:#18324a;--blue:#7a263a;--line:#d8c8a4;--good:#2c6e49;--bad:#a23a3a;--gold:#c59b45}body.dark{--bg:#0d1722;--card:#172433;--ink:#edf5ff;--muted:#b5c1cf;--line:#35485c;--blue:#42a7df;--gold:#63d2ff}body.high{--bg:#000;--card:#000;--ink:#fff;--muted:#fff;--line:#fff;--blue:#ff0;--good:#0f0;--bad:#ff6b6b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#fbf7ed,var(--bg) 75%);color:var(--ink);font-family:Georgia,"Times New Roman",serif;font-size:var(--fs,16px)}header{position:sticky;top:0;z-index:9;background:linear-gradient(110deg,var(--navy),#244d6c);color:#fff;padding:12px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:5px solid var(--gold)}header h1{font-size:clamp(18px,4vw,27px);margin:0}.layout{display:grid;grid-template-columns:285px 1fr;min-height:100vh}aside{background:var(--card);border-right:1px solid var(--line);padding:14px;position:sticky;top:62px;height:calc(100vh - 62px);overflow:auto}main{max-width:1120px;width:100%;padding:22px;margin:auto}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:clamp(18px,4vw,30px);box-shadow:0 10px 28px #5b45251f;margin-bottom:18px}.nav,.btn{border:1px solid transparent;border-radius:10px;padding:11px 13px;font:750 14px system-ui;cursor:pointer}.nav{display:block;width:100%;margin:6px 0;text-align:left;background:color-mix(in srgb,var(--blue) 10%,var(--card));color:var(--ink)}.nav:hover,.nav.active{border-color:var(--gold)}.nav.active,.primary{background:var(--blue);color:#fff}.secondary{background:var(--card);color:var(--ink);border:1px solid var(--gold)}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:13px}.box,.question,.lab,.case{border:1px solid var(--line);border-radius:14px;padding:15px;background:color-mix(in srgb,var(--card) 94%,var(--gold) 6%);margin:10px 0}.big{font-size:34px;color:var(--blue);font-weight:bold}.option{display:block;border:1px solid var(--line);border-radius:11px;padding:11px;margin:8px 0;cursor:pointer}.option:hover{background:color-mix(in srgb,var(--gold) 18%,var(--card))}input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);margin:5px 0}textarea{min-height:120px}.tag{display:inline-block;padding:6px 9px;border-radius:999px;background:#f1dfb5;color:#5f3c00;font:750 13px system-ui}.good{color:var(--good)}.bad{color:var(--bad)}.tiny{color:var(--muted);font-size:.9em}.progress{height:12px;background:var(--line);border-radius:9px;overflow:hidden}.progress div{height:100%;background:linear-gradient(90deg,var(--blue),var(--gold))}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid var(--line);text-align:left}pre{white-space:pre-wrap;overflow:auto;background:#101820;color:#e9f4ff;padding:14px;border-radius:10px}.flash{min-height:180px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:22px;cursor:pointer}.hidden{display:none!important}@media(max-width:760px){header{position:relative;flex-direction:column;align-items:flex-start}.layout{display:block}aside{position:static;height:auto;display:flex;overflow-x:auto;padding:7px}.nav{min-width:145px;text-align:center}aside h3{display:none}main{padding:11px}}@media print{header,aside,.no-print{display:none!important}.layout{display:block}main{padding:0}.card{box-shadow:none}}
</style></head><body>
<header><h1>Distributed Systems Advanced Studio</h1><div class="row"><span id="who">Guest</span><button class="btn secondary" id="themeBtn">Accessibility</button></div></header>
<div class="layout"><aside><h3>Advanced Studio</h3><div id="nav"></div></aside><main><div id="app"></div></main></div>
<script>
'use strict';
const $=id=>document.getElementById(id), app=$('app');
const chapters=[
{t:'Foundations',s:'Independent nodes cooperate over a network and appear as one coherent system. Core issues include no shared memory, no global clock, partial failure, scalability, transparency, heterogeneity and concurrency.',points:['Vertical scaling upgrades one machine; horizontal scaling adds nodes.','Message passing replaces shared physical memory.','Replication, redundancy and failover support availability.']},
{t:'Communication and RPC',s:'Sockets expose network communication directly. RPC and RMI raise the abstraction by using stubs, marshalling, transport and server dispatch.',points:['A client stub marshals parameters and unmarshals results.','Timeouts, retries, request IDs and idempotency address partial failure.','Synchronous calls block; asynchronous and callback styles avoid immediate blocking.']},
{t:'Architectures and Naming',s:'Client-server, master-worker, peer-to-peer, tiered and layered designs distribute roles differently. Naming separates identity from location.',points:['Flat names need a lookup mechanism such as a DHT.','Hierarchical names support delegation and traversal.','Attribute-based directories support semantic lookup.']},
{t:'Synchronization',s:'Physical clock algorithms estimate time; logical clocks order events and capture causality.',points:['Cristian estimates server time using half the round-trip delay.','Lamport clocks preserve happened-before order.','Vector clocks can identify concurrent events.']},
{t:'Replication and Caching',s:'Replication improves availability and read performance. Caching reduces latency and backend load but may serve stale data.',points:['Push and pull policies trade freshness for overhead.','LRU, LFU and FIFO choose eviction victims differently.','Total, sequential and causal ordering offer different guarantees.']},
{t:'Fault Tolerance',s:'Distributed systems must detect, mask and recover from transient and persistent failures.',points:['Availability = MTTF / (MTTF + MTTR).','Heartbeats provide failure suspicion, not perfect knowledge.','Two-phase commit can block when the coordinator fails after participants prepare.']}
];
const labs=[
['One-to-One Java Socket','Build a TCP server with ServerSocket on port 5005 and a client with Socket. Exchange one request and response using BufferedReader and PrintWriter. Use try-with-resources and test with a real LAN address.'],
['Multi-Client Chat','Create a thread per client, maintain connected clients, broadcast messages, remove disconnected clients, add username, timestamp, graceful exit and a server-down message.'],
['RPC and Idempotency','Define a remote operation, its request ID, timeout and retry policy. Explain how duplicate requests are detected and why the operation is idempotent.'],
['RMI Calculator','Create a Remote interface with add, subtract, multiply and divide. Implement it with UnicastRemoteObject, declare RemoteException and handle division by zero.'],
['RMI Registry','Start or create the registry on port 1099, bind a service using rebind, discover services with list, and retrieve one using lookup.'],
['RMI Callback Chat','Define a client callback remote interface, register callback references at the server, broadcast by invoking receiveMessage, support logout and remove unreachable clients.'],
['Clock and Election Trace','Trace Cristian or Berkeley clock adjustments, then compare Bully and ring election messages for the same process set.'],
['Replication, Cache and 2PC','Select caching and replacement policies, define replica ordering, and trace 2PC through vote and decision under coordinator failure.']
];
const qs=[
['A distributed system is best described as:',['Independent computers presented as one coherent system','One computer with many cores','A single database file','A network cable'],0,'Independent networked nodes coordinate to provide a unified service.','Foundations'],
['Horizontal scaling means:',['Adding more machines','Adding RAM to one machine','Removing replicas','Reducing users'],0,'Scaling out adds nodes.','Foundations'],
['The client stub normally:',['Marshals and sends the request','Runs the database','Shares server memory','Elects a leader'],0,'The stub is the local proxy for remote invocation.','Communication'],
['Passing a raw pointer in RPC is invalid because:',['Address spaces differ','TCP has no bytes','Servers have no memory','Pointers are encrypted'],0,'A memory address in one process has no meaning in another.','Communication'],
['The default RMI registry port is:',['5005','8080','1099','21'],2,'The default registry port is 1099.','RMI'],
['A Java remote interface extends:',['Runnable','Serializable','Remote','Thread'],2,'Remote interfaces extend java.rmi.Remote.','RMI'],
['Vector clocks can identify:',['Concurrency','Physical distance','Cache size','Disk capacity'],0,'Incomparable vectors represent concurrent events.','Synchronization'],
['The Bully algorithm elects the active process with:',['Highest ID','Lowest ID','Shortest name','Newest cache'],0,'Higher identifiers dominate the election.','Synchronization'],
['LRU evicts the item:',['Least recently used','Least frequently used','First inserted always','Largest'],0,'LRU tracks recency.','Caching'],
['Two-phase commit first asks participants to:',['Vote or prepare','Delete data','Elect a leader','Adjust clocks'],0,'Phase one collects votes.','Fault Tolerance'],
['A participant in READY may block when:',['The coordinator fails before the decision','A cache hit occurs','A name resolves','A token arrives'],0,'Classic 2PC is a blocking protocol.','Fault Tolerance'],
['A server callback enables:',['Server-to-client invocation','UDP only','Local execution only','No interfaces'],0,'The server invokes a method on the client remote reference.','RMI Callback']
].map((q,i)=>({id:'Q'+(i+1),q:q[0],o:q[1],a:q[2],e:q[3],topic:q[4]}));
const cases=[['Video Platform','Use regional delivery, edge caches, service discovery, load balancing, replication and graceful degradation. Decide where eventual consistency is acceptable.'],['University Learning System','Design for peak registration and examinations. Separate static file delivery from transactional grading and protect exam submissions with durable storage.'],['Banking Transactions','Prioritize strong consistency for balances, idempotent requests, durable logs, replication and transaction recovery.'],['Ride Sharing','Handle high-rate location updates, regional matching, eventual consistency for telemetry and stronger guarantees for trip state.'],['UAV Sensor Network','Address intermittent links, leader changes, authenticated messages, replicated mission state and trust-aware data validation.']];
let state=JSON.parse(localStorage.getItem('dsStudio')||'{"profile":{},"practice":{},"history":[],"notes":{}}');
function save(){localStorage.setItem('dsStudio',JSON.stringify(state));$('who').textContent=state.profile.name||'Guest'}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const pages={Dashboard:home,'Study & Practice':study,Challenges:challenge,Simulators:simulators,Laboratories:labPage,'Case Studies':casePage,'Practice Exams':exam,'Instructor Mode':instructor,'Architecture Builder':builder,Mastery:mastery,'Glossary & Flashcards':glossary,Achievements:achievements,Reports:reports,'Profile & Backup':profile};
function makeNav(){ $('nav').innerHTML=Object.keys(pages).map((n,i)=>`<button class="nav ${i?'':'active'}" data-page="${n}">${n}</button>`).join(''); document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>go(b.dataset.page,b)); }
function go(n,b){document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));if(b)b.classList.add('active');pages[n]();scrollTo(0,0)}
function home(){app.innerHTML=`<section class="card"><span class="tag">PDF-aligned self-contained edition</span><h2>Welcome, ${esc(state.profile.name||'student')}</h2><p>Every navigation button in this edition opens a complete activity. The content combines the eBook topics with the practical socket, multi-client, RMI, registry and callback laboratories.</p><div class="grid"><div class="box"><div class="big">${Object.keys(state.practice).length}</div>questions practiced</div><div class="box"><div class="big">${state.history.length}</div>assessments</div><div class="box"><div class="big">8</div>guided laboratories</div><div class="box"><div class="big">7</div>working simulators</div></div><h3>Learning route</h3><ol><li>Review a chapter in Study & Practice.</li><li>Run its simulator or complete the matching lab.</li><li>Apply it to a case study or architecture design.</li><li>Take a practice exam and inspect the report.</li></ol><div class="row"><button class="btn primary" onclick="go('Study & Practice')">Start studying</button><button class="btn secondary" onclick="go('Laboratories')">Open labs</button><button class="btn secondary" onclick="go('Practice Exams')">Take exam</button></div></section>`}
function study(){app.innerHTML=`<section class="card"><h2>Study & Practice</h2><select id="chapterSelect">${chapters.map((c,i)=>`<option value="${i}">${c.t}</option>`).join('')}</select><div id="chapter"></div><h3>Quick questions</h3>${qs.map(q=>`<div class="question"><b>${esc(q.q)}</b>${q.o.map((o,j)=>`<label class="option"><input type="radio" name="${q.id}" value="${j}"> ${esc(o)}</label>`).join('')}<button class="btn secondary" onclick="checkPractice('${q.id}')">Check</button><div id="f${q.id}"></div></div>`).join('')}</section>`;$('chapterSelect').onchange=drawChapter;drawChapter()}
function drawChapter(){let c=chapters[+$('chapterSelect').value];$('chapter').innerHTML=`<div class="box"><h3>${c.t}</h3><p>${c.s}</p><ul>${c.points.map(x=>`<li>${x}</li>`).join('')}</ul></div>`}
function checkPractice(id){let q=qs.find(x=>x.id===id),v=document.querySelector(`input[name="${id}"]:checked`),out=$('f'+id);if(!v){out.innerHTML='<span class="bad">Select an answer first.</span>';return}let ok=+v.value===q.a;state.practice[id]=ok;save();out.innerHTML=`<span class="${ok?'good':'bad'}">${ok?'Correct':'Incorrect'}.</span> ${q.e}`}
function challenge(){let scenario=['A coordinator fails while two participants are READY in 2PC. Explain the immediate state, why blocking occurs, and a recovery strategy.','A mobile service changes IP address frequently. Design a naming system that preserves identity and redirects clients.','A chat server freezes when one client is slow. Diagnose the concurrency problem and redesign the server.'];app.innerHTML=`<section class="card"><h2>Scenario Challenges</h2>${scenario.map((x,i)=>`<div class="case"><h3>Challenge ${i+1}</h3><p>${x}</p><textarea id="ch${i}" placeholder="Assumptions, design and trade-offs"></textarea><button class="btn secondary" onclick="saveChallenge(${i})">Save response</button></div>`).join('')}</section>`}
function saveChallenge(i){state.notes['challenge'+i]=$('ch'+i).value;save();alert('Response saved locally.')}
function simulators(){app.innerHTML=`<section class="card"><h2>Algorithm Simulators</h2><div class="grid">
${sim('Cristian Clock','Server time','cs','1000','Client send, receive','cc','900,940','cristian()','co')}${sim('Berkeley Clock','Clock values','bc','10,14,12,8','Outlier threshold','bt','100','berkeley()','bo')}${sim('Bully Election','Active IDs','bi','1,2,4,5','Initiator','bin','2','bully()','bio')}${sim('Ring Election','Ring IDs','ri','3,7,2,9,5','Initiator','rin','2','ring()','rio')}${sim('Quorum Check','N','qn','5','R,W','qrw','3,3','quorum()','qo')}${sim('Cache FIFO vs LRU','References','refs','A,B,C,A,D,B,E,A','Capacity','cap','3','cacheSim()','cacheo')}${sim('Availability','MTTF hours','mttf','1000','MTTR hours','mttr','2','availability()','avo')}</div></section>`}
function sim(t,l1,i1,v1,l2,i2,v2,fn,o){return`<div class="box"><h3>${t}</h3><label>${l1}<input id="${i1}" value="${v1}"></label><label>${l2}<input id="${i2}" value="${v2}"></label><button class="btn primary" onclick="${fn}">Run</button><div id="${o}" class="tiny"></div></div>`}
function numbers(v){return v.split(',').map(x=>Number(x.trim())).filter(Number.isFinite)}
function cristian(){let [s,r]=numbers($('cc').value),t=+$('cs').value;if(!Number.isFinite(s)||!Number.isFinite(r)||r<s)return $('co').innerHTML='<span class="bad">Use valid send and receive times.</span>';let e=t+(r-s)/2;$('co').innerHTML=`RTT: ${r-s}; estimate at receipt: <b>${e}</b>; adjustment: <b>${e-r}</b>`}
function berkeley(){let a=numbers($('bc').value),th=+$('bt').value;if(!a.length)return;$('bo').innerHTML='';let mean=a.reduce((s,n)=>s+n,0)/a.length,kept=a.filter(x=>Math.abs(x-mean)<=th),avg=kept.reduce((s,n)=>s+n,0)/kept.length;$('bo').innerHTML=`Average: <b>${avg.toFixed(2)}</b><br>Adjustments: ${a.map(x=>(avg-x).toFixed(2)).join(', ')}`}
function bully(){let a=numbers($('bi').value),i=+$('bin').value;if(!a.length)return;$('bio').innerHTML=`${i} contacts: ${a.filter(x=>x>i).join(', ')||'none'}<br>Coordinator: <b>${Math.max(...a)}</b>`}
function ring(){let a=numbers($('ri').value),v=+$('rin').value,i=a.indexOf(v);if(i<0)return $('rio').innerHTML='<span class="bad">Initiator must be in the ring.</span>';let p=[...a.slice(i),...a.slice(0,i)];$('rio').innerHTML=`Path: ${p.join(' → ')} → ${p[0]}<br>Coordinator: <b>${Math.max(...a)}</b>`}
function quorum(){let n=+$('qn').value,[r,w]=numbers($('qrw').value);$('qo').innerHTML=`Read/write overlap: <b>${r+w>n?'Yes':'No'}</b><br>Write/write overlap: <b>${2*w>n?'Yes':'No'}</b>`}
function cacheSim(){let r=$('refs').value.split(',').map(x=>x.trim()).filter(Boolean),c=+$('cap').value;function run(lru){let a=[],last={},hit=0;r.forEach((x,i)=>{if(a.includes(x))hit++;else if(a.length<c)a.push(x);else{let victim=lru?a.reduce((u,v)=>(last[u]??-1)<(last[v]??-1)?u:v):a[0];a.splice(a.indexOf(victim),1);a.push(x)}last[x]=i});return hit}$('cacheo').innerHTML=`FIFO hits: <b>${run(false)}</b>; LRU hits: <b>${run(true)}</b>`}
function availability(){let f=+$('mttf').value,r=+$('mttr').value;if(f<=0||r<0)return $('avo').innerHTML='<span class="bad">Use nonnegative values and MTTF above zero.</span>';$('avo').innerHTML=`Availability: <b>${(100*f/(f+r)).toFixed(5)}%</b>`}
function labPage(){app.innerHTML=`<section class="card"><h2>Guided Laboratories</h2><p>Each workspace saves locally in this browser.</p>${labs.map((l,i)=>`<div class="lab"><h3>Lab ${i+1}: ${l[0]}</h3><p>${l[1]}</p><ol><li>State objective and assumptions.</li><li>Record design or algorithm trace.</li><li>Test normal and failure cases.</li><li>Interpret the result and identify one limitation.</li></ol><textarea id="lab${i}">${esc(state.notes['lab'+i]||'')}</textarea><button class="btn secondary" onclick="saveLab(${i})">Save notes</button></div>`).join('')}<button class="btn primary" onclick="exportLabs()">Export lab report</button></section>`}
function saveLab(i){state.notes['lab'+i]=$('lab'+i).value;save();alert('Lab saved.')}
function exportLabs(){labs.forEach((_,i)=>{if($('lab'+i))state.notes['lab'+i]=$('lab'+i).value});save();download('distributed_systems_lab_report.txt',labs.map((l,i)=>`LAB ${i+1}: ${l[0]}\n${state.notes['lab'+i]||''}`).join('\n\n'),'text/plain')}
function casePage(){app.innerHTML=`<section class="card"><h2>Case Studies</h2>${cases.map((c,i)=>`<div class="case"><h3>${c[0]}</h3><p>${c[1]}</p><details><summary>Analysis checklist</summary><ul><li>Architecture and communication model</li><li>Consistency and availability requirements</li><li>Replication, caching and recovery</li><li>Monitoring and security controls</li></ul></details><textarea id="case${i}" placeholder="Your analysis"></textarea></div>`).join('')}</section>`}
function exam(){app.innerHTML=`<section class="card"><h2>Practice Exam</h2><label>Number of questions<input id="examCount" type="number" min="1" max="${qs.length}" value="10"></label><label>Pass mark<input id="pass" type="number" min="0" max="100" value="60"></label><button class="btn primary" onclick="startExam()">Generate exam</button><div id="examArea"></div></section>`}
function startExam(){let n=Math.max(1,Math.min(qs.length,+$('examCount').value||10)),items=[...qs].sort(()=>Math.random()-.5).slice(0,n);$('examArea').innerHTML=`<form id="examForm">${items.map((q,i)=>`<div class="question"><b>${i+1}. ${q.q}</b>${q.o.map((o,j)=>`<label class="option"><input type="radio" name="e${i}" value="${j}"> ${o}</label>`).join('')}</div>`).join('')}<button type="button" class="btn primary" onclick='gradeExam(${JSON.stringify(items.map(x=>x.id))})'>Submit exam</button></form>`}
function gradeExam(ids){let score=ids.reduce((s,id,i)=>{let v=document.querySelector(`input[name="e${i}"]:checked`),q=qs.find(x=>x.id===id);return s+(v&&+v.value===q.a?1:0)},0),pct=Math.round(100*score/ids.length),pass=+$('pass').value||60,r={date:new Date().toISOString(),score,total:ids.length,pct,pass,title:'Practice Exam'};state.history.unshift(r);save();$('examArea').innerHTML=`<div class="box"><div class="big">${score}/${ids.length} (${pct}%)</div><p class="${pct>=pass?'good':'bad'}">${pct>=pass?'Passed':'Not passed'}</p></div>`}
function instructor(){app.innerHTML=`<section class="card"><h2>Instructor Mode</h2><p>Generate a printable assessment or answer key from the internal bank.</p><label>Title<input id="it" value="Distributed Systems Assessment"></label><label>Questions<input id="ic" type="number" value="10" min="1" max="${qs.length}"></label><div class="row"><button class="btn primary" onclick="paper(false)">Generate paper</button><button class="btn secondary" onclick="paper(true)">Generate answer key</button></div><div id="paper"></div></section>`}
function paper(key){let n=Math.min(qs.length,+$('ic').value||10);$('paper').innerHTML=`<div class="box"><h2>${esc($('it').value)}</h2><ol>${qs.slice(0,n).map(q=>`<li><b>${q.q}</b><ol type="A">${q.o.map((o,j)=>`<li>${o}${key&&j===q.a?' ✓':''}</li>`).join('')}</ol></li>`).join('')}</ol><button class="btn secondary no-print" onclick="print()">Print</button></div>`}
const comps=['Client','Load Balancer','API Gateway','Service','Cache','Message Broker','Primary DB','Replica DB','Service Registry','Monitoring'];
function builder(){app.innerHTML=`<section class="card"><h2>Architecture Builder</h2><p>Select components and evaluate resilience.</p>${comps.map(c=>`<label class="box" style="display:inline-block"><input style="width:auto" type="checkbox" name="comp" value="${c}"> ${c}</label>`).join('')}<textarea id="design" placeholder="Communication, consistency and recovery decisions"></textarea><button class="btn primary" onclick="evaluateDesign()">Evaluate</button><div id="designOut"></div></section>`}
function evaluateDesign(){let a=[...document.querySelectorAll('[name=comp]:checked')].map(x=>x.value),t=[];if(!a.includes('Client'))t.push('Add an external caller.');if(a.includes('Load Balancer')&&!a.includes('Service'))t.push('The load balancer needs backend services.');if(a.includes('Primary DB')&&!a.includes('Replica DB'))t.push('The database remains a single point of failure.');if(a.includes('Cache'))t.push('Define TTL, validation or invalidation.');if(!a.includes('Monitoring'))t.push('Add monitoring and failure detection.');if(a.includes('Service')&&!a.includes('Service Registry')&&a.length>5)t.push('Consider service discovery for a dynamic deployment.');$('designOut').innerHTML=t.length?`<ul>${t.map(x=>`<li>${x}</li>`).join('')}</ul>`:'<p class="good">Core resilience checks passed. Review correctness, security and recovery objectives.</p>'}
function mastery(){let attempted=Object.keys(state.practice).length,correct=Object.values(state.practice).filter(Boolean).length,p=attempted?Math.round(100*correct/attempted):0;app.innerHTML=`<section class="card"><h2>Mastery</h2><div class="big">${p}%</div><div class="progress"><div style="width:${p}%"></div></div><p>${attempted} of ${qs.length} practice questions attempted.</p><table><tr><th>Area</th><th>Questions available</th></tr>${[...new Set(qs.map(x=>x.topic))].map(t=>`<tr><td>${t}</td><td>${qs.filter(x=>x.topic===t).length}</td></tr>`).join('')}</table></section>`}
const terms=[['Distributed system','Independent computers cooperating as one coherent system.'],['Marshalling','Encoding parameters or objects for transmission.'],['Idempotency','Repeated execution has the same intended effect as one execution.'],['RMI registry','Naming service mapping names to remote objects.'],['Callback','Server invocation of a method exposed by a client remote object.'],['Lamport clock','Scalar logical clock preserving happened-before order.'],['Vector clock','Logical clock that can distinguish causality and concurrency.'],['Quorum','Subset of replicas required for an operation.'],['LRU','Evicts the least recently used cache item.'],['Two-phase commit','Atomic commit protocol with voting and decision phases.']];let fi=0,back=false;
function glossary(){app.innerHTML=`<section class="card"><h2>Glossary & Flashcards</h2><input id="search" placeholder="Search" oninput="filterTerms()"><div id="termList" class="grid"></div><h3>Flashcard</h3><div id="flash" class="box flash" onclick="flip()"></div><button class="btn secondary" onclick="nextCard()">Next</button></section>`;filterTerms();showCard()}
function filterTerms() {let s=($('search').value||'').toLowerCase();$('termList').innerHTML=terms.filter(x=>(x[0]+' '+x[1]).toLowerCase().includes(s)).map(x=>`<div class="box"><b>${x[0]}</b><p>${x[1]}</p></div>`).join('')}
function showCard(){$('flash').innerHTML=back?terms[fi][1]:`<b>${terms[fi][0]}</b>`}function flip(){back=!back;showCard()}function nextCard(){fi=(fi+1)%terms.length;back=false;showCard()}
function achievements(){let best=Math.max(0,...state.history.map(x=>x.pct)),labsDone=labs.filter((_,i)=>state.notes['lab'+i]).length;app.innerHTML=`<section class="card"><h2>Achievements</h2><div class="grid">${[['First Practice',Object.keys(state.practice).length>0],['Assessment Complete',state.history.length>0],['Exam Passed',state.history.some(x=>x.pct>=x.pass)],['High Distinction',best>=85],['Lab Portfolio',labsDone>=4]].map(x=>`<div class="box"><div class="big">${x[1]?'★':'☆'}</div><b>${x[0]}</b><p>${x[1]?'Earned':'Locked'}</p></div>`).join('')}</div></section>`}
function reports(){app.innerHTML=`<section class="card"><h2>Reports</h2>${state.history.length?state.history.map(r=>`<div class="box">${new Date(r.date).toLocaleString()} | ${r.title}: <b>${r.pct}%</b> (${r.score}/${r.total})</div>`).join(''):'<p>No assessment reports yet.</p>'}<button class="btn secondary" onclick="download('assessment_reports.json',JSON.stringify(state.history,null,2),'application/json')">Export reports</button></section>`}
function profile(){app.innerHTML=`<section class="card"><h2>Profile & Backup</h2><label>Name<input id="pn" value="${esc(state.profile.name||'')}"></label><label>Student ID<input id="pid" value="${esc(state.profile.id||'')}"></label><label>Group<input id="pg" value="${esc(state.profile.group||'')}"></label><div class="row"><button class="btn primary" onclick="saveProfile()">Save</button><button class="btn secondary" onclick="download('distributed_systems_progress.json',JSON.stringify(state,null,2),'application/json')">Export progress</button><label class="btn secondary">Import progress<input class="hidden" type="file" accept="application/json" onchange="restore(this.files[0])"></label></div></section>`}
function saveProfile(){state.profile={name:$('pn').value,id:$('pid').value,group:$('pg').value};save();home()}function restore(f){if(!f)return;let r=new FileReader();r.onload=()=>{try{state=JSON.parse(r.result);save();home()}catch(e){alert('Invalid backup file.')}};r.readAsText(f)}
function download(name,data,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$('themeBtn').onclick=()=>{app.innerHTML=`<section class="card"><h2>Accessibility</h2><div class="row"><button class="btn secondary" onclick="document.body.classList.toggle('dark')">Dark mode</button><button class="btn secondary" onclick="document.body.classList.toggle('high')">High contrast</button><button class="btn secondary" onclick="document.documentElement.style.setProperty('--fs','18px')">Larger text</button><button class="btn secondary" onclick="document.documentElement.style.removeProperty('--fs')">Default text</button></div><p>All main activities are keyboard reachable using Tab and Enter.</p></section>`};
makeNav();save();home();
</script></body></html>
