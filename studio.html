<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#18324a"><title>Distributed Systems Learning Studio</title><style>
:root{--ink:#263238;--navy:#18324a;--wine:#7a263a;--gold:#c59b45;--cream:#fffaf0;--line:#dbcba8;--good:#2c6e49;--bad:#a23a3a;--muted:#706654}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#fbf7ed,#e7dcc4 72%);color:var(--ink);font-family:Georgia,serif}header{background:linear-gradient(110deg,var(--navy),#244d6c);color:white;border-bottom:5px solid var(--gold);padding:12px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}header h1{margin:0}.row{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--gold);border-radius:999px;padding:10px 14px;background:linear-gradient(#fffaf0,#eadcb9);color:var(--navy);font:bold 14px system-ui;text-decoration:none;cursor:pointer}.primary,.nav.active{background:var(--wine);color:white}.layout{display:grid;grid-template-columns:245px 1fr;min-height:calc(100vh - 82px)}aside{background:var(--cream);padding:12px;border-right:1px solid var(--line)}.nav{display:block;width:100%;margin:6px 0;border:1px solid var(--gold);border-radius:9px;padding:10px;background:var(--cream);font:bold 14px system-ui;cursor:pointer}main{max-width:1050px;width:100%;padding:18px;margin:auto}.card,.box,.question{background:var(--cream);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 5px 16px #5b45251f}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.big{font-size:30px;color:var(--wine);font-weight:bold}label{display:block;font-weight:bold;margin:9px 0}select,input{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:white}.option{display:block;border:1px solid var(--line);border-radius:9px;margin:7px 0;padding:11px;background:#fffdf7}.option input{width:auto}.good{color:var(--good)}.bad{color:var(--bad)}.source{padding:9px;border-left:4px solid var(--gold);background:#fffdf7;color:var(--muted);font:13px system-ui}.timer{font-size:24px;font-weight:bold;color:var(--wine)}@media(max-width:720px){.layout{display:block}aside{display:flex;overflow:auto}.nav{min-width:130px}main{padding:10px}}</style></head><body>
<header><div><h1>Distributed Systems Learning Studio</h1><small>Practice and exams generated from Distributed_ebook_2025a.pdf</small></div><div class="row"><a class="btn" href="index.html">📘 Ebook</a><a class="btn" href="lectures.html">🎓 Lectures</a></div></header><div class="layout"><aside id="nav"></aside><main id="app"><section class="card"><h2>Loading verified book question bank…</h2></section></main></div><script>
'use strict';let bank=[],session=null,timer=null,reports=[];const $=x=>document.getElementById(x),app=$('app'),nav=$('nav');const pages={Dashboard:home,Practice:()=>setup('practice'),'Timed Exam':()=>setup('exam'),Reports:showReports};for(const [n,f] of Object.entries(pages)){const b=document.createElement('button');b.className='nav';b.textContent=n;b.onclick=()=>{clearInterval(timer);[...nav.children].forEach(x=>x.classList.remove('active'));b.classList.add('active');f()};nav.appendChild(b)}nav.firstChild.classList.add('active');
function shuffle(a){a=[...a];for(let i=a.length-1;i;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function filtered(){const c=$('chapter')?.value||'',t=$('topic')?.value||'',d=$('difficulty')?.value||'';return bank.filter(q=>(!c||q.chapter==c)&&(!t||q.topic===t)&&(!d||q.difficulty===d))}function home(){const cs=[...new Set(bank.map(q=>q.chapter))];app.innerHTML=`<section class="card"><h2>Book-Aligned Assessment Studio</h2><p>Every item includes a chapter, topic, page, answer, and explanation linked to the uploaded ebook.</p><div class="grid"><div class="box"><div class="big">${bank.length}</div>verified questions</div><div class="box"><div class="big">${cs.length}</div>book chapters</div><div class="box"><div class="big">${new Set(bank.map(q=>q.topic)).size}</div>topics</div><div class="box"><div class="big">${reports.length}</div>exam reports</div></div></section>`}function setup(kind){const chapters=[...new Map(bank.map(q=>[q.chapter,q.chapterTitle])).entries()];app.innerHTML=`<section class="card"><h2>${kind==='exam'?'Timed Exam':'Practice'}</h2><label>Chapter<select id="chapter"><option value="">All Chapters</option>${chapters.map(([n,t])=>`<option value="${n}">Chapter ${n} · ${t}</option>`).join('')}</select></label><label>Topic<select id="topic"><option value="">All Topics</option>${[...new Set(bank.map(q=>q.topic))].sort().map(t=>`<option>${t}</option>`).join('')}</select></label><label>Difficulty<select id="difficulty"><option value="">All Difficulties</option><option>Easy</option><option>Medium</option><option>Hard</option></select></label><label>Questions<select id="count"><option>10</option><option>20</option><option>30</option><option>50</option></select></label>${kind==='exam'?'<label>Minutes<input id="minutes" type="number" min="1" value="30"></label>':''}<button id="start" class="btn primary">Start</button><div id="area"></div></section>`;$('chapter').onchange=()=>{const c=$('chapter').value;$('topic').innerHTML='<option value="">All Topics</option>'+[...new Set(bank.filter(q=>!c||q.chapter==c).map(q=>q.topic))].sort().map(t=>`<option>${t}</option>`).join('')};$('start').onclick=()=>{const pool=filtered();if(!pool.length)return alert('No questions match these filters.');session={kind,items:shuffle(pool).slice(0,Math.min(+$('count').value,pool.length)),i:0,answers:[],checked:[],seconds:kind==='exam'?(+$('minutes').value||30)*60:0};render();if(kind==='exam')timer=setInterval(()=>{session.seconds--;const c=$('clock');if(c)c.textContent=fmt(session.seconds);if(session.seconds<=0)finish()},1000)}}function fmt(s){return Math.floor(Math.max(0,s)/60)+':'+String(Math.max(0,s)%60).padStart(2,'0')}function render(){const s=session,q=s.items[s.i];let feedback='';if(s.kind==='practice'&&s.checked[s.i]!==undefined)feedback=`<div class="${s.checked[s.i]?'good':'bad'}"><b>${s.checked[s.i]?'Correct':'Incorrect'}</b><p>${q.explanation}</p></div><div class="source">Source: ${q.source} · Chapter ${q.chapter} · ${q.chapterTitle} · Topic: ${q.topic} · Page ${q.page}</div>`;$('area').innerHTML=`<div class="box">${s.kind==='exam'?`<span id="clock" class="timer">${fmt(s.seconds)}</span> · `:''}Question ${s.i+1} of ${s.items.length} · ${q.id}</div><div class="question"><small>Chapter ${q.chapter} · ${q.topic} · ${q.difficulty}</small><h2>${q.question}</h2>${q.options.map((o,i)=>`<label class="option"><input type="radio" name="answer" value="${i}" ${s.answers[s.i]===i?'checked':''}> ${o}</label>`).join('')}${feedback}</div><div class="row"><button id="prev" class="btn">Previous</button>${s.kind==='practice'?'<button id="check" class="btn primary">Check</button>':''}<button id="next" class="btn">Next</button><button id="finish" class="btn">Finish</button></div>`;$('area').querySelectorAll('input').forEach(r=>r.onchange=()=>s.answers[s.i]=+r.value);$('prev').onclick=()=>{s.i=Math.max(0,s.i-1);render()};$('next').onclick=()=>{s.i=Math.min(s.items.length-1,s.i+1);render()};if(s.kind==='practice')$('check').onclick=()=>{if(s.answers[s.i]===undefined)return alert('Select an answer.');s.checked[s.i]=s.answers[s.i]===q.answer;render()};$('finish').onclick=finish}function finish(){clearInterval(timer);const s=session,score=s.items.reduce((n,q,i)=>n+(s.answers[i]===q.answer),0),pct=Math.round(score/s.items.length*100);if(s.kind==='exam')reports.unshift({date:new Date(),score,total:s.items.length,pct});$('area').innerHTML=`<div class="box"><div class="big">${score} / ${s.items.length} (${pct}%)</div><p>${s.answers.filter(x=>x!==undefined).length} answered.</p></div>`}function showReports(){app.innerHTML='<section class="card"><h2>Exam Reports</h2>'+(reports.length?reports.map(r=>`<div class="box">${r.date.toLocaleString()} · ${r.score}/${r.total} · ${r.pct}%</div>`).join(''):'<p>No completed exams yet.</p>')+'</section>'}fetch('question_bank.json').then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(d=>{bank=d;home()}).catch(e=>app.innerHTML=`<section class="card"><h2 class="bad">Question bank could not be loaded</h2><p>Keep question_bank.json beside studio.html and run through GitHub Pages or a local web server.</p><p>${e}</p></section>`);
</script></body></html>
