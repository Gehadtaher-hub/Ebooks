<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#18324a"><title>Distributed Systems Studio</title><style>
:root{--bg:#eee5d3;--card:#fffaf0;--ink:#263238;--navy:#18324a;--wine:#7a263a;--line:#d8c8a4;--gold:#c59b45;--good:#26734d;--bad:#a23a3a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#fbf7ed,#e7dcc4 72%);color:var(--ink);font-family:Georgia,serif}header{background:linear-gradient(110deg,var(--navy),#244d6c);color:#fff;padding:12px 18px;border-bottom:5px solid var(--gold);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.layout{display:grid;grid-template-columns:250px 1fr;min-height:calc(100vh - 85px)}aside{background:var(--card);padding:12px;border-right:1px solid var(--line)}main{max-width:1120px;width:100%;padding:18px;margin:auto}.nav,.btn{border:1px solid var(--gold);border-radius:9px;padding:10px 12px;font:bold 14px system-ui;cursor:pointer}.nav{display:block;width:100%;margin:6px 0;background:var(--card);color:var(--ink)}.nav.active,.primary{background:var(--wine);color:#fff}.secondary{background:var(--card);color:var(--navy)}a{text-decoration:none}.card,.box,.question{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 5px 16px #5b45251f}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.row{display:flex;gap:8px;flex-wrap:wrap}.big{font-size:32px;color:var(--wine);font-weight:bold}.option{display:block;border:1px solid var(--line);padding:10px;border-radius:8px;margin:7px 0}select,input,textarea{width:100%;padding:10px;margin:5px 0}textarea{min-height:100px}.good{color:var(--good)}.bad{color:var(--bad)}.tiny{color:#706654}.trace{background:#fff;border-left:5px solid var(--gold);padding:10px;margin-top:8px}.timer{font-size:24px;font-weight:bold}@media(max-width:700px){header{flex-direction:column;align-items:flex-start}.layout{display:block}aside{display:flex;overflow:auto}.nav{min-width:135px}main{padding:10px}}
</style></head><body><header><div><h1>Distributed Systems Studio</h1><div class="tiny" style="color:#f1ddb0">Practice, assessment, simulation, and laboratory workspace</div></div><div class="row"><a class="btn secondary" href="lectures.html">← Back to Lectures</a><a class="btn secondary" href="index.html">📘 Open Ebook</a></div></header><div class="layout"><aside id="nav"></aside><main id="app"></main></div><script>
'use strict';
const topicData={Foundations:['autonomous nodes','partial failure','transparency','horizontal scaling','elasticity','heterogeneity','scalability','concurrency','resource sharing','message passing','no global clock','openness','fault independence','geographic distribution','administrative domains'],Communication:['RPC','marshalling','client stub','server stub','timeout','retry','idempotency','request ID','synchronous call','asynchronous call','message queue','publish-subscribe','serialization','socket','callback'],Architecture:['client-server','peer-to-peer','master-worker','layering','stable naming','name resolution','directory service','hierarchical naming','delegation','service discovery','load balancer','API gateway','microservice','three-tier design','location independence'],Coordination:['Lamport clock','vector clock','happened-before','clock skew','clock drift','Cristian algorithm','Berkeley algorithm','Bully election','ring election','consensus','leader election','mutual exclusion','Ricart-Agrawala','token ring','logical ordering'],Replication:['replication','primary-backup','eventual consistency','linearizability','stale read','read quorum','write quorum','quorum overlap','cache hit','cache miss','TTL','LRU','FIFO','consistent hashing','virtual node'],FaultTolerance:['heartbeat','failure detector','failover','checkpoint','rollback recovery','write-ahead log','two-phase commit','prepare state','coordinator failure','circuit breaker','graceful degradation','redundancy','availability','MTTF','MTTR'],Security:['Java Remote','RMI registry','port 1099','rebind','lookup','RemoteException','UnicastRemoteObject','ServerSocket','TCP connection','callback interface','authentication','authorization','least privilege','encryption','digital signature'],Scenarios:['network partition','lost RPC response','duplicate request','leader crash','slow replica','stale cache','clock disagreement','concurrent update','node join','node leave','message reordering','overloaded service','regional outage','intermittent link','split brain','hot key','retry storm','cache stampede','rolling upgrade','sensor disconnection','registry failure','queue backlog','transaction timeout','replica recovery','schema change','packet delay','failed heartbeat','Byzantine data','CDN failure','UAV link failure']};
const topics=Object.keys(topicData),bank=[];let id=1;for(const topic of topics){for(const term of topicData[topic]){const scenario=topic==='Scenarios',correct=scenario?'Detect the condition, preserve correctness, and recover safely':'Apply '+term+' according to its distributed-system role',wrong=['Assume zero delay and perfect failure detection','Ignore failures and retry forever','Remove monitoring and all replicas'],options=[correct,...wrong].sort(()=>Math.random()-.5);bank.push({id:'DS'+id++,topic,q:scenario?'What is the best response to '+term+'?':'Which statement best represents '+term+'?',o:options,a:options.indexOf(correct),e:'Correct: '+correct+'.'})}}
let session=null,timer=null,reports=[];const app=document.getElementById('app'),nav=document.getElementById('nav'),$=id=>document.getElementById(id);function sample(n,topic=''){const a=bank.filter(q=>!topic||q.topic===topic);for(let i=a.length-1;i;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a.slice(0,Math.min(n,a.length))}function options(){return '<option value="">All Topics</option>'+topics.map(t=>'<option>'+t+'</option>').join('')}
const pages={Dashboard:home,'Study Notes':notes,Practice:practiceSetup,Simulators:simulators,Laboratories:labs,'Timed Exam':examSetup,Glossary:glossary,Reports:showReports};for(const [name,fn] of Object.entries(pages)){const b=document.createElement('button');b.className='nav';b.textContent=name;b.onclick=()=>{clearInterval(timer);[...nav.children].forEach(x=>x.classList.remove('active'));b.classList.add('active');fn()};nav.appendChild(b)}nav.firstChild.classList.add('active');
function home(){app.innerHTML=`<section class="card"><h2>Expanded Learning Studio</h2><p>Choose a tool from the navigation panel.</p><div class="grid"><div class="box"><div class="big">${bank.length}</div>unique questions</div><div class="box"><div class="big">8</div>topics</div><div class="box"><div class="big">4</div>simulators</div><div class="box"><div class="big">${reports.length}</div>reports</div></div></section>`}
function notes(){app.innerHTML='<section class="card"><h2>Study Notes</h2>'+topics.slice(0,-1).map(t=>`<div class="box"><h3>${t}</h3><p>${topicData[t].join(' • ')}</p></div>`).join('')+'</section>'}
function practiceSetup(){app.innerHTML=`<section class="card"><h2>Practice</h2><label>Topic<select id="topic">${options()}</select></label><label>Questions<select id="count"><option>10</option><option>20</option><option>30</option><option>50</option><option>${bank.length}</option></select></label><button id="start" class="btn primary">Start practice</button><div id="area"></div></section>`;$('start').onclick=()=>{session={kind:'practice',items:sample(+$('count').value,$('topic').value),i:0,answers:[],correct:0,checked:[]};renderQuestion()}}
function examSetup(){app.innerHTML=`<section class="card"><h2>Timed Exam</h2><label>Questions<select id="count"><option>20</option><option>40</option><option>60</option><option>100</option><option>${bank.length}</option></select></label><label>Minutes<input id="minutes" type="number" min="1" value="40"></label><button id="start" class="btn primary">Start exam</button><div id="area"></div></section>`;$('start').onclick=()=>{session={kind:'exam',items:sample(+$('count').value),i:0,answers:[],sec:+$('minutes').value*60};renderQuestion();timer=setInterval(()=>{session.sec--;const c=$('clock');if(c)c.textContent=fmt(session.sec);if(session.sec<=0)finish()},1000)}}
function fmt(s){return Math.floor(Math.max(0,s)/60)+':'+String(Math.max(0,s)%60).padStart(2,'0')}function renderQuestion(){const s=session,q=s.items[s.i],feedback=s.kind==='practice'&&s.checked[s.i]!==undefined?`<p class="${s.checked[s.i]?'good':'bad'}">${s.checked[s.i]?'Correct. ':'Incorrect. '}${q.e}</p>`:'';$('area').innerHTML=`<div class="box">${s.kind==='exam'?`<span id="clock" class="timer">${fmt(s.sec)}</span> • `:''}Question ${s.i+1} of ${s.items.length}</div><div class="question"><small>${q.topic} • ${q.id}</small><h2>${q.q}</h2>${q.o.map((o,i)=>`<label class="option"><input type="radio" name="answer" value="${i}" ${s.answers[s.i]===i?'checked':''}> ${o}</label>`).join('')}${feedback}</div><div class="row"><button id="prev" class="btn secondary">Previous</button>${s.kind==='practice'?'<button id="check" class="btn primary">Check</button>':''}<button id="next" class="btn secondary">Next</button><button id="finish" class="btn secondary">Finish</button></div>`;$('area').querySelectorAll('input').forEach(r=>r.onchange=()=>s.answers[s.i]=+r.value);$('prev').onclick=()=>{s.i=Math.max(0,s.i-1);renderQuestion()};$('next').onclick=()=>{s.i=Math.min(s.items.length-1,s.i+1);renderQuestion()};if(s.kind==='practice')$('check').onclick=()=>{if(s.answers[s.i]===undefined)return alert('Select an answer.');s.checked[s.i]=s.answers[s.i]===q.a;renderQuestion()};$('finish').onclick=finish}
function finish(){if(!session)return;clearInterval(timer);const score=session.items.reduce((n,q,i)=>n+(session.answers[i]===q.a),0),pct=Math.round(score/session.items.length*100);if(session.kind==='exam')reports.unshift({date:new Date(),total:session.items.length,pct});$('area').innerHTML=`<div class="box"><div class="big">${score}/${session.items.length} (${pct}%)</div><p>${session.answers.filter(x=>x!==undefined).length} answered.</p></div>`}
function simulators(){app.innerHTML=`<section class="card"><h2>Simulators</h2><div class="grid"><div class="box"><h3>Availability</h3><p>MTTF / (MTTF + MTTR)</p><input id="mttf" value="1000"><input id="mttr" value="2"><button id="av" class="btn primary">Calculate</button><div id="avo"></div></div><div class="box"><h3>Quorum</h3><input id="n" value="5"><input id="rw" value="3,3"><button id="qb" class="btn primary">Check</button><div id="qo"></div></div><div class="box"><h3>Bully Election</h3><input id="ids" value="1,2,4,5"><button id="eb" class="btn primary">Elect</button><div id="eo"></div></div><div class="box"><h3>Ricart–Agrawala</h3><input id="nodes" value="5"><button id="mb" class="btn primary">Calculate</button><div id="mo"></div></div></div></section>`;$('av').onclick=()=>$('avo').innerHTML=`<div class="trace">${(+$('mttf').value/(+$('mttf').value + +$('mttr').value)*100).toFixed(5)}%</div>`;$('qb').onclick=()=>{const [r,w]=$('rw').value.split(',').map(Number),n=+$('n').value;$('qo').innerHTML=`<div class="trace">R+W&gt;N: ${r+w>n}<br>2W&gt;N: ${2*w>n}</div>`};$('eb').onclick=()=>$('eo').innerHTML=`<div class="trace">Coordinator: ${Math.max(...$('ids').value.split(',').map(Number))}</div>`;$('mb').onclick=()=>$('mo').innerHTML=`<div class="trace">2(N−1) = ${2*(+$('nodes').value-1)} messages</div>`}
function labs(){app.innerHTML='<section class="card"><h2>Laboratories</h2>'+['RPC','Logical clocks','Clock synchronization','Leader election','Mutual exclusion','Quorums','Consistent hashing','Two-phase commit'].map((x,i)=>`<div class="box"><h3>Lab ${i+1}: ${x}</h3><textarea placeholder="Record observations and conclusions"></textarea></div>`).join('')+'</section>'}
function glossary(){app.innerHTML='<section class="card"><h2>Glossary</h2>'+topics.map(t=>`<div class="box"><h3>${t}</h3><p>${topicData[t].join(' • ')}</p></div>`).join('')+'</section>'}function showReports(){app.innerHTML='<section class="card"><h2>Reports</h2>'+(reports.length?reports.map(r=>`<div class="box">${r.date.toLocaleString()} • ${r.total} questions • ${r.pct}%</div>`).join(''):'<p>No completed exams yet.</p>')+'</section>'}home();
</script></body></html>
