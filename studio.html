<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Distributed Systems Advanced Studio</title>
<style>:root{--bg:#eee5d3;--card:#fffaf0;--ink:#263238;--navy:#18324a;--wine:#7a263a;--line:#d8c8a4;--gold:#c59b45;--good:#26734d;--bad:#a23a3a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,serif}header{position:sticky;top:0;z-index:9;background:linear-gradient(110deg,var(--navy),#244d6c);color:white;border-bottom:5px solid var(--gold);padding:12px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px}h1{font-size:clamp(18px,4vw,27px);margin:0}.layout{display:grid;grid-template-columns:275px 1fr;min-height:100vh}aside{background:var(--card);padding:12px;border-right:1px solid var(--line)}main{padding:20px;max-width:1150px;width:100%;margin:auto}.nav,.btn{border:1px solid var(--gold);border-radius:9px;padding:10px 12px;font:bold 14px system-ui;cursor:pointer}.nav{display:block;width:100%;margin:6px 0;text-align:left;background:var(--card);color:var(--ink)}.nav.active,.primary{background:var(--wine);color:white}.secondary{background:var(--card);color:var(--navy)}a{text-decoration:none}.card,.box,.question{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:18px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.big{font-size:33px;color:var(--wine);font-weight:bold}.tag{display:inline-block;background:#f1dfb5;color:#5f3c00;border-radius:999px;padding:6px 9px;font:bold 13px system-ui}.option{display:block;border:1px solid var(--line);padding:10px;border-radius:9px;margin:7px 0}.good{color:var(--good)}.bad{color:var(--bad)}input,select,textarea{width:100%;padding:10px;margin:5px 0;border:1px solid var(--line);border-radius:8px;background:white}textarea{min-height:110px}.timer{font-size:24px;font-weight:bold}.sticky{position:sticky;top:70px;z-index:4}.progress{height:11px;background:var(--line);border-radius:8px;overflow:hidden}.progress div{height:100%;background:linear-gradient(90deg,var(--wine),var(--gold))}@media(max-width:760px){header{position:relative;flex-direction:column;align-items:flex-start}.layout{display:block}aside{display:flex;overflow:auto}.nav{min-width:140px;text-align:center}main{padding:10px}}@media print{header,aside,.no-print{display:none!important}.layout{display:block}main{padding:0}}</style></head><body>
<header><h1>Distributed Systems Advanced Studio</h1><div class="row"><a class="btn secondary" href="index.html">Back to eBook</a><span id="who">Guest</span><button class="btn secondary" onclick="document.body.classList.toggle('large')">Accessibility</button></div></header>
<div class="layout"><aside id="nav"></aside><main id="app"></main></div>
<script>
const concepts=[
['Foundations','A distributed system consists of','autonomous networked computers coordinating as one system','one CPU with several cores|a single offline database|one process with many threads'],['Foundations','Horizontal scaling means','adding more machines or nodes','adding RAM to one machine|reducing users|removing replicas'],['Foundations','A partial failure occurs when','one component fails while others continue','all components stop|every request succeeds|the network has zero delay'],['Foundations','Transparency aims to','hide selected distribution details','eliminate security|prevent replication|guarantee zero latency'],['Foundations','Elasticity means','adjusting resources as demand changes','using one fixed server|disabling monitoring|avoiding networking'],
['Communication','Marshalling means','encoding parameters for transmission','electing a leader|invalidating a cache|adding a replica'],['Communication','A client stub normally','builds and sends a remote request','runs the database|shares server memory|chooses a cache victim'],['Communication','Raw pointers are unsuitable for RPC because','process address spaces differ','networks carry no bytes|servers have no memory|pointers are encrypted'],['Communication','Idempotency makes','retries safer','clocks exact|networks synchronous|caches unnecessary'],['Communication','A timeout prevents','waiting forever for a response','serialization|authentication|opening a socket'],
['RMI and Sockets','A Java remote interface extends','java.rmi.Remote','Thread|Runnable|Socket'],['RMI and Sockets','The default RMI registry port is','1099','5005|8080|21'],['RMI and Sockets','ServerSocket is used to','listen for incoming TCP connections','resolve names|serialize objects|elect a leader'],['RMI and Sockets','A callback allows','a server to invoke a client remote object','shared physical memory|automatic UDP reliability|registry storage'],['RMI and Sockets','RMI rebind is used to','associate a name with a remote object','close sockets|calculate vectors|invalidate cache'],
['Architecture and Naming','A master-worker design risks','a master bottleneck','no coordination|unlimited capacity|no messages'],['Architecture and Naming','P2P churn refers to','peers joining and leaving','clock adjustment|cache replacement|marshalling'],['Architecture and Naming','Layering organizes','logical responsibilities and interfaces','clock crystals|process IDs|disk sectors'],['Architecture and Naming','A stable name allows','movement without changing identity','no resolution|mandatory IP identity|no delegation'],['Architecture and Naming','Hierarchical naming scales through','delegation','one global table|random flooding|no name servers'],
['Time and Ordering','Lamport clocks preserve','happened-before ordering','exact UTC|all concurrency detection|zero delay'],['Time and Ordering','Vector clocks identify','concurrent events','distance|cache size|disk failure'],['Time and Ordering','Clock skew is','difference between readings at one instant','difference in rates|failed RPC|replica conflict'],['Time and Ordering','Clock drift is','difference in clock rates','difference in names|election failure|cache expiry'],['Time and Ordering',"Cristian's algorithm uses",'a time server and round-trip estimate','a token ring|a write quorum|a hash ring'],
['Coordination','The Bully algorithm elects','the active process with highest ID','the lowest ID|the oldest cache|the shortest message'],['Coordination','Ring election forwards data through','a logical ring','shared memory|a database lock|a DNS tree'],['Coordination','Mutual exclusion ensures','one process enters a critical section at a time','all enter together|nobody waits|messages never fail'],['Coordination','Ricart-Agrawala uses','timestamped request and reply messages','one central token|shared memory|equal clocks'],['Coordination','Consensus requires participants to','agree on one value','avoid messages|share a clock|store no state'],
['Replication and Consistency','Replication improves','availability and read performance','perfect free consistency|clock accuracy|physical bandwidth'],['Replication and Consistency','Eventual consistency means replicas','converge if updates stop','are always identical|never conflict|use one server'],['Replication and Consistency','Read-write quorum overlap commonly requires','R + W > N','R + W < N|R = 0|W = 0'],['Replication and Consistency','Linearizability respects','atomic operations and real-time order','random order|eventual visibility only|no client order'],['Replication and Consistency','A stale read returns','an older replica value','always newest data|no data|only a timestamp'],
['Caching and Hashing','A cache hit means','requested data was found in cache','source failed|write rejected|leader changed'],['Caching and Hashing','TTL controls','how long cached data remains usable','election priority|vector length|quorum size'],['Caching and Hashing','LRU evicts','the least recently used item','largest item|newest item|most frequent item'],['Caching and Hashing','Consistent hashing limits movement when','nodes join or leave','clocks drift|RPC times out|quorums overlap'],['Caching and Hashing','Virtual nodes help','balance load more evenly','remove hashing|guarantee linearizability|prevent replication'],
['Fault Tolerance','A heartbeat monitors','node responsiveness','name resolution|event ordering|cache lines'],['Fault Tolerance','Failover means','switching to a healthy redundant component','deleting replicas|retrying forever|renaming services'],['Fault Tolerance','A checkpoint stores','recoverable execution state','passwords only|a hash token|a DNS label'],['Fault Tolerance','Two-phase commit first asks participants to','prepare and vote','delete data|choose a leader|adjust clocks'],['Fault Tolerance','A drawback of two-phase commit is','blocking after coordinator failure','no messages|no atomicity|no participants'],
['Transactions and Security','A circuit breaker','stops repeated calls to a failing service','synchronizes clocks|resolves names|creates replicas'],['Transactions and Security','Graceful degradation gives','reduced service instead of total failure','perfect service|no monitoring|one node'],['Transactions and Security','Transaction atomicity means','all operations commit or none do','every operation uses a clock|no writes|one participant'],['Transactions and Security','Write-ahead logging requires','logging before applying a data change','deleting logs first|no stable storage|cache only'],['Transactions and Security','Authentication verifies','the identity of a principal','event order|cache replacement|quorum overlap']];
function seeded(n){let x=Math.sin(n+1)*10000;return x-Math.floor(x)}let bank=[];concepts.forEach((c,i)=>{for(let v=0;v<3;v++){let o=[c[2],...c[3].split('|')];for(let k=o.length-1;k>0;k--){let j=Math.floor(seeded(i*17+v*5+k)*(k+1));[o[k],o[j]]=[o[j],o[k]]}bank.push({id:'DS'+(bank.length+1),topic:c[0],difficulty:['easy','medium','hard'][v],q:[c[1]+':','Choose the correct completion: '+c[1].toLowerCase()+':','Which option best explains this concept? '+c[1]+':'][v],o,a:o.indexOf(c[2]),e:'Correct concept: '+c[2]+'.'})}});
let state=JSON.parse(localStorage.getItem('dsStudio150')||'{"profile":{},"practice":{},"history":[],"notes":{}}'),timer=null,examRun=null;const app=document.getElementById('app');function save(){localStorage.setItem('dsStudio150',JSON.stringify(state));who.textContent=state.profile.name||'Guest'}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const pages={'Dashboard':home,'Study & Practice':practicePage,'Challenges':challenges,'Simulators':simulators,'Laboratories':labs,'Case Studies':cases,'Practice Exams':examSetup,'Instructor Mode':instructor,'Architecture Builder':builder,'Mastery':mastery,'Glossary & Flashcards':glossary,'Achievements':achievements,'Reports':reports,'Profile & Backup':profile};nav.innerHTML=Object.keys(pages).map((x,i)=>`<button class="nav ${i?'':'active'}" onclick="go('${x}',this)">${x}</button>`).join('');function go(n,b){clearInterval(timer);document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));if(b)b.classList.add('active');pages[n]();scrollTo(0,0)}
function home(){app.innerHTML=`<section class="card"><span class="tag">Complete single-file edition</span><h2>Welcome, ${esc(state.profile.name||'student')}</h2><p>This Studio contains all activities, the 150-question practice bank, timed exams, laboratories, simulators, reports, and the Back to eBook button.</p><div class="grid"><div class="box"><div class="big">150</div>questions</div><div class="box"><div class="big">${Object.keys(state.practice).length}</div>practiced</div><div class="box"><div class="big">${state.history.length}</div>exams</div><div class="box"><div class="big">8</div>labs</div></div></section>`}
function practicePage(){let topics=[...new Set(bank.map(q=>q.topic))];app.innerHTML=`<section class="card"><h2>Study & Practice</h2><label>Topic<select id="pt">${topics.map(t=>`<option>${t}</option>`).join('')}</select></label><label>Questions to practice<select id="pc"><option>10</option><option>20</option><option>30</option><option>50</option></select></label><button class="btn primary" onclick="drawPractice()">Start practice</button><div id="practiceArea"></div></section>`}function drawPractice(){let p=bank.filter(q=>q.topic===pt.value).sort(()=>Math.random()-.5).slice(0,+pc.value);practiceArea.innerHTML=p.map((q,i)=>`<div class="question"><small>${q.topic} • ${q.difficulty} • ${q.id}</small><h3>${i+1}. ${q.q}</h3>${q.o.map((o,j)=>`<label class="option"><input type="radio" name="${q.id}" value="${j}"> ${o}</label>`).join('')}<button class="btn secondary" onclick="check('${q.id}')">Check answer</button><div id="f${q.id}"></div></div>`).join('')}function check(id){let q=bank.find(x=>x.id===id),v=document.querySelector(`input[name="${id}"]:checked`);if(!v)return document.getElementById('f'+id).innerHTML='<span class="bad">Select an answer first.</span>';let ok=+v.value===q.a;state.practice[id]=ok;save();document.getElementById('f'+id).innerHTML=`<span class="${ok?'good':'bad'}">${ok?'Correct':'Incorrect'}.</span> ${q.e}`}
function challenges(){app.innerHTML=`<section class="card"><h2>Scenario Challenges</h2>${['Coordinator failure during 2PC READY state','Slow client freezes a multi-client chat server','Mobile service changes addresses while clients retain a stable name','Replica partition forces a consistency-versus-availability decision'].map((x,i)=>`<div class="box"><h3>${x}</h3><textarea id="ch${i}" placeholder="Analysis, assumptions, design and trade-offs">${esc(state.notes['ch'+i])}</textarea><button class="btn secondary" onclick="state.notes['ch${i}']=document.getElementById('ch${i}').value;save()">Save</button></div>`).join('')}</section>`}
function simulators(){app.innerHTML=`<section class="card"><h2>Simulators</h2><div class="grid">${[['Quorum','N','5','R,W','3,3','simQ()','qo'],['Availability','MTTF','1000','MTTR','2','simA()','ao'],['Bully Election','IDs','1,2,4,5','Initiator','2','simB()','bo'],['Cache LRU','References','A,B,C,A,D,B,E,A','Capacity','3','simC()','co']].map(x=>`<div class="box"><h3>${x[0]}</h3><label>${x[1]}<input id="${x[6]}1" value="${x[2]}"></label><label>${x[3]}<input id="${x[6]}2" value="${x[4]}"></label><button class="btn primary" onclick="${x[5]}">Run</button><div id="${x[6]}"></div></div>`).join('')}</div></section>`}function nums(s){return s.split(',').map(Number)}function simQ(){let n=+qo1.value,[r,w]=nums(qo2.value);qo.innerHTML=`R+W>N: <b>${r+w>n}</b><br>2W>N: <b>${2*w>n}</b>`}function simA(){let f=+ao1.value,r=+ao2.value;ao.innerHTML=`Availability: <b>${(100*f/(f+r)).toFixed(5)}%</b>`}function simB(){let a=nums(bo1.value),i=+bo2.value;bo.innerHTML=`Higher IDs contacted: ${a.filter(x=>x>i).join(', ')||'none'}<br>Winner: <b>${Math.max(...a)}</b>`}function simC(){let r=co1.value.split(','),cap=+co2.value,c=[],last={},hits=0;r.forEach((x,i)=>{if(c.includes(x))hits++;else if(c.length<cap)c.push(x);else{let v=c.reduce((a,b)=>(last[a]??-1)<(last[b]??-1)?a:b);c.splice(c.indexOf(v),1);c.push(x)}last[x]=i});co.innerHTML=`LRU hits: <b>${hits}</b>; final cache: ${c.join(', ')}`}
const labNames=['One-to-One Java Socket','Multi-Client Chat','RPC and Idempotency','RMI Calculator','RMI Registry','RMI Callback Chat','Clock and Election Trace','Replication, Cache and 2PC'];function labs(){app.innerHTML=`<section class="card"><h2>Guided Laboratories</h2>${labNames.map((x,i)=>`<div class="box"><h3>Lab ${i+1}: ${x}</h3><ol><li>State objective and assumptions.</li><li>Design or trace the solution.</li><li>Test normal and failure cases.</li><li>Explain results and limitations.</li></ol><textarea id="lab${i}">${esc(state.notes['lab'+i])}</textarea><button class="btn secondary" onclick="state.notes['lab${i}']=document.getElementById('lab${i}').value;save()">Save lab</button></div>`).join('')}</section>`}function cases(){app.innerHTML=`<section class="card"><h2>Case Studies</h2>${['Global Video Platform','University Learning System','Banking Transactions','Ride Sharing','UAV Sensor Network'].map(x=>`<div class="box"><h3>${x}</h3><p>Choose the architecture, communication model, consistency, replication, caching, recovery, monitoring, and security controls.</p><textarea placeholder="Your analysis"></textarea></div>`).join('')}</section>`}
function examSetup(){app.innerHTML=`<section class="card"><span class="tag">150-question bank</span><h2>Timed Practice Exam</h2><div class="grid"><label>Questions<select id="ec"><option>20</option><option>40</option><option>60</option><option>80</option></select></label><label>Minutes<select id="em"><option>20</option><option selected>40</option><option>60</option><option>80</option><option>120</option></select></label><label>Pass mark<input id="ep" type="number" value="60"></label></div><button class="btn primary" onclick="startExam()">Start exam</button><div id="examArea"></div></section>`}function fmt(s){return Math.floor(Math.max(0,s)/60)+':'+String(Math.max(0,s)%60).padStart(2,'0')}function startExam(){let items=[...bank].sort(()=>Math.random()-.5).slice(0,+ec.value);examRun={items,sec:+em.value*60,start:Date.now(),done:false,pass:+ep.value};examArea.innerHTML=`<div class="box sticky"><span class="timer">Time: <span id="clock">${fmt(examRun.sec)}</span></span> | <span id="answered">0</span>/${items.length} answered</div>${items.map((q,i)=>`<div class="question"><small>${q.topic} • ${q.difficulty}</small><h3>${i+1}. ${q.q}</h3>${q.o.map((o,j)=>`<label class="option"><input type="radio" name="e${i}" value="${j}" onchange="countAnswers()"> ${o}</label>`).join('')}</div>`).join('')}<button class="btn primary" onclick="submitExam()">Submit exam</button>`;timer=setInterval(()=>{examRun.sec--;clock.textContent=fmt(examRun.sec);if(examRun.sec<=0)submitExam(true)},1000)}function countAnswers(){answered.textContent=examRun.items.filter((_,i)=>document.querySelector(`input[name=e${i}]:checked`)).length}function submitExam(auto=false){if(!examRun||examRun.done)return;examRun.done=true;clearInterval(timer);let answeredN=examRun.items.filter((_,i)=>document.querySelector(`input[name=e${i}]:checked`)).length,score=examRun.items.filter((q,i)=>{let v=document.querySelector(`input[name=e${i}]:checked`);return v&&+v.value===q.a}).length,pct=Math.round(100*score/examRun.items.length),r={date:new Date().toISOString(),score,total:examRun.items.length,pct,answered:answeredN,time:Math.round((Date.now()-examRun.start)/1000),pass:examRun.pass};state.history.unshift(r);save();examArea.innerHTML=`<div class="box"><div class="big">${score}/${r.total} (${pct}%)</div><p class="${pct>=r.pass?'good':'bad'}">${pct>=r.pass?'Passed':'Not passed'}${auto?' • Time expired':''}</p><p>Answered ${answeredN}/${r.total}; time used ${fmt(r.time)}</p></div>`}
function instructor(){app.innerHTML=`<section class="card"><h2>Instructor Mode</h2><label>Question count<input id="ic" type="number" min="1" max="150" value="20"></label><button class="btn primary" onclick="paper(false)">Generate paper</button> <button class="btn secondary" onclick="paper(true)">Answer key</button><div id="paper"></div></section>`}function paper(key){paper.innerHTML=`<div class="box"><ol>${bank.slice(0,+ic.value).map(q=>`<li><b>${q.q}</b><ol type="A">${q.o.map((o,j)=>`<li>${o}${key&&j===q.a?' ✓':''}</li>`).join('')}</ol></li>`).join('')}</ol><button class="btn secondary no-print" onclick="print()">Print</button></div>`}
function builder(){app.innerHTML=`<section class="card"><h2>Architecture Builder</h2>${['Client','Load Balancer','API Gateway','Service','Cache','Broker','Primary DB','Replica DB','Registry','Monitoring'].map(x=>`<label class="option"><input style="width:auto" type="checkbox" name="comp" value="${x}"> ${x}</label>`).join('')}<button class="btn primary" onclick="evalDesign()">Evaluate</button><div id="designOut"></div></section>`}function evalDesign(){let a=[...document.querySelectorAll('[name=comp]:checked')].map(x=>x.value),t=[];if(!a.includes('Service'))t.push('Add a service.');if(a.includes('Primary DB')&&!a.includes('Replica DB'))t.push('Add a database replica.');if(!a.includes('Monitoring'))t.push('Add monitoring.');if(a.includes('Cache'))t.push('Define TTL and invalidation.');designOut.innerHTML=t.length?'<ul>'+t.map(x=>`<li>${x}</li>`).join('')+'</ul>':'<p class="good">Core resilience checks passed.</p>'}
function mastery(){let n=Object.keys(state.practice).length,c=Object.values(state.practice).filter(Boolean).length,p=n?Math.round(100*c/n):0;app.innerHTML=`<section class="card"><h2>Mastery</h2><div class="big">${p}%</div><div class="progress"><div style="width:${p}%"></div></div><p>${n}/150 questions practiced.</p></section>`}function glossary(){app.innerHTML=`<section class="card"><h2>Glossary</h2>${concepts.map(c=>`<div class="box"><b>${c[1]}</b><p>${c[2]}</p></div>`).join('')}</section>`}function achievements(){let best=Math.max(0,...state.history.map(x=>x.pct));app.innerHTML=`<section class="card"><h2>Achievements</h2><div class="grid"><div class="box"><div class="big">${Object.keys(state.practice).length?'★':'☆'}</div>First Practice</div><div class="box"><div class="big">${state.history.length?'★':'☆'}</div>Exam Complete</div><div class="box"><div class="big">${best>=85?'★':'☆'}</div>High Distinction</div></div></section>`}function reports(){app.innerHTML=`<section class="card"><h2>Reports</h2>${state.history.length?state.history.map(r=>`<div class="box">${new Date(r.date).toLocaleString()} • ${r.total} questions • ${r.pct}% • ${fmt(r.time)}</div>`).join(''):'<p>No reports yet.</p>'}</section>`}function profile(){app.innerHTML=`<section class="card"><h2>Profile & Backup</h2><label>Name<input id="pn" value="${esc(state.profile.name)}"></label><label>Student ID<input id="pid" value="${esc(state.profile.id)}"></label><button class="btn primary" onclick="state.profile={name:pn.value,id:pid.value};save();home()">Save</button> <button class="btn secondary" onclick="downloadBackup()">Export progress</button></section>`}function downloadBackup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='distributed_systems_progress.json';a.click()}save();home();
</script></body></html>
