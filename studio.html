<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Operating Systems Studio</title><style>:root{--bg:#07111b;--card:#0d1d2b;--ink:#e7f6f4;--muted:#9fc4c7;--blue:#39d9e6;--accent:#52e09b;--line:#285064;--good:#52e09b;--bad:#ff6b7a;--warn:#ffc857}body.light{--bg:#eef6f8;--card:#fff;--ink:#102532;--muted:#5c727d;--blue:#087b91;--accent:#16875f;--line:#bad3da;--good:#087a49;--bad:#b42318}body.high{--bg:#000;--card:#000;--ink:#fff;--muted:#fff;--blue:#ff0;--accent:#0f0;--line:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,Segoe UI,Arial;font-size:var(--fs,16px)}header{position:sticky;top:0;z-index:9;background:linear-gradient(110deg,#081522,#123149);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid var(--blue)}header h1{font-size:clamp(18px,4vw,27px);margin:0}.layout{display:grid;grid-template-columns:275px 1fr;min-height:100vh}aside{background:var(--card);border-right:1px solid var(--line);padding:14px;position:sticky;top:58px;height:calc(100vh - 58px);overflow:auto}main{max-width:1080px;width:100%;padding:22px;margin:auto}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:clamp(18px,4vw,30px);margin-bottom:18px}.nav,.btn{border:1px solid transparent;border-radius:10px;padding:11px 13px;font-weight:750;cursor:pointer}.nav{display:block;width:100%;margin:6px 0;text-align:left;background:color-mix(in srgb,var(--blue) 10%,var(--card));color:var(--ink)}.nav.active,.primary{background:linear-gradient(135deg,var(--accent),var(--blue));color:#041016}.secondary{background:var(--card);color:var(--blue);border:1px solid var(--blue)}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:13px}.metric,.question,.badge,.term,.sim{border:1px solid var(--line);border-radius:14px;padding:15px;margin:12px 0}.metric strong,.big{font-size:34px;color:var(--blue)}.option{display:block;border:1px solid var(--line);border-radius:11px;padding:11px;margin:8px 0}.option:hover{background:color-mix(in srgb,var(--blue) 8%,var(--card))}input,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink)}.tag{display:inline-block;padding:6px 9px;border-radius:999px;background:color-mix(in srgb,var(--blue) 16%,var(--card));color:var(--blue);font-weight:750}.good{color:var(--good)}.bad{color:var(--bad)}.progress{height:11px;background:var(--line);border-radius:9px;overflow:hidden}.progress div{height:100%;background:linear-gradient(90deg,var(--accent),var(--blue))}.navigator{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.navigator button{width:40px;height:40px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink)}.navigator .ans{background:color-mix(in srgb,var(--good) 25%,var(--card))}.navigator .flag{outline:3px solid var(--warn)}.navigator .cur{border:3px solid var(--blue)}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid var(--line);text-align:left}.timer{font-size:24px;font-weight:850}.tiny{color:var(--muted);font-size:.9em}a{text-decoration:none}@media(max-width:760px){.layout{display:block}aside{position:static;height:auto;display:flex;overflow-x:auto;padding:7px}.nav{min-width:145px;text-align:center}aside h3{display:none}main{padding:11px}}@media print{header,aside,.no-print{display:none!important}.layout{display:block}main{padding:0}}</style></head><body><header><h1>Operating Systems Ebook Activities</h1><div class="row"><a class="btn secondary" href="index.html">Back to Books</a><span id="who">Guest</span><button class="btn secondary" onclick="accessibility()">Accessibility</button></div></header><div class="layout"><aside><h3>Studio</h3><button class="nav active" onclick="go('home',this)">Dashboard</button><button class="nav" onclick="go('study',this)">Practice</button><button class="nav" onclick="go('challenge',this)">Challenge</button><button class="nav" onclick="go('exam',this)">Examination</button><button class="nav" onclick="go('mastery',this)">Mastery</button><button class="nav" onclick="go('simulators',this)">Simulators</button><button class="nav" onclick="go('results',this)">Reports</button><button class="nav" onclick="go('profile',this)">Profile & backup</button></aside><main><div id="app"></div></main></div><script>const chapters=[{"title":"Processes","summary":"Practice essential processes concepts.","questions":[{"topic":"Processes","q":"A program in execution is called a:","o":["Process","File","Page","Compiler"],"a":0,"e":"A process is a program in execution.","difficulty":"easy","id":"OSQ1"},{"topic":"Processes","q":"In an applied OS scenario, a program in execution is called a:","o":["File","Page","Compiler","Process"],"a":3,"e":"Applied interpretation: A process is a program in execution.","difficulty":"scenario","id":"OSQ21"},{"topic":"Processes","q":"The PCB stores:","o":["Process context and management data","Only source code","Disk sectors","Passwords"],"a":0,"e":"The Process Control Block stores state, registers, and management information.","difficulty":"medium","id":"OSQ2"},{"topic":"Processes","q":"In an applied OS scenario, the PCB stores:","o":["Only source code","Disk sectors","Passwords","Process context and management data"],"a":3,"e":"Applied interpretation: The Process Control Block stores state, registers, and management information.","difficulty":"scenario","id":"OSQ22"}]},{"title":"Scheduling","summary":"Practice essential scheduling concepts.","questions":[{"topic":"Scheduling","q":"FCFS schedules by:","o":["Arrival order","Shortest burst","Highest memory use","Page number"],"a":0,"e":"FCFS serves processes in arrival order.","difficulty":"hard","id":"OSQ3"},{"topic":"Scheduling","q":"In an applied OS scenario, fCFS schedules by:","o":["Shortest burst","Highest memory use","Page number","Arrival order"],"a":3,"e":"Applied interpretation: FCFS serves processes in arrival order.","difficulty":"scenario","id":"OSQ23"},{"topic":"Scheduling","q":"Round Robin is controlled by the:","o":["Time quantum","Page size","Disk track","Semaphore count"],"a":0,"e":"The quantum limits each CPU turn.","difficulty":"easy","id":"OSQ4"},{"topic":"Scheduling","q":"In an applied OS scenario, round Robin is controlled by the:","o":["Page size","Disk track","Semaphore count","Time quantum"],"a":3,"e":"Applied interpretation: The quantum limits each CPU turn.","difficulty":"scenario","id":"OSQ24"},{"topic":"Scheduling","q":"Which method may starve long jobs?","o":["SJF","FCFS","Round Robin","FIFO paging"],"a":0,"e":"Continuous short arrivals can delay long jobs in SJF.","difficulty":"medium","id":"OSQ5"},{"topic":"Scheduling","q":"In an applied OS scenario, which method may starve long jobs?","o":["FCFS","Round Robin","FIFO paging","SJF"],"a":3,"e":"Applied interpretation: Continuous short arrivals can delay long jobs in SJF.","difficulty":"scenario","id":"OSQ25"}]},{"title":"Synchronization","summary":"Practice essential synchronization concepts.","questions":[{"topic":"Synchronization","q":"A race condition depends on:","o":["Execution timing","Disk size","File name","Page color"],"a":0,"e":"Uncontrolled interleaving can change results.","difficulty":"hard","id":"OSQ6"},{"topic":"Synchronization","q":"In an applied OS scenario, a race condition depends on:","o":["Disk size","File name","Page color","Execution timing"],"a":3,"e":"Applied interpretation: Uncontrolled interleaving can change results.","difficulty":"scenario","id":"OSQ26"},{"topic":"Synchronization","q":"A mutex provides:","o":["Mutual exclusion","Paging","Disk mirroring","Authentication"],"a":0,"e":"A mutex protects a critical section.","difficulty":"easy","id":"OSQ7"},{"topic":"Synchronization","q":"In an applied OS scenario, a mutex provides:","o":["Paging","Disk mirroring","Authentication","Mutual exclusion"],"a":3,"e":"Applied interpretation: A mutex protects a critical section.","difficulty":"scenario","id":"OSQ27"},{"topic":"Synchronization","q":"A binary semaphore is conceptually:","o":["0 or 1","A file path","A cylinder","A process ID only"],"a":0,"e":"Binary semaphores model unavailable or available states.","difficulty":"medium","id":"OSQ8"},{"topic":"Synchronization","q":"In an applied OS scenario, a binary semaphore is conceptually:","o":["A file path","A cylinder","A process ID only","0 or 1"],"a":3,"e":"Applied interpretation: Binary semaphores model unavailable or available states.","difficulty":"scenario","id":"OSQ28"}]},{"title":"Deadlocks","summary":"Practice essential deadlocks concepts.","questions":[{"topic":"Deadlocks","q":"Which is a deadlock condition?","o":["Circular wait","Unlimited resources","Forced preemption","No sharing"],"a":0,"e":"Circular wait is one Coffman condition.","difficulty":"hard","id":"OSQ9"},{"topic":"Deadlocks","q":"In an applied OS scenario, which is a deadlock condition?","o":["Unlimited resources","Forced preemption","No sharing","Circular wait"],"a":3,"e":"Applied interpretation: Circular wait is one Coffman condition.","difficulty":"scenario","id":"OSQ29"},{"topic":"Deadlocks","q":"Banker\u2019s algorithm supports:","o":["Deadlock avoidance","File allocation","Disk formatting","Authentication"],"a":0,"e":"The algorithm grants requests only if safety is maintained.","difficulty":"easy","id":"OSQ10"},{"topic":"Deadlocks","q":"In an applied OS scenario, banker\u2019s algorithm supports:","o":["File allocation","Disk formatting","Authentication","Deadlock avoidance"],"a":3,"e":"Applied interpretation: The algorithm grants requests only if safety is maintained.","difficulty":"scenario","id":"OSQ30"}]},{"title":"Memory","summary":"Practice essential memory concepts.","questions":[{"topic":"Memory","q":"A page fault means the page is:","o":["Not in physical memory","In the TLB","Already executing","In a register"],"a":0,"e":"The missing page must be loaded.","difficulty":"medium","id":"OSQ11"},{"topic":"Memory","q":"In an applied OS scenario, a page fault means the page is:","o":["In the TLB","Already executing","In a register","Not in physical memory"],"a":3,"e":"Applied interpretation: The missing page must be loaded.","difficulty":"scenario","id":"OSQ31"},{"topic":"Memory","q":"The TLB caches:","o":["Address translations","Whole processes","Disk jobs","User accounts"],"a":0,"e":"The TLB accelerates virtual address translation.","difficulty":"hard","id":"OSQ12"},{"topic":"Memory","q":"In an applied OS scenario, the TLB caches:","o":["Whole processes","Disk jobs","User accounts","Address translations"],"a":3,"e":"Applied interpretation: The TLB accelerates virtual address translation.","difficulty":"scenario","id":"OSQ32"},{"topic":"Memory","q":"LRU removes the page:","o":["Unused for the longest time","Loaded first","Largest number","Used most recently"],"a":0,"e":"LRU approximates future use from recency.","difficulty":"easy","id":"OSQ13"},{"topic":"Memory","q":"In an applied OS scenario, lRU removes the page:","o":["Loaded first","Largest number","Used most recently","Unused for the longest time"],"a":3,"e":"Applied interpretation: LRU approximates future use from recency.","difficulty":"scenario","id":"OSQ33"},{"topic":"Memory","q":"Thrashing means excessive:","o":["Paging","Compilation","Authentication","Printing"],"a":0,"e":"Frequent page faults leave little execution time.","difficulty":"medium","id":"OSQ14"},{"topic":"Memory","q":"In an applied OS scenario, thrashing means excessive:","o":["Compilation","Authentication","Printing","Paging"],"a":3,"e":"Applied interpretation: Frequent page faults leave little execution time.","difficulty":"scenario","id":"OSQ34"}]},{"title":"Storage","summary":"Practice essential storage concepts.","questions":[{"topic":"Storage","q":"SSTF chooses the request:","o":["Closest to the head","Oldest only","Largest only","Randomly"],"a":0,"e":"SSTF minimizes the immediate seek.","difficulty":"hard","id":"OSQ15"},{"topic":"Storage","q":"In an applied OS scenario, sSTF chooses the request:","o":["Oldest only","Largest only","Randomly","Closest to the head"],"a":3,"e":"Applied interpretation: SSTF minimizes the immediate seek.","difficulty":"scenario","id":"OSQ35"},{"topic":"Storage","q":"SCAN is also called:","o":["Elevator scheduling","Banker scheduling","Clock replacement","Buddy allocation"],"a":0,"e":"The disk head moves in one direction and reverses.","difficulty":"easy","id":"OSQ16"},{"topic":"Storage","q":"In an applied OS scenario, sCAN is also called:","o":["Banker scheduling","Clock replacement","Buddy allocation","Elevator scheduling"],"a":3,"e":"Applied interpretation: The disk head moves in one direction and reverses.","difficulty":"scenario","id":"OSQ36"}]},{"title":"File Systems","summary":"Practice essential file systems concepts.","questions":[{"topic":"File Systems","q":"An inode stores:","o":["Metadata and block pointers","Only file name","CPU registers","Semaphores"],"a":0,"e":"Unix-like inodes hold metadata and data-block references.","difficulty":"medium","id":"OSQ17"},{"topic":"File Systems","q":"In an applied OS scenario, an inode stores:","o":["Only file name","CPU registers","Semaphores","Metadata and block pointers"],"a":3,"e":"Applied interpretation: Unix-like inodes hold metadata and data-block references.","difficulty":"scenario","id":"OSQ37"},{"topic":"File Systems","q":"Journaling improves:","o":["Crash recovery","CPU speed","Quantum size","TLB capacity"],"a":0,"e":"A journal helps restore file-system consistency.","difficulty":"hard","id":"OSQ18"},{"topic":"File Systems","q":"In an applied OS scenario, journaling improves:","o":["CPU speed","Quantum size","TLB capacity","Crash recovery"],"a":3,"e":"Applied interpretation: A journal helps restore file-system consistency.","difficulty":"scenario","id":"OSQ38"}]},{"title":"Protection","summary":"Practice essential protection concepts.","questions":[{"topic":"Protection","q":"Least privilege means:","o":["Only needed permissions","All admin rights","No permissions","Permanent kernel mode"],"a":0,"e":"Restricting rights reduces risk.","difficulty":"easy","id":"OSQ19"},{"topic":"Protection","q":"In an applied OS scenario, least privilege means:","o":["All admin rights","No permissions","Permanent kernel mode","Only needed permissions"],"a":3,"e":"Applied interpretation: Restricting rights reduces risk.","difficulty":"scenario","id":"OSQ39"},{"topic":"Protection","q":"A system call lets a program:","o":["Request a kernel service","Bypass protection","Run every privileged instruction","Disable all interrupts"],"a":0,"e":"System calls are the controlled kernel interface.","difficulty":"medium","id":"OSQ20"},{"topic":"Protection","q":"In an applied OS scenario, a system call lets a program:","o":["Bypass protection","Run every privileged instruction","Disable all interrupts","Request a kernel service"],"a":3,"e":"Applied interpretation: System calls are the controlled kernel interface.","difficulty":"scenario","id":"OSQ40"}]}];let profile=load('os_profile',{}),practice=load('os_practice',{}),history=load('os_history',[]),run=null,tick=null;const app=document.getElementById('app'),who=document.getElementById('who');function load(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}}function save(){localStorage.setItem('os_profile',JSON.stringify(profile));localStorage.setItem('os_practice',JSON.stringify(practice));localStorage.setItem('os_history',JSON.stringify(history));who.textContent=profile.name||'Guest'}function all(){let a=[];chapters.forEach((c,ci)=>c.questions.forEach((q,qi)=>a.push({c,ci,q,qi})));return a}function shuffle(a){a=[...a];for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function go(n,b){clearInterval(tick);document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));if(b)b.classList.add('active');({home,study,challenge,exam:examSetup,mastery,simulators,results,profile:profilePage}[n])()}function home(){app.innerHTML=`<section class="card"><span class="tag">Student edition • ${all().length}-question bank</span><h2>Welcome, ${profile.name||'student'}</h2><p>Practice, challenge yourself, take controlled examinations, run OS simulators, and monitor progress.</p><div class="grid"><div class="metric"><strong>${Object.keys(practice).length}</strong><br>answers practiced</div><div class="metric"><strong>${history.length}</strong><br>assessments</div><div class="metric"><strong>${all().length}</strong><br>questions</div><div class="metric"><strong>4</strong><br>simulators</div></div><div class="row"><button class="btn primary" onclick="study()">Practice now</button><button class="btn secondary" onclick="challenge()">Challenge</button><button class="btn secondary" onclick="simulators()">Simulators</button></div></section>`}function study(ci=0){let c=chapters[ci];app.innerHTML=`<section class="card"><span class="tag">Practice</span><h2>${c.title}</h2><p>${c.summary}</p><select onchange="study(+this.value)">${chapters.map((x,i)=>`<option value="${i}" ${i==ci?'selected':''}>Chapter ${i+1}: ${x.title}</option>`).join('')}</select>${c.questions.map((q,i)=>`<div class="question"><b>${i+1}. ${q.q}</b><div class="tiny">${q.difficulty}</div>${q.o.map((o,j)=>`<label class="option"><input type="radio" name="p${ci}_${i}" onchange="answer(${ci},${i},${j})"> ${o}</label>`).join('')}<div id="f${ci}_${i}"></div></div>`).join('')}</section>`}function answer(ci,qi,s){let q=chapters[ci].questions[qi];practice[ci+'_'+qi]={s,correct:s===q.a};save();document.getElementById('f'+ci+'_'+qi).innerHTML=(s===q.a?'<span class="good">Correct. </span>':'<span class="bad">Incorrect. </span>')+q.e}function challenge(){start('Challenge',shuffle(all()).slice(0,10),300,true,60)}function examSetup(){app.innerHTML=`<section class="card"><span class="tag">Examination</span><h2>Configure assessment</h2><div class="grid"><label>Questions<select id="cnt"><option>10</option><option selected>20</option><option>30</option><option>40</option></select></label><label>Minutes<input id="mins" type="number" value="30"></label><label>Passing grade<input id="pass" type="number" value="60"></label></div><button class="btn primary" onclick="makeExam()">Start examination</button></section>`}function makeExam(){start('Examination',shuffle(all()).slice(0,+cnt.value),+mins.value*60,false,+pass.value)}function start(title,items,seconds,feedback,pass){run={title,items,seconds,feedback,pass,answers:{},flags:{},idx:0,start:Date.now()};render();tick=setInterval(()=>{run.seconds--;let t=document.getElementById('timer');if(t)t.textContent=fmt(run.seconds);if(run.seconds<=0)submit()},1000)}function fmt(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}function render(){let x=run.items[run.idx],s=run.answers[run.idx];app.innerHTML=`<section class="card"><div class="row" style="justify-content:space-between"><span class="tag">${run.title}</span><span class="timer" id="timer">${fmt(run.seconds)}</span></div><div class="navigator">${run.items.map((_,i)=>`<button class="${i===run.idx?'cur ':''}${run.answers[i]!==undefined?'ans ':''}${run.flags[i]?'flag':''}" onclick="jump(${i})">${i+1}</button>`).join('')}</div><div class="progress"><div style="width:${Object.keys(run.answers).length/run.items.length*100}%"></div></div><div class="question"><div class="tiny">${x.c.title} • ${x.q.difficulty}</div><h2>${run.idx+1}. ${x.q.q}</h2>${x.q.o.map((o,j)=>`<label class="option"><input type="radio" name="r" ${s===j?'checked':''} onchange="runAnswer(${j})"> ${o}</label>`).join('')}${run.feedback&&s!==undefined?'<p>'+(s===x.q.a?'<span class="good">Correct. </span>':'<span class="bad">Incorrect. </span>')+x.q.e+'</p>':''}</div><div class="row"><button class="btn secondary" onclick="jump(${Math.max(0,run.idx-1)})">Previous</button><button class="btn secondary" onclick="flag()">Flag</button><button class="btn primary" onclick="jump(${Math.min(run.items.length-1,run.idx+1)})">Next</button><button class="btn secondary" onclick="submit()">Submit</button></div></section>`}function jump(i){run.idx=i;render()}function flag(){run.flags[run.idx]=!run.flags[run.idx];render()}function runAnswer(j){run.answers[run.idx]=j;render()}function submit(){clearInterval(tick);let score=run.items.filter((x,i)=>run.answers[i]===x.q.a).length,pct=Math.round(score/run.items.length*100);let r={date:new Date().toISOString(),title:run.title,score,total:run.items.length,pct,pass:run.pass,time:Math.round((Date.now()-run.start)/1000)};history.unshift(r);save();report(r)}function mastery(){app.innerHTML=`<section class="card"><h2>Mastery</h2><table><tr><th>Chapter</th><th>Attempted</th><th>Accuracy</th></tr>${chapters.map((c,i)=>{let k=Object.keys(practice).filter(x=>x.startsWith(i+'_')),n=k.filter(x=>practice[x].correct).length;return`<tr><td>${c.title}</td><td>${k.length}</td><td>${k.length?Math.round(n/k.length*100):0}%</td></tr>`}).join('')}</table></section>`}function simulators(){app.innerHTML=`<section class="card"><h2>OS Simulators</h2><div class="grid"><div class="sim"><h3>CPU FCFS</h3><input id="bur" value="5,3,8,6"><button class="btn primary" onclick="cpu()">Run</button><div id="co"></div></div><div class="sim"><h3>FIFO Paging</h3><input id="ref" value="7,0,1,2,0,3,0,4"><input id="frames" type="number" value="3"><button class="btn primary" onclick="paging()">Run</button><div id="po"></div></div><div class="sim"><h3>Banker's Safety</h3><button class="btn primary" onclick="bo.innerHTML='<p class=good>Safe sequence: P1 → P3 → P4 → P0 → P2</p>'">Analyze</button><div id="bo"></div></div><div class="sim"><h3>Disk FCFS</h3><input id="dq" value="98,183,37,122,14,124,65,67"><input id="dh" type="number" value="53"><button class="btn primary" onclick="disk()">Run</button><div id="do"></div></div></div></section>`}function nums(s){return s.split(',').map(Number)}function cpu(){let b=nums(bur.value),t=0,w=0;co.innerHTML=b.map((x,i)=>{w+=t;let s=t;t+=x;return`P${i+1}: ${s}-${t}<br>`}).join('')+`Average waiting: ${(w/b.length).toFixed(2)}`}function paging(){let r=nums(ref.value),f=[],p=0,n=+frames.value,fault=0;po.innerHTML=r.map(x=>{let h=f.includes(x);if(!h){fault++;if(f.length<n)f.push(x);else{f[p]=x;p=(p+1)%n}}return`${x} [${f}] ${h?'hit':'fault'}<br>`}).join('')+'Faults: '+fault}function disk(){let q=nums(dq.value),c=+dh.value,m=0;q.forEach(x=>{m+=Math.abs(x-c);c=x});do.innerHTML='Movement: '+m}function report(r){app.innerHTML=`<section class="card"><h2>${r.title} report</h2><div class="big">${r.score}/${r.total} (${r.pct}%)</div><p class="${r.pct>=r.pass?'good':'bad'}">${r.pct>=r.pass?'Passed':'Not passed'} • ${fmt(r.time)}</p><button class="btn primary" onclick="print()">Print / Save PDF</button></section>`}function results(){app.innerHTML=`<section class="card"><h2>Reports</h2>${history.length?history.map((r,i)=>`<div class="question">${new Date(r.date).toLocaleString()} • ${r.title} • ${r.pct}% <button class="btn secondary" onclick="report(history[${i}])">View</button></div>`).join(''):'No reports yet.'}</section>`}function profilePage(){app.innerHTML=`<section class="card"><h2>Profile & backup</h2><input id="pn" placeholder="Name" value="${profile.name||''}"><input id="pi" placeholder="Student ID" value="${profile.id||''}"><button class="btn primary" onclick="profile={name:pn.value,id:pi.value};save();home()">Save</button><button class="btn secondary" onclick="backup()">Export backup</button></section>`}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({profile,practice,history},null,2)],{type:'application/json'}));a.download='os_progress.json';a.click()}function accessibility(){app.innerHTML=`<section class="card"><h2>Accessibility</h2><button class="btn secondary" onclick="document.body.classList.toggle('light')">Light / dark</button><button class="btn secondary" onclick="document.body.classList.toggle('high')">High contrast</button><button class="btn secondary" onclick="document.documentElement.style.setProperty('--fs','18px')">Larger text</button></section>`}save();home();</script></body></html>
