',this)">${x}</button>`).join('');function go(n,b){clearInterval(timer);document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));if(b)b.classList.add('active');pages[n]()}function home(){app.innerHTML=`<section class="card"><h2>Fast Unique Edition</h2><p>Only one exam question is rendered at a time, so 80-question exams remain responsive on phones.</p><div class="grid"><div class="box"><div class="big">150</div>different questions</div><div class="box"><div class="big">${Object.keys(state.practice).length}</div>practiced</div><div class="box"><div class="big">${state.history.length}</div>exams</div></div></section>`}function practice(){let ts=[...new Set(bank.map(q=>q.topic))];app.innerHTML=`<section class="card"><h2>Practice</h2><select id="pt">${ts.map(t=>`<option>${t}</option>`).join('')}</select><select id="pc"><option>10</option><option>15</option><option>20</option></select><button class="btn primary" onclick="drawPractice()">Start</button><div id="pa"></div></section>`}function drawPractice(){let qs=selectUnique(+pc.value,pt.value);pa.innerHTML=qs.map((q,i)=>`<div class="question"><small>${q.topic} • ${q.id}</small><h3>${i+1}. ${q.q}</h3>${q.o.map((o,j)=>`<label class="option"><input type="radio" name="${q.id}" value="${j}"> ${o}</label>`).join('')}<button class="btn secondary" onclick="check('${q.id}')">Check</button><div id="f${q.id}"></div></div>`).join('')}function check(id){let q=bank.find(x=>x.id===id),v=document.querySelector(`input[name="${id}"]:checked`);if(!v)return;let ok=+v.value===q.a;state.practice[id]=ok;save();document.getElementById('f'+id).innerHTML=`<span class="${ok?'good':'bad'}">${ok?'Correct':'Incorrect'}.</span> ${q.e}`}function examSetup(){
  app.innerHTML=`<section class="card"><h2>Fast Timed Exam</h2>
  <label>Questions<select id="ec"><option value="20">20</option><option value="40">40</option><option value="60">60</option><option value="80">80</option></select></label>
  <label>Minutes<select id="em"><option value="20">20</option><option value="40" selected>40</option><option value="60">60</option><option value="80">80</option><option value="120">120</option></select></label>
  <button id="startExamBtn" type="button" class="btn primary">Start exam</button><p id="startMessage"></p><div id="ea"></div></section>`;
  document.getElementById('startExamBtn').addEventListener('click',startExam);
}
function fmt(s){s=Math.max(0,Number(s)||0);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function startExam(){
  const button=document.getElementById('startExamBtn');
  const message=document.getElementById('startMessage');
  button.disabled=true;button.textContent='Starting...';message.textContent='Preparing the first question...';
  window.setTimeout(()=>{
    try{
      const count=Number(document.getElementById('ec').value);
      const minutes=Number(document.getElementById('em').value);
      const qs=selectUnique(count);
      if(!qs.length)throw new Error('No questions are available.');
      exam={qs,sec:minutes*60,i:0,answers:{},start:Date.now(),done:false};
      state.recent=qs.map(q=>q.id);save();
      renderExam();
      clearInterval(timer);
      timer=setInterval(()=>{
        if(!exam||exam.done)return;
        exam.sec--;
        const clock=document.getElementById('clock');
        if(clock)clock.textContent=fmt(exam.sec);
        if(exam.sec<=0)submitExam(true);
      },1000);
    }catch(error){
      button.disabled=false;button.textContent='Start exam';message.className='bad';message.textContent='Could not start: '+error.message;
    }
  },30);
}
function renderExam(){
  if(!exam||exam.done)return;
  const container=document.getElementById('ea');
  const i=exam.i,q=exam.qs[i],selected=exam.answers[i];
  if(!container||!q)return;
  container.innerHTML=`<div class="box sticky"><span class="timer">Time: <span id="clock">${fmt(exam.sec)}</span></span> | <span class="answer-status">${Object.keys(exam.answers).length}/${exam.qs.length} answered</span></div>
  <div class="exam-tools"><label>Go to question<select id="examJump">${exam.qs.map((_,n)=>`<option value="${n}" ${n===i?'selected':''}>Question ${n+1}${exam.answers[n]!==undefined?' ✓':''}</option>`).join('')}</select></label><div><b>Question ${i+1} of ${exam.qs.length}</b><br><small>${q.topic} • ${q.id}</small></div></div>
  <div class="question"><h2>${i+1}. ${q.q}</h2>${q.o.map((o,j)=>`<label class="option"><input type="radio" name="oneAnswer" value="${j}" ${selected===j?'checked':''}> ${o}</label>`).join('')}</div>
  <div class="row"><button id="prevExam" type="button" class="btn secondary">Previous</button><button id="nextExam" type="button" class="btn primary">Next</button><button id="submitExamBtn" type="button" class="btn secondary">Submit exam</button></div>`;
  document.getElementById('examJump').addEventListener('change',e=>{exam.i=Number(e.target.value);renderExam()});
  document.querySelectorAll('input[name="oneAnswer"]').forEach(r=>r.addEventListener('change',e=>{exam.answers[i]=Number(e.target.value);updateExamStatus()}));
  document.getElementById('prevExam').addEventListener('click',()=>{exam.i=Math.max(0,exam.i-1);renderExam()});
  document.getElementById('nextExam').addEventListener('click',()=>{exam.i=Math.min(exam.qs.length-1,exam.i+1);renderExam()});
  document.getElementById('submitExamBtn').addEventListener('click',()=>submitExam(false));
}
function updateExamStatus(){
  const status=document.querySelector('.answer-status');
  if(status)status.textContent=Object.keys(exam.answers).length+'/'+exam.qs.length+' answered';
}
function submitExam(auto=false){
  if(!exam||exam.done)return;
  exam.done=true;clearInterval(timer);
  const score=exam.qs.filter((q,i)=>exam.answers[i]===q.a).length;
  const pct=Math.round(score/exam.qs.length*100);
  const r={date:new Date().toISOString(),total:exam.qs.length,score,pct,time:Math.round((Date.now()-exam.start)/1000)};
  state.history.unshift(r);save();
  const container=document.getElementById('ea');
  if(container)container.innerHTML=`<div class="box"><div class="big">${score}/${r.total} (${pct}%)</div><p>${auto?'Time expired. ':''}${Object.keys(exam.answers).length}/${r.total} answered. Time used: ${fmt(r.time)}.</p><button type="button" class="btn primary" onclick="examSetup()">New exam</button></div>`;
}
function simulators(){app.innerHTML=`<section class="card"><h2>Explained Simulators</h2><div class="grid"><div class="box"><h3>Quorum</h3><p>R+W>N forces read/write overlap. 2W>N forces write/write overlap.</p><input id="qn" value="5"><input id="qrw" value="3,3"><button class="btn primary" onclick="let [r,w]=qrw.value.split(',').map(Number);qo.innerHTML='R+W>N: <b>'+(r+w>+qn.value)+'</b><br>2W>N: <b>'+(2*w>+qn.value)+'</b>'">Run</button><div id="qo"></div></div><div class="box"><h3>Bully Election</h3><p>The highest active ID becomes coordinator.</p><input id="ids" value="1,2,4,5"><button class="btn primary" onclick="let a=ids.value.split(',').map(Number);bo.innerHTML='Coordinator: <b>'+Math.max(...a)+'</b>'">Run</button><div id="bo"></div></div></div></section>`}function reports(){app.innerHTML=`<section class="card"><h2>Reports</h2>${state.history.length?state.history.map(r=>`<div class="box">${new Date(r.date).toLocaleString()} • ${r.total} questions • ${r.pct}%</div>`).join(''):'No reports yet.'}</section>`}save();home();</script></body></html>
