lerate partial failures.", "difficulty": "medium", "id": "C1Q5"}, {"q": "Which feature distinguishes a distributed system from a traditional parallel system?", "o": ["Components may be geographically separated and fail independently", "All processors use one shared memory", "Every node has identical hardware", "A single physical clock is always shared"], "a": 0, "e": "Distribution allows independent nodes, networks, and partial failures.", "difficulty": "hard", "id": "C1Q6"}, {"q": "What problem does transparency try to solve?", "o": ["Remove authentication", "Use only one server", "Hide selected distribution details from users and applications", "Make all source code public"], "a": 2, "e": "Transparency presents distributed resources through a simpler, coherent view.", "difficulty": "easy", "id": "C1Q7"}, {"q": "Which statement best describes elasticity?", "o": ["The system never scales down", "Resources can adapt to changing demand", "Every machine has a fixed workload", "Data cannot move between nodes"], "a": 1, "e": "Elastic systems add or release resources as workloads change.", "difficulty": "medium", "id": "C1Q8"}, {"q": "What is a likely benefit of geographical distribution?", "o": ["Lower latency for users near regional resources", "Guaranteed consistency without coordination", "No network failures", "One universal physical clock"], "a": 0, "e": "Placing services nearer to users can reduce access latency.", "difficulty": "hard", "id": "C1Q9"}, {"q": "Why is message passing fundamental in many distributed systems?", "o": ["It removes every failure", "It guarantees ordering", "It replaces storage", "Nodes do not normally share one physical memory"], "a": 3, "e": "Independent nodes exchange information and coordinate through messages.", "difficulty": "easy", "id": "C1Q10"}, {"q": "A system designer is reviewing introduction to distributed systems. Which choice best applies the concept behind this statement: What is a distributed system?", "o": ["A collection o ters so they can cross the network and be reconstructed remotely.", "difficulty": "medium", "id": "C2Q2"}, {"q": "What is the role of the client stub?", "o": ["Marshal parameters and send the request", "Replace the network protocol", "Store the server database", "Run the server's business logic"], "a": 0, "e": "The client stub converts the local call into a request message.", "difficulty": "hard", "id": "C2Q3"}, {"q": "Why are pointers problematic in RPC?", "o": ["Pointers cannot represent integers", "Servers cannot use memory", "Pointers are always encrypted", "A memory address in one process is generally invalid in another address space"], "a": 3, "e": "Client and server have different address spaces, so raw memory addresses cannot be used directly.", "difficulty": "easy", "id": "C2Q4"}, {"q": "Which design choice improves fault tolerance in an RPC system?", "o": ["Passing shared-memory pointers", "Removing all timeouts", "Using timeouts, controlled retries, and idempotent operations", "Assuming the network never fails"], "a": 2, "e": "Timeouts prevent indefinite blocking, while safe retries require operations that avoid unwanted duplicate effects.", "difficulty": "medium", "id": "C2Q5"}, {"q": "What does the server stub do after receiving an RPC request?", "o": ["Unmarshals parameters and invokes the server procedure", "Changes the client's memory directly", "Disables the network", "Creates a physical pointer to the client"], "a": 0, "e": "The server stub reconstructs arguments and calls the intended procedure.", "difficulty": "hard", "id": "C2Q6"}, {"q": "What is a synchronous remote call?", "o": ["The caller always terminates", "No request is transmitted", "Only the server can initiate it", "The caller waits for a response"], "a": 3, "e": "A synchronous call blocks the calling flow until completion, timeout, or failure.", "difficulty": "easy", "id": "C2Q7"}, {"q": "What is a useful property of an idempotent operation?", "o": ["It never transmits data", "It requires shared memory", "Repeating it has the same intended effect as executing it once", "It cannot fail"], "a": 2, "e": "Idempotency makes controlled retries safer after ambiguous failures.", "difficulty": "medium", "id": "C2Q8"}, {"q": "What does an interface definition normally specify in RPC?", "o": ["User passwords", "Procedure signatures and data contracts", "Physical cable lengths", "CPU clock speeds"], "a": 1, "e": "An interface definition supports compatible stub generation and data exchange.", "difficulty": "hard", "id": "C2Q9"}, {"q": "Why can a local-call abstraction be misleading for remote calls?", "o": ["It can hide latency and independent failure risks", "It makes calls faster than memory", "It prevents timeouts", "It guarantees exactly-once execution"], "a": 0, "e": "Remote communication has latency and failures that ordinary local calls do not.", "difficulty": "easy", "id": "C2Q10"}, {"q": "In a practical distributed-system scenario, which option is most consistent with the principle tested by: What is the primary purpose of Remote Procedure Call (RPC)?", "o": ["To abstract remote communication as a local-style procedure call", "To share physical memory", "To eliminate networking", "To provide direct access to remote hardware"], "a": 0, "e": "Applied interpretation: RPC hides message exchange behind a familiar procedure-call interface.", "difficulty": "scenario", "source": "Application variant", "id": "C2Q11"}, {"q": "A system designer is reviewing communication paradigms. Which choice best applies the concept behind this statement: What does parameter marshaling mean?", "o": ["Selecting a network route", "Encrypting a server", "Packing parameters into a transmittable representation", "Allocating shared memory"], "a": 2, "e": "Applied interpretation: Marshaling serializes parameters so they can cross the network and be reconstructed remotely.", "difficulty": "scenario", "source": "Application variant", "id": "C2Q12"}, {"q": "In a practical distribute l degradation mean?", "o": ["All errors are hidden forever", "Data is never replicated", "The system provides reduced service instead of failing completely", "Every node must stop after one failure"], "a": 2, "e": "A fault-tolerant system may preserve essential functions even when full capacity or features are unavailable.", "difficulty": "medium", "id": "C7Q5"}, {"q": "What is failover?", "o": ["Forcing a cache miss", "Switching service to a healthy redundant component", "Deleting every replica", "Ignoring a detected failure"], "a": 1, "e": "Failover restores service through another operational component.", "difficulty": "hard", "id": "C7Q6"}, {"q": "What is checkpointing used for?", "o": ["Saving recoverable execution state", "Resolving symbolic names", "Marshaling RPC data", "Selecting cache entries"], "a": 0, "e": "A checkpoint provides a state from which computation can resume after failure.", "difficulty": "easy", "id": "C7Q7"}, {"q": "What is a crash failure?", "o": ["A component sends intentionally different values to different peers", "A clock runs slightly fast", "A cache serves a hit", "A component stops producing further actions"], "a": 3, "e": "In a crash failure, a process halts and no longer behaves.", "difficulty": "medium", "id": "C7Q8"}, {"q": "Why are failure detectors often based on suspicion rather than certainty?", "o": ["Heartbeats guarantee exact knowledge", "Processes share one clock", "Slow messages and failed nodes can look similar in asynchronous networks", "All networks have zero delay"], "a": 2, "e": "Without reliable timing bounds, silence may indicate delay or failure.", "difficulty": "hard", "id": "C7Q9"}, {"q": "What does recovery time affect?", "o": ["The number of CPU cores", "How long service remains disrupted after failure", "The shape of a namespace", "The meaning of marshaling"], "a": 1, "e": "Faster detection and recovery reduce outage duration.", "difficulty": "easy", "id": "C7Q10"}, {"q": "A system designer is reviewing fault tolerance. Which choice best applies the concept behind this statement: What is a partial failure?", "o": ["One component fails while other components remain operational", "A node becomes faster", "Every replica produces the same result", "The entire distributed system stops simultaneously"], "a": 0, "e": "Applied interpretation: Distributed components fail independently, so some parts may continue while another part is unavailable.", "difficulty": "scenario", "source": "Application variant", "id": "C7Q11"}, {"q": "In a practical distributed-system scenario, which option is most consistent with the principle tested by: Which technique most directly improves availability when a server fails?", "o": ["Disabling retries", "Keeping only one copy", "Providing redundant replicated servers", "Removing monitoring"], "a": 2, "e": "Applied interpretation: Redundancy allows another replica to continue serving when one server fails.", "difficulty": "scenario", "source": "Application variant", "id": "C7Q12"}, {"q": "A system designer is reviewing fault tolerance. Which choice best applies the concept behind this statement: What is the purpose of a heartbeat mechanism?", "o": ["Detect whether a process or node is responsive", "Synchronize database schemas", "Create symbolic names", "Compress messages"], "a": 0, "e": "Applied interpretation: Periodic heartbeat messages help a monitor suspect a failure when expected signals stop arriving.", "difficulty": "scenario", "source": "Application variant", "id": "C7Q13"}, {"q": "In a practical distributed-system scenario, which option is most consistent with the principle tested by: Why must retrying operations be designed carefully?", "o": ["Retries share memory", "Retries can cause duplicate side effects", "Retries always reduce availability", "Retries eliminate timeouts"], "a": 1, "e": "Applied interpretation: If a request succeeded but its response was lost, repeating a non-idempotent operation may duplicate its effects.", "difficulty": "scenario", "source": "Application variant", "id": "C7Q14"}, {"q": "A system designer is reviewing fault tolerance. Which choice best applies the concept behind this statement: What does graceful degradation mean?", "o": ["Every node must stop after one failure", "All errors are hidden forever", "Data is never replicated", "The system provides reduced service instead of failing completely"], "a": 3, "e": "Applied interpretation: A fault-tolerant system may preserve essential functions even when full capacity or features are unavailable.", "difficulty": "scenario", "source": "Application variant", "id": "C7Q15"}, {"q": "In a practical distributed-system scenario, which option is most consistent with the principle tested by: What is failover?", "o": ["Forcing a cache miss", "Switching service to a healthy redundant component", "Deleting every replica", "Ignoring a detected failure"], "a": 1, "e": "Applied interpretation: Failover restores service through another operational component.", "difficulty": "scenario", "source": "Application variant", "id": "C7Q16"}, {"q": "A system designer is reviewing fault tolerance. Which choice best applies the concept behind this statement: What is checkpointing used for?", "o": ["Resolving symbolic names", "Marshaling RPC data", "Selecting cache entries", "Saving recoverable execution state"], "a": 3, "e": "Applied interpretation: A checkpoint provides a state from which computation can resume after failure.", "difficulty": "scenario", "source": "Application variant", "id": "C7Q17"}, {"q": "In a practical distributed-system scenario, which option is most consistent with the principle tested by: What is a crash failure?", "o": ["A cache serves a hit", "A component stops producing further actions", "A component sends intentionally different values to different peers", "A clock runs slightly fast"], "a": 1, "e": "Applied interpretation: In a crash failure, a process halts and no longer behaves.", "difficulty": "scenario", "source": "Application variant", "id": "C7Q18"}, {"q": "A system designer is reviewing fault tolerance. Which choice best applies the concept behind this statement: Why are failure detectors often based on suspicion rather than certainty?", "o": ["All networks have zero delay", "Heartbeats guarantee exact knowledge", "Processes share one clock", "Slow messages and failed nodes can look similar in asynchronous networks"], "a": 3, "e": "Applied interpretation: Without reliable timing bounds, silence may indicate delay or failure.", "difficulty": "scenario", "source": "Application variant", "id": "C7Q19"}, {"q": "In a practical distributed-system scenario, which option is most consistent with the principle tested by: What does recovery time affect?", "o": ["The number of CPU cores", "How long service remains disrupted after failure", "The shape of a namespace", "The meaning of marshaling"], "a": 1, "e": "Applied interpretation: Faster detection and recovery reduce outage duration.", "difficulty": "scenario", "source": "Application variant", "id": "C7Q20"}]}], glossaryData=[["Distributed system", "Independent networked computers coordinating as a coherent system."], ["Transparency", "Hiding selected distribution details from users or applications."], ["Scalability", "Ability to sustain growth in users, data, resources, or geographic scope."], ["RPC", "Remote Procedure Call, an abstraction for invoking a procedure on another machine."], ["Marshaling", "Encoding parameters into a transmittable representation."], ["Middleware", "Software layer that provides common distributed-system services and abstractions."], ["Peer-to-peer", "Architecture where participating nodes can act as both clients and providers."], ["Naming graph", "Structured graph used to organize and resolve names."], ["Lamport timestamp", "Logical timestamp consistent with the happened-before relation."], ["Vector clock", "Logical clock capable of exposing causality and concurrency."], ["Mutual exclusion", "Coordination ensuring exclusive access to a critical resource."], ["Replication", "Maintaining multiple copies to support availability, performance, or resilience."], ["Cache coherence", "Keeping cached copies acceptably consistent with updates."], ["Fault tolerance", "Ability to continue acceptable service despite component failures."], ["Failover", "Switching work to a healthy redundant component after failure."], ["Idempotency", "Property whereby repeating an operation has the same intended effect as performing it once."], ["Clock skew", "Difference between clock readings at a particular instant."], ["Clock drift", "Difference in clock rates that causes readings to diverge over time."], ["Heartbeat", "Periodic signal used to monitor component responsiveness."], ["TTL", "Time-to-live, a bound on how long cached information remains usable."]];let profile=load('v3_profile',{}),practiceState=load('v3_study',{}),history=load('v3_history',[]),badges=load('v3_badges',{}),run=null,tick=null;function load(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}}function save(){localStorage.setItem('v3_profile',JSON.stringify(profile));localStorage.setItem('v3_study',JSON.stringify(practiceState));localStorage.setItem('v3_history',JSON.stringify(history));localStorage.setItem('v3_badges',JSON.stringify(badges));document.getElementById('who').textContent=profile.name||'Guest'}function esc(s){return String(s||'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}function go(n,b){clearInterval(tick);document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));if(b)b.classList.add('active');({home,study,challenge,exam:examSetup,mastery,glossary,achievements,results,profile:profilePage}[n])()}function allItems(){let a=[];chapters.forEach((c,ci)=>c.questions.forEach((q,qi)=>a.push({c,ci,q,qi})));return a}function shuffle(a){a=[...a];for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function home(){let attempts=Object.keys(practiceState).length;document.getElementById('app').innerHTML=`<section class="card"><span class="tag">Student edition • 140-question bank</span><h2>Welcome, ${esc(profile.name||'student')}</h2><p>Practice with explanations, attempt short challenges, take controlled examinations, and monitor chapter mastery.</p><div class="grid"><div class="metric"><strong>${attempts}</strong><br>answers practiced</div><div class="metric"><strong>${history.length}</strong><br>assessments completed</div><div class="metric"><strong>140</strong><br>questions available</div><div class="metric"><strong>${earned().length}</strong><br>badges earned</div></div><h3>Recommended next step</h3><p>${recommend()}</p><div class="row no-print"><button class="btn primary" onclick="study()">Practice now</button><button class="btn secondary" onclick="adaptive()">Needs-review quiz</button><button class="btn secondary" onclick="examSetup()">Final exam</button></div></section>`}function chapterStats(ci){let keys=Object.keys(practiceState).filter(k=>k.startsWith(ci+'_')),correct=keys.filter(k=>practiceState[k].correct).length;return{n:keys.length,correct,pct:keys.length?Math.round(correct/keys.length*100):0}}function recommend(){let a=chapters.map((c,i)=>({title:c.title,...chapterStats(i)})).sort((x,y)=>x.pct-y.pct);return a[0].n?`Review <b>${a[0].title}</b>, currently ${a[0].pct}% accuracy.`:'Begin with Chapter 1 practice to establish a mastery baseline.'}
function study(ci=0){let c=chapters[ci];document.getElementById('app').innerHTML=`<section class="card"><span class="tag">Practice mode</span><h2>${c.title}</h2><p>${c.summary}</p><select onchange="study(+this.value)">${chapters.map((x,i)=>`<option value="${i}" ${i==ci?'selected':''}>Chapter ${i+1}: ${x.title}</option>`).join('')}</select>${c.questions.map((q,i)=>qCard(ci,i,q)).join('')}</section>`}function qCard(ci,qi,q){let s=practiceState[ci+'_'+qi];return `<div class="question"><b>${qi+1}. ${q.q}</b><div class="tiny">Difficulty: ${q.difficulty}</div>${q.o.map((o,j)=>`<label class="option"><input type="radio" name="p${ci}_${qi}" ${s&&s.sel==j?'checked':''} onchange="practiceAnswer(${ci},${qi},${j})"> ${o}</label>`).join('')}<div id="fb${ci}_${qi}">${s?(s.correct?'<span class="good">Correct.</span> ':'<span class="bad">Incorrect.</span> ')+q.e:''}</div></div>`}function practiceAnswer(ci,qi,sel){let q=chapters[ci].questions[qi];practiceState[ci+'_'+qi]={sel,correct:sel===q.a,at:Date.now()};if(sel===q.a)badges.firstCorrect=true;save();document.getElementById('fb'+ci+'_'+qi).innerHTML=(sel===q.a?'<span class="good">Correct.</span> ':'<span class="bad">Incorrect.</span> ')+q.e}function adaptive(){let pool=allItems().filter(x=>practiceState[x.ci+'_'+x.qi]&&!practiceState[x.ci+'_'+x.qi].correct);if(pool.length<10)pool=allItems().sort((a,b)=>chapterStats(a.ci).pct-chapterStats(b.ci).pct);startRun('Adaptive review',shuffle(pool).slice(0,10),600,true)}
function challenge(){startRun('Challenge mode',shuffle(allItems()).slice(0,10),300,true)}function examSetup(){document.getElementById('app').innerHTML=`<section class="card"><span class="tag">Examination mode</span><h2>Configure assessment</h2><div class="grid"><label>Questions<select id="cnt"><option>20</option><option selected>40</option><option>60</option><option>100</option><option>140</option></select></label><label>Minutes<input id="mins" type="number" value="45" min="1" max="240"></label><label>Difficulty<select id="dif"><option value="all">All levels</option><option>easy</option><option>medium</option><option>hard</option><option>scenario</option></select></label><label>Passing grade<input id="pass" type="number" value="60" min="1" max="100"></label></div><p><button class="btn primary" onclick="makeExam()">Start examination</button></p></section>`}function makeExam(){let p=allItems().filter(x=>dif.value==='all'||x.q.difficulty===dif.value);startRun('Examination',shuffle(p).slice(0,Math.min(+cnt.value,p.length)),+mins.value*60,false,+pass.value)}function startRun(title,items,seconds,feedback,pass=60){run={title,items:items.map(x=>({...x,order:shuffle([0,1,2,3])})),seconds,feedback,pass,answers:{},flags:{},idx:0,start:Date.now()};renderRun();tick=setInterval(()=>{run.seconds--;if(document.getElementById('timer'))document.getElementById('timer').textContent=fmt(run.seconds);if(run.seconds<=0)submitRun()},1000)}function fmt(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}function renderRun(){let x=run.items[run.idx],sel=run.answers[run.idx];document.getElementById('app').innerHTML=`<section class="card"><div class="row" style="justify-content:space-between"><span class="tag">${run.title}</span><span class="timer" id="timer">${fmt(run.seconds)}</span></div><div class="navigator">${run.items.map((_,i)=>`<button class="${i===run.idx?'cur ':''}${run.answers[i]!==undefined?'ans ':''}${run.flags[i]?'flag':''}" onclick="jump(${i})">${i+1}</button>`).join('')}</div><div class="progress"><div style="width:${Object.keys(run.answers).length/run.items.length*100}%"></div></div><div class="question"><div class="tiny">Chapter ${x.ci+1} • ${x.q.difficulty}</div><h2>${run.idx+1}. ${x.q.q}</h2>${x.order.map(j=>`<label class="option"><input type="radio" name="r" ${sel===j?'checked':''} onchange="runAnswer(${j})"> ${x.q.o[j]}</label>`).join('')}<div>${run.feedback&&sel!==undefined?(sel===x.q.a?'<span class="good">Correct.</span> ':'<span class="bad">Incorrect.</span> ')+x.q.e:''}</div></div><div class="row no-print"><button class="btn secondary" onclick="jump(${Math.max(0,run.idx-1)})">Previous</button><button class="btn secondary" onclick="flag()">${run.flags[run.idx]?'Unflag':'Flag for review'}</button><button class="btn primary" onclick="jump(${Math.min(run.items.length-1,run.idx+1)})">Next</button><button class="btn secondary" onclick="submitRun()">Submit</button></div></section>`}function jump(i){run.idx=i;renderRun()}function flag(){run.flags[run.idx]=!run.flags[run.idx];renderRun()}function runAnswer(j){run.answers[run.idx]=j;renderRun()}function submitRun(){clearInterval(tick);let score=run.items.filter((x,i)=>run.answers[i]===x.q.a).length,pct=Math.round(score/run.items.length*100),detail=run.items.map((x,i)=>({id:x.q.id,chapter:x.ci+1,question:x.q.q,selected:run.answers[i],correct:x.q.a,options:x.q.o,difficulty:x.q.difficulty}));let rec={date:new Date().toISOString(),title:run.title,name:profile.name||'Guest',id:profile.id||'',score,total:run.items.length,pct,pass:run.pass,time:Math.round((Date.now()-run.start)/1000),detail};history.unshift(rec);badges.firstAssessment=true;if(pct===100)badges.perfect=true;if(pct>=run.pass)badges.examPassed=true;save();report(rec)}
function mastery(){let rows=chapters.map((c,i)=>{let s=chapterStats(i);return`<tr><td>${c.title}</td><td>${s.n}</td><td>${s.pct}%</td><td>${s.pct>=80?'Mastered':s.pct>=60?'Developing':'Needs review'}</td></tr>`}).join('');document.getElementById('app').innerHTML=`<section class="card"><h2>Chapter mastery</h2><table><tr><th>Chapter</th><th>Attempted</th><th>Accuracy</th><th>Status</th></tr>${rows}</table><p><button class="btn primary" onclick="adaptive()">Start needs-review quiz</button></p></section>`}function glossary(){document.getElementById('app').innerHTML=`<section class="card"><h2>Searchable glossary</h2><input id="gs" type="text" placeholder="Search a term" oninput="drawTerms(this.value)"><div id="terms" class="grid" style="margin-top:14px"></div></section>`;drawTerms('')}function drawTerms(s){let f=glossaryData.filter(x=>(x[0]+' '+x[1]).toLowerCase().includes(s.toLowerCase()));document.getElementById('terms').innerHTML=f.map(x=>`<div class="term"><b>${x[0]}</b><p>${x[1]}</p></div>`).join('')}
const badgeDefs=[['firstCorrect','First Correct Answer'],['firstAssessment','First Assessment'],['perfect','Perfect Score'],['examPassed','Exam Passed'],['allChapters','All Chapters Practiced']];function earned(){if(chapters.every((c,i)=>chapterStats(i).n>0))badges.allChapters=true;return badgeDefs.filter(x=>badges[x[0]])}function achievements(){save();document.getElementById('app').innerHTML=`<section class="card"><h2>Achievements</h2><div class="grid">${badgeDefs.map(x=>`<div class="badge"><div class="big">${badges[x[0]]?'★':'☆'}</div><b>${x[1]}</b><p>${badges[x[0]]?'Earned':'Locked'}</p></div>`).join('')}</div>${certificateEligible()?'<p><button class="btn primary" onclick="certificate()">Generate completion certificate</button></p>':'<p class="tiny">Certificate requirement: 60% or higher on an exam and practice attempted in all chapters.</p>'}</section>`}function certificateEligible(){return history.some(x=>x.pct>=60)&&chapters.every((c,i)=>chapterStats(i).n>0)}function certificate(){let best=Math.max(...history.map(x=>x.pct),0),ref=hash(profile.name+'|'+profile.id+'|'+best);document.getElementById('app').innerHTML=`<section class="certificate"><h2>Certificate of Completion</h2><p>This certifies that</p><h1>${esc(profile.name||'Student')}</h1><p>has completed the interactive learning requirements for</p><h2>Distributed Systems</h2><p>Best assessment score: <b>${best}%</b></p><p>${new Date().toLocaleDateString()}</p><p>Certificate reference: ${ref}</p><button class="btn primary no-print" onclick="window.print()">Print certificate</button></section>`}function hash(s){let h=0;for(let c of s)h=(h*31+c.charCodeAt(0))>>>0;return' DS-'+h.toString(16).toUpperCase()}
function report(r){let by={};r.detail.forEach(d=>{by[d.chapter]??=[0,0];by[d.chapter][1]++;if(d.selected===d.correct)by[d.chapter][0]++});document.getElementById('app').innerHTML=`<section class="card"><h2>${r.title} report</h2><div class="big">${r.score}/${r.total} (${r.pct}%)</div><p class="${r.pct>=r.pass?'good':'bad'}">${r.pct>=r.pass?'Passed':'Not passed'} • Time ${fmt(r.time)}</p><p><b>${esc(r.name)}</b> ${esc(r.id)} • ${new Date(r.date).toLocaleString()}</p><h3>Chapter breakdown</h3><table>${Object.entries(by).map(([k,v])=>`<tr><td>Chapter ${k}</td><td>${v[0]}/${v[1]}</td></tr>`).join('')}</table><div class="row no-print"><button class="btn primary" onclick="window.print()">Print / Save PDF</button><button class="btn secondary" onclick="exportCSV()">Export CSV</button></div></section>`}function results(){document.getElementById('app').innerHTML=`<section class="card"><h2>Assessment reports</h2>${history.length?`<table><tr><th>Date</th><th>Assessment</th><th>Score</th><th></th></tr>${history.map((r,i)=>`<tr><td>${new Date(r.date).toLocaleString()}</td><td>${r.title}</td><td>${r.pct}%</td><td><button class="btn secondary" onclick="report(history[${i}])">View</button></td></tr>`).join('')}</table>`:'<p>No reports yet.</p>'}</section>`}function exportCSV(){let r=history[0],rows=[['Student',r.name],['ID',r.id],['Date',r.date],['Score',r.score+'/'+r.total],['Percent',r.pct+'%'],[],['Question ID','Chapter','Difficulty','Result']];r.detail.forEach(d=>rows.push([d.id,d.chapter,d.difficulty,d.selected===d.correct?'Correct':'Incorrect']));download('assessment_report.csv',rows.map(a=>a.map(x=>'"'+String(x??'').replaceAll('"','""')+'"').join(',')).join('\n'),'text/csv')}
function profilePage(){document.getElementById('app').innerHTML=`<section class="card"><h2>Profile and progress backup</h2><div class="grid"><label>Name<input id="pn" value="${esc(profile.name)}"></label><label>Student ID<input id="pi" value="${esc(profile.id)}"></label><label>Group<input id="pg" value="${esc(profile.group)}"></label><label>Course<input id="pc" value="${esc(profile.course||'Distributed Systems')}"></label></div><p><button class="btn primary" onclick="saveProfile()">Save profile</button></p><hr><div class="row"><button class="btn secondary" onclick="backup()">Export progress backup</button><label class="btn secondary">Import backup<input type="file" accept="application/json" onchange="restore(this.files[0])" hidden></label></div></section>`}function saveProfile(){profile={name:pn.value.trim(),id:pi.value.trim(),group:pg.value.trim(),course:pc.value.trim()};save();home()}function backup(){download('ds_learning_progress.json',JSON.stringify({version:3,profile,study:practiceState,history,badges},null,2),'application/json')}function restore(f){let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);profile=d.profile||{};practiceState=d.study||{};history=d.history||[];badges=d.badges||{};save();alert('Progress restored.');home()}catch(e){alert('Invalid backup file.')}};r.readAsText(f)}function download(name,data,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click()}
function accessibility(){document.getElementById('app').innerHTML=`<section class="card"><h2>Accessibility settings</h2><div class="row"><button class="btn secondary" onclick="document.body.classList.toggle('dark')">Dark mode</button><button class="btn secondary" onclick="document.body.classList.toggle('high')">High contrast</button><button class="btn secondary" onclick="document.documentElement.style.setProperty('--fs','18px')">Larger text</button><button class="btn secondary" onclick="document.documentElement.style.removeProperty('--fs')">Default text</button></div><p>All answer controls are keyboard selectable and major controls use visible labels.</p></section>`}save();home();if('serviceWorker'in navigator)navigator.serviceWorker.register('service-worker.js').catch(()=>{});
</script></body></html>
