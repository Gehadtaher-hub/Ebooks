let state=JSON.parse(localStorage.getItem('dsUnique150')||'{"practice":{},"history":[],"recent":[],"profile":{}}'),timer=null,exam=null;const app=document.getElementById('app');function save(){localStorage.setItem('dsUnique150',JSON.stringify(state));who.textContent=state.profile.name||'Guest'}function shuffle(a){a=[...a];for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function unique(items){let ids=new Set(),texts=new Set();return items.filter(q=>{let t=q.q.toLowerCase().replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim();if(ids.has(q.id)||texts.has(t))return false;ids.add(q.id);texts.add(t);return true})}function selectUnique(n,topic){let pool=unique(topic?bank.filter(q=>q.topic===topic):bank),recent=new Set(state.recent||[]),fresh=pool.filter(q=>!recent.has(q.id)),old=pool.filter(q=>recent.has(q.id));return shuffle(fresh).concat(shuffle(old)).slice(0,Math.min(n,pool.length))}
const pages={Dashboard:home,Practice:practice,Simulators:simulators,'Timed Exam':examSetup,Reports:reports};nav.innerHTML=Object.keys(pages).map((x,i)=>`<button class="nav ${i?'':'active'}" onclick="go('${x}',this)">${x}</button>`).join('');function go(n,b){clearInterval(timer);document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));if(b)b.classList.add('active');pages[n]()}function home(){app.innerHTML=`<section class="card"><h2>Unique Question Edition</h2><p>Practice and exams remove duplicate IDs and duplicate question text. Recent exam questions are deprioritized in the next exam.</p><div class="grid"><div class="box"><div class="big">${bank.length}</div>unique questions</div><div class="box"><div class="big">${Object.keys(state.practice).length}</div>practiced</div><div class="box"><div class="big">${state.history.length}</div>exams</div></div></section>`}
function practice(){let ts=[...new Set(bank.map(q=>q.topic))];app.innerHTML=`<section class="card"><h2>Practice</h2><label>Topic<select id="pt">${ts.map(t=>`<option>${t}</option>`).join('')}</select></label><label>Questions<select id="pc"><option>10</option><option>20</option><option>30</option></select></label><button class="btn primary" onclick="drawPractice()">Start unique practice</button><div id="pa"></div></section>`}function drawPractice(){let qs=selectUnique(+pc.value,pt.value);pa.innerHTML=qs.map((q,i)=>`<div class="question"><small>${q.topic} • ${q.id}</small><h3>${i+1}. ${q.q}</h3>${q.o.map((o,j)=>`<label class="option"><input type="radio" name="${q.id}" value="${j}"> ${o}</label>`).join('')}<button class="btn secondary" onclick="check('${q.id}')">Check</button><div id="f${q.id}"></div></div>`).join('')}function check(id){let q=bank.find(x=>x.id===id),v=document.querySelector(`input[name="${id}"]:checked`);if(!v)return;let ok=+v.value===q.a;state.practice[id]=ok;save();document.getElementById('f'+id).innerHTML=`<span class="${ok?'good':'bad'}">${ok?'Correct':'Incorrect'}.</span> ${q.e}`}
function examSetup(){app.innerHTML=`<section class="card"><h2>Timed Exam</h2><label>Questions<select id="ec"><option>20</option><option>40</option><option>60</option><option>80</option></select></label><label>Minutes<select id="em"><option>20</option><option selected>40</option><option>60</option><option>80</option><option>120</option></select></label><button class="btn primary" onclick="startExam()">Start unique exam</button><div id="ea"></div></section>`}function fmt(s){s=Math.max(0,s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}function startExam(){let qs=selectUnique(+ec.value),sec=+em.value*60;exam={qs,sec,start:Date.now(),done:false};state.recent=qs.map(q=>q.id);save();ea.innerHTML=`<div class="box sticky"><span class="timer" id="clock">${fmt(sec)}</span></div>${qs.map((q,i)=>`<div class="question"><small>${q.topic} • ${q.id}</small><h3>${i+1}. ${q.q}</h3>${q.o.map((o,j)=>`<label class="option"><input type="radio" name="e${i}" value="${j}"> ${o}</label>`).join('')}</div>`).join('')}<button class="btn primary" onclick="submitExam()">Submit</button>`;timer=setInterval(()=>{exam.sec--;clock.textContent=fmt(exam.sec);if(exam.sec<=0)submitExam()},1000)}function submitExam(){if(!exam||exam.done)return;exam.done=true;clearInterval(timer);let score=exam.qs.filter((q,i)=>{let v=document.querySelector(`input[name=e${i}]:checked`);return v&&+v.value===q.a}).length,pct=Math.round(score/exam.qs.length*100),r={date:new Date().toISOString(),total:exam.qs.length,score,pct};state.history.unshift(r);save();ea.innerHTML=`<div class="box"><div class="big">${score}/${r.total} (${pct}%)</div><p>No question was duplicated within this exam.</p></div>`}
function simulators(){app.innerHTML=`<section class="card"><h2>Explained Simulators</h2><div class="grid"><div class="box"><h3>Quorum</h3><p>Checks forced overlap between read and write replica sets.</p><input id="qn" value="5"><input id="qrw" value="3,3"><button class="btn primary" onclick="let [r,w]=qrw.value.split(',').map(Number);qo.innerHTML='<div class=trace>R+W>N: '+(r+w>+qn.value)+'<br>2W>N: '+(2*w>+qn.value)+'</div>'">Run</button><div id="qo"></div></div><div class="box"><h3>Bully Election</h3><p>The highest active process ID becomes coordinator.</p><input id="ids" value="1,2,4,5"><input id="init" value="2"><button class="btn primary" onclick="let a=ids.value.split(',').map(Number),i=+init.value;bo.innerHTML='<div class=trace>P'+i+' contacts higher IDs: '+a.filter(x=>x>i).join(', ')+'<br>Highest active ID '+Math.max(...a)+' becomes coordinator.</div>'">Run</button><div id="bo"></div></div></div></section>`}function reports(){app.innerHTML=`<section class="card"><h2>Reports</h2>${state.history.length?state.history.map(r=>`<div class="box">${new Date(r.date).toLocaleString()} • ${r.total} questions • ${r.pct}%</div>`).join(''):'No reports yet.'}</section>`}save();home();</script></body></html>
