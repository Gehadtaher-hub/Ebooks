<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Distributed Systems Advanced Studio</title><style>
:root{--bg:#eee5d3;--card:#fffaf0;--ink:#263238;--navy:#18324a;--wine:#7a263a;--line:#d8c8a4;--gold:#c59b45;--good:#26734d;--bad:#a23a3a;--soft:#f7edda}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,serif}header{position:sticky;top:0;z-index:9;background:linear-gradient(110deg,var(--navy),#244d6c);color:#fff;border-bottom:5px solid var(--gold);padding:12px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px}h1{font-size:clamp(18px,4vw,27px);margin:0}.layout{display:grid;grid-template-columns:275px 1fr;min-height:100vh}aside{background:var(--card);padding:12px;border-right:1px solid var(--line)}main{padding:20px;max-width:1180px;width:100%;margin:auto}.nav,.btn{border:1px solid var(--gold);border-radius:9px;padding:10px 12px;font:bold 14px system-ui;cursor:pointer}.nav{display:block;width:100%;margin:6px 0;text-align:left;background:var(--card);color:var(--ink)}.nav.active,.primary{background:var(--wine);color:#fff}.secondary{background:var(--card);color:var(--navy)}a{text-decoration:none}.card,.box,.question,.sim{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:18px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.big{font-size:33px;color:var(--wine);font-weight:bold}.tag{display:inline-block;background:#f1dfb5;color:#5f3c00;border-radius:999px;padding:6px 9px;font:bold 13px system-ui}.option{display:block;border:1px solid var(--line);padding:10px;border-radius:9px;margin:7px 0}input,select,textarea{width:100%;padding:10px;margin:5px 0;border:1px solid var(--line);border-radius:8px;background:#fff}textarea{min-height:110px}.good{color:var(--good)}.bad{color:var(--bad)}.tiny{color:#706654;font-size:.92em}.explain{background:var(--soft);border-left:5px solid var(--gold);padding:12px;margin:10px 0;border-radius:8px}.trace{background:#fff;border:1px dashed var(--wine);padding:12px;margin-top:10px;border-radius:8px;line-height:1.55}.formula{font-family:ui-monospace,monospace;background:#fff;padding:7px;border-radius:6px}.timer{font-size:24px;font-weight:bold}.sticky{position:sticky;top:70px;z-index:4}.progress{height:11px;background:var(--line);border-radius:8px;overflow:hidden}.progress div{height:100%;background:linear-gradient(90deg,var(--wine),var(--gold))}@media(max-width:760px){header{position:relative;flex-direction:column;align-items:flex-start}.layout{display:block}aside{display:flex;overflow:auto}.nav{min-width:145px;text-align:center}main{padding:10px}}@media print{header,aside,.no-print{display:none!important}.layout{display:block}main{padding:0}}</style></head><body>
<header><h1>Distributed Systems Advanced Studio</h1><div class="row"><a class="btn secondary" href="index.html">Back to eBook</a><span id="who">Guest</span></div></header><div class="layout"><aside id="nav"></aside><main id="app"></main></div>
<script>
const concepts=[['Foundations','Horizontal scaling','adding more machines','adding RAM to one machine|removing replicas|reducing users'],['Foundations','Partial failure','one component fails while others continue','every component stops|no messages are sent|all replicas agree'],['Communication','Marshalling','encoding parameters for transmission','electing a leader|invalidating cache|adding a replica'],['Communication','Idempotency','retries do not multiply the intended effect','clocks become exact|networks become synchronous|caches disappear'],['RMI and Sockets','RMI registry default port','1099','5005|8080|21'],['Architecture and Naming','Stable naming','identity remains while location changes','IP address never changes|resolution is removed|delegation is blocked'],['Time and Ordering','Lamport clocks','preserve happened-before ordering','show exact UTC|always detect concurrency|remove delay'],['Time and Ordering','Vector clocks','identify concurrency','measure distance|size a cache|detect disk failure'],['Coordination','Bully election','highest active process ID wins','lowest ID wins|oldest cache wins|shortest name wins'],['Coordination','Ricart-Agrawala','timestamped request and reply messages','shared memory|one central token|equal physical clocks'],['Replication','Eventual consistency','replicas converge if updates stop','replicas are always identical|conflicts never happen|one server is required'],['Replication','Quorum overlap','R + W > N','R + W < N|R = 0|W = 0'],['Caching','LRU','evicts the least recently used item','evicts newest item|evicts largest item|evicts most frequent item'],['Caching','Consistent hashing','limits key movement when nodes change','synchronizes clocks|prevents replication|removes hashing'],['Fault Tolerance','Heartbeat','monitors responsiveness','resolves names|orders all events|allocates cache'],['Fault Tolerance','Failover','switches to a healthy redundant component','deletes replicas|retries forever|renames services'],['Transactions','Two-phase commit first phase','participants prepare and vote','participants delete data|choose a leader|adjust clocks'],['Transactions','2PC weakness','may block after coordinator failure','uses no messages|has no atomicity goal|has no participants'],['Security','Authentication','verifies identity','orders events|chooses cache victim|calculates quorum'],['Recovery','Checkpoint','stores recoverable execution state','stores only passwords|stores a DNS label|stores one token'],['Foundations','Transparency','hides selected distribution details','eliminates security|prevents replication|guarantees zero latency'],['Communication','Timeout','bounds waiting for a response','serializes parameters|authenticates a user|opens shared memory'],['Architecture and Naming','P2P churn','peers join and leave','clocks adjust|caches replace|RPC retries'],['Replication','Linearizability','operations appear atomic in real-time order','operations are random|updates are only eventually visible|clocks are unused'],['Caching','TTL','limits cached-data lifetime','sets election priority|sets quorum size|sets vector length'],['Fault Tolerance','Circuit breaker','stops repeated calls to a failing service','synchronizes clocks|resolves names|creates replicas'],['Transactions','Atomicity','all operations commit or none do','writes never occur|each operation uses a new clock|only one participant exists'],['Security','Least privilege','grants only required permissions','grants all admin rights|removes authentication|runs in kernel mode'],['Communication','Client stub','builds and sends the remote request','runs the server database|edits remote memory directly|elects a leader'],['Coordination','Mutual exclusion','one process enters a critical section at a time','all processes enter together|no process waits|messages never fail'],['Replication','Stale read','returns an older replica value','always returns newest value|returns no data|returns only a timestamp'],['Caching','Virtual nodes','improve hash-ring load balance','remove hashes|guarantee linearizability|avoid replicas'],['Recovery','Write-ahead logging','logs before applying a data change','deletes the log first|uses no stable storage|writes only to cache'],['Foundations','Elasticity','adjusts resources as demand changes','uses one fixed server|disables monitoring|avoids networking'],['Architecture and Naming','Layering','separates logical responsibilities','orders clock crystals|selects disk sectors|sets process IDs'],['Time and Ordering','Clock skew','difference in readings at one instant','difference in rates|failed RPC|replica conflict'],['Time and Ordering','Clock drift','difference in clock rates','difference in names|election failure|cache expiry'],['Coordination','Consensus','nonfaulty nodes agree on one value','nodes avoid messages|nodes use one clock|nodes store no state'],['Replication','Primary-backup writes','go first to the primary','go to DNS|go only to cache|go to every client'],['Fault Tolerance','Graceful degradation','provides reduced service instead of total failure','provides perfection|removes monitoring|uses one node'],['Communication','Raw pointers in RPC','are invalid because address spaces differ','are always encrypted|networks carry no bytes|servers have no memory'],['Architecture and Naming','Hierarchical naming','scales by delegation','uses one global table|uses random flooding only|uses no servers'],['Caching','Cache hit','requested data is found in cache','source failed|write rejected|leader changed'],['Fault Tolerance','Availability','improves with higher MTTF and lower MTTR','ignores recovery time|equals cache hit rate|equals quorum size'],['Transactions','Prepared 2PC participant','waits for the coordinator decision','immediately forgets state|elects a cache|changes its name'],['Time and Ordering',"Cristian's algorithm",'uses a server time and round-trip estimate','uses a token ring|uses a hash ring|uses a write quorum'],['Time and Ordering',"Berkeley's algorithm",'averages clocks and sends adjustments','uses exact UTC without measurement|deletes slow nodes|runs 2PC'],['Coordination','Ring election','passes identifiers around a logical ring','uses shared memory|uses a DNS tree|uses a database lock'],['Replication','Write quorum overlap','commonly requires 2W > N','requires W = 0|requires W < 1|equals cache size'],['Caching','Cache-aside','application loads misses and fills cache','writes only to cache|never checks cache|requires shared memory']];
let bank=[];concepts.forEach((c,i)=>{for(let v=0;v<3;v++){let o=[c[2],...c[3].split('|')];for(let k=o.length-1;k>0;k--){let j=(i*7+v*3+k)% (k+1);[o[k],o[j]]=[o[j],o[k]]}bank.push({id:'DS'+(bank.length+1),topic:c[0],difficulty:['easy','medium','hard'][v],q:(v===0?c[1]+':':v===1?'Choose the correct explanation of '+c[1]+':':'In a distributed-systems scenario, '+c[1]+' means:'),o,a:o.indexOf(c[2]),e:'Correct concept: '+c[2]+'.'})}});
let state=JSON.parse(localStorage.getItem('dsStudio150')||'{"profile":{},"practice":{},"history":[],"notes":{}}'),timer=null,examRun=null;const app=document.getElementById('app');function save(){localStorage.setItem('dsStudio150',JSON.stringify(state));who.textContent=state.profile.name||'Guest'}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function nums(s){return s.split(',').map(x=>Number(x.trim())).filter(Number.isFinite)}function lines(a){return `<ol>${a.map(x=>`<li>${x}</li>`).join('')}</ol>`}function trace(id,purpose,rule,steps,result){document.getElementById(id).innerHTML=`<div class="trace"><b>Purpose:</b> ${purpose}<p class="formula"><b>Rule:</b> ${rule}</p><b>Step-by-step trace</b>${lines(steps)}<p class="good"><b>Final conclusion:</b> ${result}</p></div>`}
const pages={Dashboard:home,'Study & Practice':practicePage,Simulators:simulators,Laboratories:labs,'Practice Exams':examSetup,Mastery:mastery,Reports:reports,'Profile & Backup':profile};nav.innerHTML=Object.keys(pages).map((x,i)=>`<button class="nav ${i?'':'active'}" onclick="go('${x}',this)">${x}</button>`).join('');function go(n,b){clearInterval(timer);document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));if(b)b.classList.add('active');pages[n]();scrollTo(0,0)}
function home(){app.innerHTML=`<section class="card"><span class="tag">Complete teaching edition</span><h2>Welcome, ${esc(state.profile.name||'student')}</h2><p>The simulator section now explains the purpose, inputs, rule, every algorithm step, and the final conclusion.</p><div class="grid"><div class="box"><div class="big">${bank.length}</div>questions</div><div class="box"><div class="big">10</div>explained simulators</div><div class="box"><div class="big">${Object.keys(state.practice).length}</div>practiced</div><div class="box"><div class="big">${state.history.length}</div>exams</div></div></section>`}
function simulatorCard(title,purpose,inputs,fn,out){return `<div class="sim"><h3>${title}</h3><div class="explain"><b>What it teaches:</b> ${purpose}</div>${inputs}<div class="row"><button class="btn primary" onclick="${fn}">Run step by step</button><button class="btn secondary" onclick="simulators()">Reset example</button></div><div id="${out}"></div></div>`}
function simulators(){app.innerHTML=`<section class="card"><span class="tag">Step-by-step Algorithm Laboratory</span><h2>Understand Each Distributed Algorithm</h2><p>Change the example values, select <b>Run step by step</b>, and read how each decision is made.</p><div class="grid">
${simulatorCard('1. Lamport Logical Clock','How scalar timestamps preserve causal order.','<label>Event sequence: process:type[:target]<input id="lamIn" value="0:local,0:send:1,1:local,1:send:2,2:local"></label><p class="tiny">Processes are 0, 1, 2. A send increments the sender; receive becomes max(local, message)+1.</p>','simLamport()','lamOut')}
${simulatorCard('2. Vector Clock','How vectors distinguish causality from concurrency.','<label>Number of processes<input id="vecN" value="3"></label><label>Sequence<input id="vecIn" value="0:local,0:send:1,2:local,1:send:2"></label>','simVector()','vecOut')}
${simulatorCard("3. Cristian's Clock",'How a client estimates server time using network round-trip delay.','<label>Server time when replying<input id="crS" value="1000"></label><label>Client send time, receive time<input id="crC" value="900,940"></label>','simCristian()','crOut')}
${simulatorCard('4. Berkeley Clock','How a coordinator computes an average and sends clock corrections.','<label>Clock readings<input id="berIn" value="10,14,12,8"></label>','simBerkeley()','berOut')}
${simulatorCard('5. Bully Election','Why the highest active process identifier becomes coordinator.','<label>Active process IDs<input id="bulIDs" value="1,2,4,5"></label><label>Initiator<input id="bulI" value="2"></label>','simBully()','bulOut')}
${simulatorCard('6. Ring Election','How IDs circulate around a logical ring to select a coordinator.','<label>Ring order<input id="ringIDs" value="3,7,2,9,5"></label><label>Initiator<input id="ringI" value="2"></label>','simRing()','ringOut')}
${simulatorCard('7. Replica Quorums','When read and write sets overlap to support strong consistency.','<label>Number of replicas N<input id="qN" value="5"></label><label>Read R, Write W<input id="qRW" value="3,3"></label>','simQuorum()','qOut')}
${simulatorCard('8. Consistent Hashing','How keys are assigned clockwise and why membership changes move fewer keys.','<label>Server positions, e.g. A@10<input id="hashS" value="A@10,B@40,C@75"></label><label>Key positions<input id="hashK" value="5,18,46,80"></label>','simHash()','hashOut')}
${simulatorCard('9. FIFO versus LRU Cache','How eviction policy changes hit count and cache contents.','<label>Reference sequence<input id="cacheR" value="A,B,C,A,D,B,E,A"></label><label>Capacity<input id="cacheN" value="3"></label>','simCache()','cacheOut')}
${simulatorCard('10. Ricart-Agrawala Cost','Why permission-based mutual exclusion uses 2(N-1) messages per entry.','<label>Number of processes N<input id="mxN" value="5"></label>','simMutex()','mxOut')}
</div></section>`}
function simLamport(){let ev=lamIn.value.split(',').map(x=>x.trim()),c=[0,0,0],steps=[];ev.forEach((e,k)=>{let a=e.split(':'),p=+a[0];if(a[1]==='local'){c[p]++;steps.push(`Event ${k+1}: P${p} performs a local event, so its clock increments to ${c[p]}.`)}else{let t=+a[2];c[p]++;let msg=c[p],old=c[t];c[t]=Math.max(c[t],msg)+1;steps.push(`Event ${k+1}: P${p} sends timestamp ${msg} to P${t}. P${t} changes from ${old} to max(${old}, ${msg}) + 1 = ${c[t]}.`)}});trace('lamOut','Assign logical timestamps without requiring synchronized physical clocks.','Local/send: C=C+1. Receive: C=max(C,message)+1.',steps,`Final clocks are P0=${c[0]}, P1=${c[1]}, P2=${c[2]}. A later causal event always has a larger timestamp.`)}
function simVector(){let n=+vecN.value,ev=vecIn.value.split(',').map(x=>x.trim()),v=Array.from({length:n},()=>Array(n).fill(0)),steps=[];ev.forEach((e,k)=>{let a=e.split(':'),p=+a[0];if(a[1]==='local'){v[p][p]++;steps.push(`Event ${k+1}: P${p} increments its own component. P${p}=[${v[p]}].`)}else{let t=+a[2];v[p][p]++;let sent=[...v[p]],before=[...v[t]];v[t]=v[t].map((x,i)=>Math.max(x,sent[i]));v[t][t]++;steps.push(`Event ${k+1}: P${p} sends [${sent}] to P${t}. P${t} merges max([${before}],[${sent}]) then increments itself, producing [${v[t]}].`)}});trace('vecOut','Represent each process knowledge of every process.','Local increment own component. Receive component-wise max, then increment receiver.',steps,`Final vectors: ${v.map((x,i)=>`P${i}=[${x}]`).join('; ')}. Incomparable vectors indicate concurrent events.`)}
function simCristian(){let s=+crS.value,[send,receive]=nums(crC.value);if(!Number.isFinite(s)||receive<send)return crOut.innerHTML='<p class="bad">Enter a valid server time and receive time not earlier than send time.</p>';let rtt=receive-send,one=rtt/2,est=s+one,adj=est-receive;trace('crOut','Estimate server time while accounting for message delay.','RTT=receive-send; one-way delay≈RTT/2; estimate=server time+RTT/2.',[`Client sends its request at ${send}.`,`Client receives the response at ${receive}, so RTT=${receive}-${send}=${rtt}.`,`Estimated one-way delay=${rtt}/2=${one}.`,`Estimated server time at receipt=${s}+${one}=${est}.`,`Client adjustment=${est}-${receive}=${adj}.`],`The client should adjust by ${adj} time units, assuming approximately symmetric network delay.`)}
function simBerkeley(){let a=nums(berIn.value);if(!a.length)return;let avg=a.reduce((s,x)=>s+x,0)/a.length;trace('berOut','Synchronize a group relative to their average, not necessarily UTC.','Average=sum(clock readings)/number of clocks; correction=average-current.',[`Readings are ${a.join(', ')}.`,`Sum=${a.reduce((s,x)=>s+x,0)} and count=${a.length}.`,`Average=${a.reduce((s,x)=>s+x,0)}/${a.length}=${avg.toFixed(2)}.`,...a.map((x,i)=>`Clock ${i+1}: correction=${avg.toFixed(2)}-${x}=${(avg-x).toFixed(2)}.`)],`All clocks are guided toward ${avg.toFixed(2)}; positive corrections advance a clock and negative corrections slow it.`)}
function simBully(){let a=nums(bulIDs.value).sort((x,y)=>x-y),i=+bulI.value;if(!a.includes(i))return bulOut.innerHTML='<p class="bad">The initiator must be one of the active IDs.</p>';let higher=a.filter(x=>x>i),winner=Math.max(...a),steps=[`P${i} detects that the coordinator is unavailable.`,`P${i} sends ELECTION to higher active IDs: ${higher.join(', ')||'none'}.`];higher.forEach(x=>steps.push(`P${x} replies OK because its ID is higher than ${i}.`));steps.push(`P${winner} has no higher active process to defeat it.`,`P${winner} broadcasts COORDINATOR to the other active processes.`);trace('bulOut','Select one coordinator after a detected failure.','Only higher IDs are challenged; the highest active ID wins.',steps,`Process ${winner} becomes coordinator.`)}
function simRing(){let a=nums(ringIDs.value),i=+ringI.value,pos=a.indexOf(i);if(pos<0)return ringOut.innerHTML='<p class="bad">The initiator must appear in the ring.</p>';let path=[...a.slice(pos),...a.slice(0,pos)],max=Math.max(...a),steps=path.map((x,k)=>`Step ${k+1}: P${x} receives the election list, adds/checks its ID, and forwards it to P${path[(k+1)%path.length]}.`);steps.push(`The election message returns to P${i}; the largest collected ID is ${max}.`,`A coordinator message circulates to announce P${max}.`);trace('ringOut','Elect a coordinator using only each process next logical neighbor.','Circulate IDs once; maximum active ID is coordinator.',steps,`Process ${max} is elected after one full ring traversal.`)}
function simQuorum(){let n=+qN.value,[r,w]=nums(qRW.value);if(!n||!r||!w||r>n||w>n)return qOut.innerHTML='<p class="bad">Use positive values with R and W no greater than N.</p>';let rw=r+w>n,ww=2*w>n;trace('qOut','Check whether operations are forced to share at least one replica.','Read/write overlap: R+W>N. Write/write overlap: 2W>N.',[`N=${n}, R=${r}, W=${w}.`,`R+W=${r}+${w}=${r+w}; compare with N=${n}: ${rw?'overlap guaranteed':'overlap not guaranteed'}.`,`2W=2×${w}=${2*w}; compare with N=${n}: ${ww?'write overlap guaranteed':'write overlap not guaranteed'}.`],rw&&ww?'Both read-write and write-write overlap conditions hold.':'One or more overlap conditions fail, so stale reads or conflicting writes may be possible.')}
function simHash(){let servers=hashS.value.split(',').map(x=>{let [n,p]=x.trim().split('@');return {n,p:+p}}).filter(x=>x.n&&Number.isFinite(x.p)).sort((a,b)=>a.p-b.p),keys=nums(hashK.value);if(!servers.length)return;let steps=[`Place servers clockwise: ${servers.map(x=>`${x.n}@${x.p}`).join(' → ')}.`];keys.forEach(k=>{let s=servers.find(x=>x.p>=k)||servers[0];steps.push(`Key ${k}: move clockwise to the first server at or after ${k}; assign it to ${s.n}@${s.p}.`)});trace('hashOut','Assign keys around a ring while limiting remapping after node changes.','A key belongs to the first server clockwise from its hash position.',steps,'Only keys in the affected clockwise interval normally move when a server joins or leaves.')}
function simCache(){let refs=cacheR.value.split(',').map(x=>x.trim()).filter(Boolean),cap=+cacheN.value;if(cap<1)return;function run(type){let c=[],last={},hits=0,steps=[];refs.forEach((x,i)=>{if(c.includes(x)){hits++;steps.push(`${x}: HIT; cache remains [${c}].`)}else{let ev='';if(c.length>=cap){let victim=type==='FIFO'?c[0]:c.reduce((a,b)=>(last[a]??-1)<(last[b]??-1)?a:b);c.splice(c.indexOf(victim),1);ev=` evict ${victim};`}c.push(x);steps.push(`${x}: MISS;${ev} cache becomes [${c}].`)}last[x]=i});return {hits,c,steps}}let f=run('FIFO'),l=run('LRU');trace('cacheOut','Compare insertion-order and recency-based eviction.','FIFO evicts oldest inserted; LRU evicts least recently accessed.',[`FIFO trace:`,...f.steps,`LRU trace:`,...l.steps],`FIFO hits=${f.hits}, final [${f.c}]. LRU hits=${l.hits}, final [${l.c}].`)}
function simMutex(){let n=+mxN.value;if(n<2)return mxOut.innerHTML='<p class="bad">Use at least two processes.</p>';let req=n-1,rep=n-1,total=2*(n-1);trace('mxOut','Calculate communication cost for permission-based mutual exclusion.','Messages per entry=(N-1) REQUEST + (N-1) REPLY = 2(N-1).',[`There are N=${n} processes.`,`The requester sends REQUEST to ${n-1} peers.`,`It must receive REPLY from ${n-1} peers.`,`Total=${req}+${rep}=2(${n}-1)=${total} messages.`],`One critical-section entry needs ${total} messages when there are no failures or deferred replies.`)}
function practicePage(){let topics=[...new Set(bank.map(q=>q.topic))];app.innerHTML=`<section class="card"><h2>Study & Practice</h2><select id="pt">${topics.map(t=>`<option>${t}</option>`).join('')}</select><select id="pc"><option>10</option><option>20</option><option>30</option></select><button class="btn primary" onclick="drawPractice()">Start practice</button><div id="practiceArea"></div></section>`}function drawPractice(){let p=bank.filter(q=>q.topic===pt.value).sort(()=>Math.random()-.5).slice(0,+pc.value);practiceArea.innerHTML=p.map((q,i)=>`<div class="question"><small>${q.topic} • ${q.difficulty}</small><h3>${i+1}. ${q.q}</h3>${q.o.map((o,j)=>`<label class="option"><input type="radio" name="${q.id}" value="${j}"> ${o}</label>`).join('')}<button class="btn secondary" onclick="check('${q.id}')">Check</button><div id="f${q.id}"></div></div>`).join('')}function check(id){let q=bank.find(x=>x.id===id),v=document.querySelector(`input[name="${id}"]:checked`);if(!v)return;let ok=+v.value===q.a;state.practice[id]=ok;save();document.getElementById('f'+id).innerHTML=`<span class="${ok?'good':'bad'}">${ok?'Correct':'Incorrect'}.</span> ${q.e}`}
const labNames=['RPC and Idempotency','Lamport and Vector Clocks','Clock Synchronization','Leader Election','Mutual Exclusion','Replication and Quorums','Caching and Hashing','Two-Phase Commit'];function labs(){app.innerHTML=`<section class="card"><h2>Guided Laboratories</h2>${labNames.map((x,i)=>`<div class="box"><h3>Lab ${i+1}: ${x}</h3><ol><li>State objective and assumptions.</li><li>Run the related simulator.</li><li>Record input, trace, and conclusion.</li><li>Explain one limitation or failure case.</li></ol><textarea id="lab${i}">${esc(state.notes['lab'+i])}</textarea><button class="btn secondary" onclick="state.notes['lab${i}']=document.getElementById('lab${i}').value;save()">Save</button></div>`).join('')}</section>`}
function examSetup(){app.innerHTML=`<section class="card"><h2>Timed Practice Exam</h2><select id="ec"><option>20</option><option>40</option><option>60</option><option>80</option></select><select id="em"><option>20</option><option selected>40</option><option>60</option><option>80</option><option>120</option></select><button class="btn primary" onclick="startExam()">Start exam</button><div id="examArea"></div></section>`}function fmt(s){return Math.floor(Math.max(0,s)/60)+':'+String(Math.max(0,s)%60).padStart(2,'0')}function startExam(){let items=[...bank].sort(()=>Math.random()-.5).slice(0,+ec.value);examRun={items,sec:+em.value*60,start:Date.now(),done:false};examArea.innerHTML=`<div class="box sticky"><span class="timer">Time: <span id="clock">${fmt(examRun.sec)}</span></span></div>${items.map((q,i)=>`<div class="question"><h3>${i+1}. ${q.q}</h3>${q.o.map((o,j)=>`<label class="option"><input type="radio" name="e${i}" value="${j}"> ${o}</label>`).join('')}</div>`).join('')}<button class="btn primary" onclick="submitExam()">Submit</button>`;timer=setInterval(()=>{examRun.sec--;clock.textContent=fmt(examRun.sec);if(examRun.sec<=0)submitExam()},1000)}function submitExam(){if(!examRun||examRun.done)return;examRun.done=true;clearInterval(timer);let score=examRun.items.filter((q,i)=>{let v=document.querySelector(`input[name=e${i}]:checked`);return v&&+v.value===q.a}).length,pct=Math.round(score/examRun.items.length*100),r={date:new Date().toISOString(),score,total:examRun.items.length,pct,time:Math.round((Date.now()-examRun.start)/1000)};state.history.unshift(r);save();examArea.innerHTML=`<div class="box"><div class="big">${score}/${r.total} (${pct}%)</div><p>Time used: ${fmt(r.time)}</p></div>`}
function mastery(){let n=Object.keys(state.practice).length,c=Object.values(state.practice).filter(Boolean).length,p=n?Math.round(c/n*100):0;app.innerHTML=`<section class="card"><h2>Mastery</h2><div class="big">${p}%</div><div class="progress"><div style="width:${p}%"></div></div><p>${n}/${bank.length} questions practiced.</p></section>`}function reports(){app.innerHTML=`<section class="card"><h2>Reports</h2>${state.history.length?state.history.map(r=>`<div class="box">${new Date(r.date).toLocaleString()} • ${r.total} questions • ${r.pct}%</div>`).join(''):'<p>No reports yet.</p>'}</section>`}function profile(){app.innerHTML=`<section class="card"><h2>Profile</h2><input id="pn" placeholder="Name" value="${esc(state.profile.name)}"><button class="btn primary" onclick="state.profile.name=pn.value;save();home()">Save</button></section>`}save();home();
</script></body></html>
