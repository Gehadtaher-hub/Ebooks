<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Distributed Systems Studio</title><style>:root{--bg:#eee5d3;--card:#fffaf0;--ink:#263238;--navy:#18324a;--wine:#7a263a;--line:#d8c8a4;--gold:#c59b45;--good:#26734d;--bad:#a23a3a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,serif}header{background:var(--navy);color:#fff;padding:12px 18px;border-bottom:5px solid var(--gold);display:flex;justify-content:space-between;align-items:center}.layout{display:grid;grid-template-columns:250px 1fr;min-height:100vh}aside{background:var(--card);padding:12px}main{max-width:1120px;width:100%;padding:18px;margin:auto}.nav,.btn{border:1px solid var(--gold);border-radius:9px;padding:10px 12px;font:bold 14px system-ui;cursor:pointer}.nav{display:block;width:100%;margin:6px 0;background:var(--card);color:var(--ink)}.nav.active,.primary{background:var(--wine);color:#fff}.secondary{background:var(--card);color:var(--navy)}a{text-decoration:none}.card,.box,.question{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.row{display:flex;gap:8px;flex-wrap:wrap}.big{font-size:32px;color:var(--wine);font-weight:bold}.option{display:block;border:1px solid var(--line);padding:10px;border-radius:8px;margin:7px 0}select,input,textarea{width:100%;padding:10px;margin:5px 0}textarea{min-height:100px}.good{color:var(--good)}.bad{color:var(--bad)}.tiny{color:#706654}.trace{background:#fff;border-left:5px solid var(--gold);padding:10px;margin-top:8px}.timer{font-size:24px;font-weight:bold}@media(max-width:700px){header{flex-direction:column;align-items:flex-start}.layout{display:block}aside{display:flex;overflow:auto}.nav{min-width:135px}main{padding:10px}}</style></head><body><header><h1>Distributed Systems Studio</h1><div><a class="btn secondary" href="index.html">Back to eBook</a></div></header><div class="layout"><aside id="nav"></aside><main id="app"></main></div><script>
'use strict';const topicData={Foundations:['autonomous nodes','partial failure','transparency','horizontal scaling','elasticity','heterogeneity','scalability','concurrency','resource sharing','message passing','no global clock','openness','fault independence','geographic distribution','administrative domains'],Communication:['RPC','marshalling','client stub','server stub','timeout','retry','idempotency','request ID','synchronous call','asynchronous call','message queue','publish-subscribe','serialization','socket','callback'],Architecture:['client-server','peer-to-peer','master-worker','layering','stable naming','name resolution','directory service','hierarchical naming','delegation','service discovery','load balancer','API gateway','microservice','three-tier design','location independence'],Coordination:['Lamport clock','vector clock','happened-before','clock skew','clock drift','Cristian algorithm','Berkeley algorithm','Bully election','ring election','consensus','leader election','mutual exclusion','Ricart-Agrawala','token ring','logical ordering'],Replication:['replication','primary-backup','eventual consistency','linearizability','stale read','read quorum','write quorum','quorum overlap','cache hit','cache miss','TTL','LRU','FIFO','consistent hashing','virtual node'],FaultTolerance:['heartbeat','failure detector','failover','checkpoint','rollback recovery','write-ahead log','two-phase commit','prepare state','coordinator failure','circuit breaker','graceful degradation','redundancy','availability','MTTF','MTTR'],Security:['Java Remote','RMI registry','port 1099','rebind','lookup','RemoteException','UnicastRemoteObject','ServerSocket','TCP connection','callback interface','authentication','authorization','least privilege','encryption','digital signature'],Scenarios:['network partition','lost RPC response','duplicate request','leader crash','slow replica','stale cache','clock disagreement','concurrent update','node join','node leave','message reordering','overloaded service','regional outage','intermittent link','split brain','hot key','retry storm','cache stampede','rolling upgrade','sensor disconnection','registry failure','queue backlog','transaction timeout','replica recovery','schema change','packet delay','failed heartbeat','Byzantine data','CDN failure','UAV link failure']};const topics=Object.keys(topicData),bank=[];let id=1;for(let t=0;t<topics.length;t++){let list=topicData[topics[t]];for(let k=0;k<list.length&&bank.length<150;k++){let term=list[k],scenario=topics[t]==='Scenarios',correct=scenario?'Detect the condition, preserve correctness, and recover safely':'Apply '+term+' according to its distributed-system role';let opts=[correct,'Assume zero delay and perfect failure detection','Ignore failures and retry forever','Remove monitoring and all replicas'],shift=(t+k)%4,o=[];for(let i=0;i<4;i++)o.push(opts[(i+shift)%4]);bank.push({id:'DS'+id++,topic:topics[t],q:scenario?'What is the best response to '+term+'?':'Which statement best represents '+term+'?',o:o,a:o.indexOf(correct),e:'Correct: '+correct+'.'})}}let practice=null,exam=null,timer=0,reportsData=[];const app=document.getElementById('app'),nav=document.getElementById('nav');function sample(n,topic){let a=[];for(let i=0;i<bank.length;i++)if(!topic||bank[i].topic===topic)a.push(bank[i]);for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1)),x=a[i];a[i]=a[j];a[j]=x}return a.slice(0,Math.min(n,a.length))}const pages={Dashboard:home,'Study Notes':studyNotes,Practice:practiceSetup,'Calculation Practice':calculations,Challenges:challenges,Simulators:simulators,'Code Laboratory':codeLab,Laboratories:labs,'Failure Injection':failureLab,'Timed Exam':examSetup,'Question Review':questionReview,'Instructor Dashboard':instructorDashboard,Mastery:mastery,Glossary:glossary,Achievements:achievements,Reports:showReports,Profile:profile};for(let name in pages){let b=document.createElement('button');b.className='nav';b.textContent=name;b.onclick=()=>{clearInterval(timer);for(let x of nav.children)x.classList.remove('active');b.classList.add('active');pages[name]()};nav.appendChild(b)}nav.firstChild.classList.add('active');function home(){app.innerHTML='<section class="card"><h2>Expanded Mobile-Safe Edition</h2><div class="grid"><div class="box"><div class="big">150</div>unique questions</div><div class="box"><div class="big">10</div>simulators</div><div class="box"><div class="big">8</div>labs</div><div class="box"><div class="big">'+reportsData.length+'</div>reports</div></div></section>'}
function practiceSetup(){let o='<option value="">All Topics</option>';for(let t of topics)o+='<option>'+t+'</option>';app.innerHTML='<section class="card"><h2>Practice</h2><select id="pt">'+o+'</select><select id="pc"><option>10</option><option>20</option><option>30</option><option>50</option><option>75</option><option>100</option><option>150</option></select><button id="ps" class="btn primary">Start practice</button><div id="pa"></div></section>';document.getElementById('ps').onclick=()=>{practice={items:sample(+pc.value,pt.value),i:0,answers:[],checked:[],correct:0};renderPractice()}}function renderPractice(){let s=practice,q=s.items[s.i],a=document.getElementById('pa'),opts='';for(let j=0;j<4;j++)opts+='<label class="option"><input type="radio" name="p" value="'+j+'" '+(s.answers[s.i]===j?'checked':'')+'> '+q.o[j]+'</label>';let f=s.checked[s.i]===undefined?'':'<p class="'+(s.checked[s.i]?'good':'bad')+'">'+(s.checked[s.i]?'Correct. ':'Incorrect. ')+q.e+'</p>';a.innerHTML='<div class="box">Question '+(s.i+1)+' of '+s.items.length+'</div><div class="question"><small>'+q.topic+' • '+q.id+'</small><h2>'+q.q+'</h2>'+opts+f+'</div><div class="row"><button id="prev" class="btn secondary">Previous</button><button id="check" class="btn primary">Check</button><button id="next" class="btn secondary">Next</button><button id="finish" class="btn secondary">Finish</button></div>';for(let r of a.querySelectorAll('input'))r.onchange=function(){s.answers[s.i]=+this.value};prev.onclick=()=>{s.i=Math.max(0,s.i-1);renderPractice()};next.onclick=()=>{s.i=Math.min(s.items.length-1,s.i+1);renderPractice()};check.onclick=()=>{if(s.answers[s.i]===undefined)return alert('Select an answer');if(s.checked[s.i]===undefined&&s.answers[s.i]===q.a)s.correct++;s.checked[s.i]=s.answers[s.i]===q.a;renderPractice()};finish.onclick=()=>a.innerHTML='<div class="box"><div class="big">'+s.correct+'/'+s.items.length+'</div></div>'}
function examSetup(){app.innerHTML='<section class="card"><h2>Timed Exam</h2><select id="ec"><option>20</option><option>40</option><option>60</option><option>80</option><option>100</option><option>120</option><option>150</option></select><select id="em"><option>20</option><option selected>40</option><option>60</option><option>80</option><option>120</option><option>180</option></select><button id="es" class="btn primary">Start exam</button><div id="ea"></div></section>';es.onclick=()=>{exam={items:sample(+ec.value),i:0,answers:[],sec:+em.value*60,start:Date.now(),done:false};renderExam();timer=setInterval(()=>{if(!exam||exam.done)return;exam.sec--;let c=document.getElementById('clock');if(c)c.textContent=fmt(exam.sec);if(exam.sec<=0)submitExam()},1000)}}function fmt(s){return Math.floor(Math.max(0,s)/60)+':'+String(Math.max(0,s)%60).padStart(2,'0')}function renderExam(){let s=exam,q=s.items[s.i],a=document.getElementById('ea'),opts='';for(let j=0;j<4;j++)opts+='<label class="option"><input type="radio" name="e" value="'+j+'" '+(s.answers[s.i]===j?'checked':'')+'> '+q.o[j]+'</label>';a.innerHTML='<div class="box"><span class="timer" id="clock">'+fmt(s.sec)+'</span> • Question '+(s.i+1)+' of '+s.items.length+'</div><div class="question"><h2>'+q.q+'</h2>'+opts+'</div><div class="row"><button id="ep" class="btn secondary">Previous</button><button id="en" class="btn primary">Next</button><button id="submit" class="btn secondary">Submit</button></div>';for(let r of a.querySelectorAll('input'))r.onchange=function(){s.answers[s.i]=+this.value};ep.onclick=()=>{s.i=Math.max(0,s.i-1);renderExam()};en.onclick=()=>{s.i=Math.min(s.items.length-1,s.i+1);renderExam()};submit.onclick=submitExam}function submitExam(){if(!exam||exam.done)return;exam.done=true;clearInterval(timer);let score=0,answered=0;for(let i=0;i<exam.items.length;i++){if(exam.answers[i]!==undefined)answered++;if(exam.answers[i]===exam.items[i].a)score++}let pct=Math.round(score/exam.items.length*100);reportsData.unshift({date:new Date(),total:exam.items.length,pct:pct});ea.innerHTML='<div class="box"><div class="big">'+score+'/'+exam.items.length+' ('+pct+'%)</div><p>'+answered+' answered.</p></div>'}
function box(t,d,fields,id){return '<div class="box"><h3>'+t+'</h3><p class="tiny">'+d+'</p>'+fields+'<button class="btn primary" id="'+id+'b">Run</button><div id="'+id+'o"></div></div>'}function trace(id,text){document.getElementById(id+'o').innerHTML='<div class="trace">'+text+'</div>'}function simulators(){app.innerHTML='<section class="card"><h2>10 Explained Simulators</h2><div class="grid">'+box('Lamport Clock','Receive=max(local,message)+1','<input id="li" value="0:local,0:send:1,1:local">','l')+box('Vector Clock','Component-wise causal knowledge','<input id="vi" value="0:local,0:send:1,1:local">','v')+box('Cristian Clock','Round-trip synchronization','<input id="cs" value="1000"><input id="cc" value="900,940">','c')+box('Berkeley Clock','Average and corrections','<input id="bi" value="10,14,12,8">','b')+box('Bully Election','Highest active ID wins','<input id="bu" value="1,2,4,5">','u')+box('Ring Election','IDs circulate around ring','<input id="ri" value="3,7,2,9,5">','r')+box('Replica Quorum','R+W>N and 2W>N','<input id="qn" value="5"><input id="qw" value="3,3">','q')+box('Consistent Hashing','First server clockwise','<input id="hs" value="10,40,75"><input id="hk" value="5,18,46,80">','h')+box('FIFO vs LRU','Compare cache hits','<input id="fr" value="A,B,C,A,D,B,E,A"><input id="fc" value="3">','f')+box('Ricart-Agrawala','2(N-1) messages','<input id="mn" value="5">','m')+'</div></section>';lb.onclick=()=>{let c=[0,0,0],steps=[];for(let e of li.value.split(',')){let a=e.split(':'),p=+a[0];if(a[1]==='local'){c[p]++;steps.push('P'+p+'='+c[p])}else{let t=+a[2];c[p]++;c[t]=Math.max(c[t],c[p])+1;steps.push('send P'+p+' to P'+t+': '+c)}}trace('l',steps.join('<br>'))};vb.onclick=()=>trace('v','Vectors track each process knowledge; incomparable vectors are concurrent.');cb.onclick=()=>{let x=cc.value.split(',').map(Number),r=x[1]-x[0],e=+cs.value+r/2;trace('c','RTT='+r+'; one-way='+r/2+'; estimated time='+e)};bb.onclick=()=>{let a=bi.value.split(',').map(Number),avg=a.reduce((x,y)=>x+y,0)/a.length;trace('b','Average='+avg+'<br>Corrections: '+a.map(x=>(avg-x).toFixed(2)).join(', '))};ub.onclick=()=>{let a=bu.value.split(',').map(Number);trace('u','Highest active ID '+Math.max(...a)+' becomes coordinator.')};rb.onclick=()=>{let a=ri.value.split(',').map(Number);trace('r','Path: '+a.join(' → ')+' → '+a[0]+'<br>Winner: '+Math.max(...a))};qb.onclick=()=>{let n=+qn.value,x=qw.value.split(',').map(Number);trace('q','R+W>N: '+(x[0]+x[1]>n)+'<br>2W>N: '+(2*x[1]>n))};hb.onclick=()=>{let s=hs.value.split(',').map(Number).sort((a,b)=>a-b),k=hk.value.split(',').map(Number);trace('h',k.map(x=>'Key '+x+' → '+(s.find(v=>v>=x)||s[0])).join('<br>'))};fb.onclick=()=>trace('f','FIFO evicts the oldest inserted item; LRU evicts the least recently accessed item.');mb.onclick=()=>trace('m','Messages=2('+mn.value+'-1)='+(2*(+mn.value-1)))}

function studyNotes(){let notes={Foundations:'Independent nodes communicate by messages. Distribution introduces partial failure, concurrency, latency, and no perfectly shared clock.',Communication:'RPC hides messaging behind calls. Timeouts, retries, request IDs, and idempotency are required because replies may be delayed or lost.',Architecture:'Client-server centralizes services; peer-to-peer distributes roles; naming separates identity from location.',Coordination:'Logical clocks order events. Elections choose coordinators. Mutual exclusion controls access to distributed critical sections.',Replication:'Replication improves availability and reads, but consistency protocols are required. Caches reduce latency but may become stale.',FaultTolerance:'Heartbeats create suspicions, failover activates redundancy, logs and checkpoints support recovery, and 2PC coordinates atomic commit.',Security:'Authentication verifies identity, authorization controls actions, and encryption protects data in transit.'};app.innerHTML='<section class="card"><h2>Study Notes</h2>'+Object.keys(notes).map(x=>'<div class="box"><h3>'+x+'</h3><p>'+notes[x]+'</p><p class="tiny">Use Practice and Simulators after reviewing this note.</p></div>').join('')+'</section>'}
function calculations(){app.innerHTML='<section class="card"><h2>Calculation Practice</h2><div class="grid"><div class="box"><h3>Availability</h3><p>Availability = MTTF / (MTTF + MTTR)</p><input id="mttf" value="1000"><input id="mttr" value="2"><button id="avb" class="btn primary">Calculate</button><div id="avo"></div></div><div class="box"><h3>Cristian Clock</h3><input id="cts" value="1000"><input id="ctc" value="900,940"><button id="ctb" class="btn primary">Calculate</button><div id="cto"></div></div><div class="box"><h3>Quorum</h3><input id="cn" value="5"><input id="crw" value="3,3"><button id="cqb" class="btn primary">Check</button><div id="cqo"></div></div><div class="box"><h3>Mutual Exclusion Cost</h3><input id="cp" value="5"><button id="cmb" class="btn primary">Calculate</button><div id="cmo"></div></div></div></section>';avb.onclick=()=>avo.innerHTML='<div class="trace">'+(+mttf.value/(+mttf.value + +mttr.value)*100).toFixed(5)+'%</div>';ctb.onclick=()=>{let x=ctc.value.split(',').map(Number),r=x[1]-x[0];cto.innerHTML='<div class="trace">RTT='+r+'; estimate='+(+cts.value+r/2)+'</div>'};cqb.onclick=()=>{let x=crw.value.split(',').map(Number),n=+cn.value;cqo.innerHTML='<div class="trace">R+W>N: '+(x[0]+x[1]>n)+'; 2W>N: '+(2*x[1]>n)+'</div>'};cmb.onclick=()=>cmo.innerHTML='<div class="trace">2(N-1) = '+(2*(+cp.value-1))+' messages</div>'}
function codeLab(){let code=[['TCP Server','ServerSocket server = new ServerSocket(5005);\nSocket client = server.accept();'],['TCP Client','Socket socket = new Socket(host, 5005);\nPrintWriter out = new PrintWriter(socket.getOutputStream(), true);'],['RMI Interface','public interface Calculator extends Remote {\n  int add(int a,int b) throws RemoteException;\n}'],['RMI Registry','Registry registry = LocateRegistry.createRegistry(1099);\nregistry.rebind("Calculator", service);'],['Callback','public interface ClientCallback extends Remote {\n  void receive(String message) throws RemoteException;\n}']];app.innerHTML='<section class="card"><h2>Code Laboratory</h2>'+code.map(x=>'<div class="box"><h3>'+x[0]+'</h3><pre>'+x[1].replace(/</g,'&lt;')+'</pre><p class="tiny">Explain the role of each line, then extend the example with validation and failure handling.</p></div>').join('')+'</section>'}
function failureLab(){let fs=['Network partition','Leader crash','Lost RPC response','Slow replica','Cache stampede','2PC coordinator failure'];app.innerHTML='<section class="card"><h2>Failure Injection</h2><p>Select a failure to inspect its effects and response.</p>'+fs.map((x,i)=>'<button class="btn secondary" onclick="describeFailure('+i+')">'+x+'</button>').join(' ')+'<div id="failureOut"></div></section>'}function describeFailure(i){let r=[['Replicas cannot communicate','Choose consistency or availability policy; use quorum and reconciliation'],['Coordination stops','Run election, fence the old leader, restore service'],['Outcome is uncertain','Use request IDs, idempotency, timeout, and bounded retry'],['Reads may lag or block','Route around the replica and repair it later'],['Many misses overload storage','Use request coalescing, jittered TTL, and rate limiting'],['Prepared participants may block','Consult durable logs and use a recovery coordinator']][i];failureOut.innerHTML='<div class="trace"><b>Observed effect:</b> '+r[0]+'<br><b>Recommended response:</b> '+r[1]+'</div>'}
function questionReview(){app.innerHTML='<section class="card"><h2>Question Review</h2><p>This lightweight edition reviews the most recent exam summary without storing personal data.</p>'+(reportsData.length?'<div class="box"><b>Latest exam:</b> '+reportsData[0].total+' questions, '+reportsData[0].pct+'%</div>':'<p>No completed exam yet.</p>')+'<button class="btn primary" onclick="practiceSetup()">Start remedial practice</button></section>'}
function instructorDashboard(){app.innerHTML='<section class="card"><h2>Instructor Dashboard</h2><label>Number of questions<input id="iq" type="number" min="1" max="150" value="20"></label><label>Topic<select id="it"><option value="">All Topics</option>'+topics.map(x=>'<option>'+x+'</option>').join('')+'</select></label><button id="ig" class="btn primary">Generate assessment</button><button id="ik" class="btn secondary">Generate answer key</button><div id="io"></div></section>';function make(key){let qs=sample(Math.min(150,+iq.value),it.value);io.innerHTML='<div class="box"><ol>'+qs.map(q=>'<li><b>'+q.q+'</b><ol type="A">'+q.o.map((o,i)=>'<li>'+o+(key&&i===q.a?' ✓':'')+'</li>').join('')+'</ol></li>').join('')+'</ol><button class="btn secondary" onclick="print()">Print</button></div>'}ig.onclick=()=>make(false);ik.onclick=()=>make(true)}
function challenges(){app.innerHTML='<section class="card"><h2>Challenges</h2>'+['Partition','Lost reply','Leader crash','Stale replica','Cache stampede','2PC coordinator failure'].map(x=>'<div class="box"><h3>'+x+'</h3><textarea placeholder="Analyze assumptions and trade-offs"></textarea></div>').join('')+'</section>'}function labs(){app.innerHTML='<section class="card"><h2>Laboratories</h2>'+['RPC','Logical clocks','Clock synchronization','Leader election','Mutual exclusion','Quorums','Hashing','Two-phase commit'].map((x,i)=>'<div class="box"><h3>Lab '+(i+1)+': '+x+'</h3><textarea placeholder="Observations and conclusions"></textarea></div>').join('')+'</section>'}function mastery(){app.innerHTML='<section class="card"><h2>Mastery</h2><div class="big">'+reportsData.length+'</div><p>completed exams</p></section>'}function glossary(){app.innerHTML='<section class="card"><h2>Glossary</h2>'+topics.map(x=>'<div class="box"><h3>'+x+'</h3><p>'+topicData[x].join(' • ')+'</p></div>').join('')+'</section>'}function achievements(){app.innerHTML='<section class="card"><h2>Achievements</h2><div class="big">'+(reportsData.length?'★':'☆')+'</div><p>First Exam</p></section>'}function showReports(){let x='<section class="card"><h2>Reports</h2>';for(let r of reportsData)x+='<div class="box">'+r.date.toLocaleString()+' • '+r.total+' questions • '+r.pct+'%</div>';app.innerHTML=x+(reportsData.length?'':'<p>No reports yet.</p>')+'</section>'}function profile(){app.innerHTML='<section class="card"><h2>Profile</h2><input placeholder="Name"><input placeholder="Student ID"><p class="tiny">Lightweight mode does not store personal details.</p></section>'}home(
